services:
  max-recruiting-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appstroy-max-recruiting-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATA_FILE: /app/data/bot-data.json
    volumes:
      - ./data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
