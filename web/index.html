<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <script id="appstroy-locale-guard">
    (function () {
      var fallbackLocale = 'ru-RU';
      var normalizeLocale = function (value) {
        if (typeof value !== 'string') return fallbackLocale;
        var clean = value.trim().replace(/_/g, '-').replace(/@.*$/, '');
        if (!clean) return fallbackLocale;
        try {
          return new Intl.Locale(clean).toString();
        } catch (_) {
          var language = clean.split('-')[0].toLowerCase();
          return /^[a-z]{2,3}$/.test(language) ? language : fallbackLocale;
        }
      };

      var sourceLanguages = Array.isArray(navigator.languages)
        ? navigator.languages
        : [navigator.language];
      var normalizedLanguages = sourceLanguages
        .map(normalizeLocale)
        .filter(function (value, index, values) {
          return values.indexOf(value) === index;
        });
      var normalizedLanguage = normalizeLocale(navigator.language);
      if (normalizedLanguages.length === 0) {
        normalizedLanguages = [normalizedLanguage];
      }

      var overrideNavigatorValue = function (target, key, value) {
        if (!target) return false;
        try {
          Object.defineProperty(target, key, {
            configurable: true,
            get: function () { return value; }
          });
          return true;
        } catch (_) {
          return false;
        }
      };

      var navigatorPrototype = window.Navigator && window.Navigator.prototype;
      overrideNavigatorValue(navigatorPrototype, 'language', normalizedLanguage);
      overrideNavigatorValue(navigatorPrototype, 'languages', normalizedLanguages);
      overrideNavigatorValue(navigator, 'language', normalizedLanguage);
      overrideNavigatorValue(navigator, 'languages', normalizedLanguages);
      window.appstroyBrowserLocale = normalizedLanguage;
    })();
  </script>

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <meta name="description" content="AppСтрой — управление сотрудниками, табелем, задачами, выплатами и документами на строительном объекте.">
  <meta id="app-theme-color" name="theme-color" content="#F3F1EC">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta id="app-status-bar-style" name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AppСтрой">
  <meta name="application-name" content="AppСтрой">

  <link id="app-apple-icon" rel="apple-touch-icon" href="icons/AppStroy-192-v3.png">
  <link id="app-favicon-png" rel="icon" type="image/png" href="favicon-v3.png">
  <link id="app-favicon-svg" rel="icon" type="image/svg+xml" href="icons/app_icon_matte_v3.svg">
  <link id="app-manifest" rel="manifest" href="manifest.json">
  <title>AppСтрой</title>

  <script>
    (function () {
      var lightTheme = {
        mode: 'light',
        color: '#F3F1EC',
        icon: 'icons/app_icon_matte_v3.svg',
        appleIcon: 'icons/AppStroy-192-v3.png',
        pngIcon: 'favicon-v3.png',
        manifest: 'manifest.json',
        statusBar: 'default'
      };
      var darkTheme = {
        mode: 'dark',
        color: '#141517',
        icon: 'icons/app_icon_matte_dark_v3.svg',
        appleIcon: 'icons/AppStroy-dark-192-v3.png',
        pngIcon: 'favicon-dark-v3.png',
        manifest: 'manifest-dark.json',
        statusBar: 'black-translucent'
      };

      var readStoredTheme = function () {
        try {
          var keys = ['flutter.app_theme_mode', 'app_theme_mode'];
          for (var index = 0; index < keys.length; index += 1) {
            var raw = window.localStorage.getItem(keys[index]);
            if (raw == null) continue;
            var value = raw;
            try { value = JSON.parse(raw); } catch (_) {}
            if (value === 'dark' || value === 'light') return value;
          }
        } catch (_) {}
        return 'light';
      };

      var setHref = function (id, href) {
        var element = document.getElementById(id);
        if (element) element.setAttribute('href', href);
      };

      window.appstroyApplyTheme = function (mode) {
        var theme = mode === 'dark' ? darkTheme : lightTheme;
        document.documentElement.dataset.appTheme = theme.mode;
        document.documentElement.style.colorScheme = theme.mode;
        document.documentElement.style.backgroundColor = theme.color;
        document.body && (document.body.style.backgroundColor = theme.color);

        var themeColor = document.getElementById('app-theme-color');
        if (themeColor) themeColor.setAttribute('content', theme.color);
        var statusBar = document.getElementById('app-status-bar-style');
        if (statusBar) statusBar.setAttribute('content', theme.statusBar);

        setHref('app-favicon-svg', theme.icon);
        setHref('app-favicon-png', theme.pngIcon);
        setHref('app-apple-icon', theme.appleIcon);
        setHref('app-manifest', theme.manifest);
      };

      window.appstroyReadStoredTheme = readStoredTheme;
      window.appstroyApplyTheme(readStoredTheme());
    })();
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #F3F1EC;
      overscroll-behavior: none;

      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    html[data-app-theme="dark"],
    html[data-app-theme="dark"] body {
      background: #141517;
    }

    body {
      position: relative;
      min-height: 100dvh;
    }

    flutter-view,
    flt-glass-pane {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var deferredPwaPrompt = null;

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPwaPrompt = event;
        window.dispatchEvent(new CustomEvent('appstroy-pwa-install-available'));
      });

      window.appstroyCanInstallPwa = function () {
        return Boolean(deferredPwaPrompt);
      };

      window.appstroyInstallPwa = async function () {
        var standalone = window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        if (standalone) return { status: 'installed' };
        if (!deferredPwaPrompt) return { status: 'unavailable' };

        var prompt = deferredPwaPrompt;
        deferredPwaPrompt = null;
        await prompt.prompt();
        var choice = await prompt.userChoice;
        return { status: choice && choice.outcome ? choice.outcome : 'dismissed' };
      };

      window.addEventListener('appinstalled', function () {
        deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('appstroy-pwa-installed'));
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
