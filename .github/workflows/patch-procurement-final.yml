name: Patch procurement final

on:
  push:
    branches:
      - codex/procurement-panel-mvp-20260801
    paths:
      - tool/patch_procurement_final.py
      - .github/workflows/patch-procurement-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/procurement-panel-mvp-20260801
          fetch-depth: 0

      - name: Apply final patches
        run: python3 tool/patch_procurement_final.py

      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/invite-company-member-core/index.ts \
            lib/features/developer/data/role_acceptance_repository.dart
          git commit -m "Завершить серверную поддержку роли снабженца"
          git push origin HEAD:codex/procurement-panel-mvp-20260801
