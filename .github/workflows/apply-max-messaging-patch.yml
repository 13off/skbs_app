name: Apply MAX messaging patch

on:
  push:
    paths:
      - .github/workflows/apply-max-messaging-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AppStroy MAX messaging
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          models = 'lib/features/recruitment/models/recruitment_models.dart'
          replace_once(
              models,
              "  bool get canMessageInTelegram =>\n      source == 'telegram' && sourceChatId.trim().isNotEmpty;\n",
              "  bool get canMessageInTelegram =>\n      source == 'telegram' && sourceChatId.trim().isNotEmpty;\n  bool get canMessageInMax =>\n      source == 'max' && sourceUserId.trim().isNotEmpty;\n  bool get canMessageInBot => canMessageInTelegram || canMessageInMax;\n\n  String get messageChannelTitle => canMessageInMax ? 'MAX' : 'Telegram';\n",
          )

          repository = Path('lib/features/recruitment/data/recruitment_repository.dart')
          repository_text = repository.read_text(encoding='utf-8')
          pattern = re.compile(
              r"  static Future<void> sendCandidateMessage\(\{.*?\n  \}\n\n  static Future<List<RecruitmentObjectOption>> fetchObjects",
              re.S,
          )
          replacement = """  static Future<void> sendCandidateMessage({
    required String applicationId,
    required String message,
    required String source,
  }) async {
    final cleanApplicationId = applicationId.trim();
    final cleanSource = source.trim().toLowerCase();
    if (cleanSource == 'telegram') {
      await _client.rpc(
        'activate_recruitment_telegram_conversation',
        params: <String, dynamic>{'p_application_id': cleanApplicationId},
      );
    }

    final response = await _client.functions.invoke(
      'recruitment-candidate-action',
      body: <String, dynamic>{
        'action': 'send_message',
        'application_id': cleanApplicationId,
        'message': message.trim(),
      },
    );
    final data = _map(response.data);
    final error = data['error']?.toString().trim() ?? '';
    if (response.status < 200 || response.status >= 300 || error.isNotEmpty) {
      throw Exception(error.isEmpty ? 'Не удалось отправить сообщение' : error);
    }
    _notify(cleanApplicationId);
  }

  static Future<List<RecruitmentObjectOption>> fetchObjects"""
          repository_text, count = pattern.subn(replacement, repository_text, count=1)
          if count != 1:
              raise SystemExit(f'Repository method replacement count: {count}')
          repository.write_text(repository_text, encoding='utf-8')

          detail = 'lib/features/recruitment/presentation/recruitment_application_detail_screen.dart'
          replace_once(
              detail,
              "        applicationId: widget.application.id,\n        message: text,\n",
              "        applicationId: widget.application.id,\n        message: text,\n        source: widget.application.source,\n",
          )
          replace_once(
              detail,
              "            child: widget.application.canMessageInTelegram\n",
              "            child: widget.application.canMessageInBot\n",
          )
          replace_once(
              detail,
              "                            hintText: 'Сообщение',\n                            prefixIcon: Icon(Icons.telegram),\n",
              "                            hintText: widget.application.canMessageInMax\n                                ? 'Сообщение в MAX'\n                                : 'Сообщение в Telegram',\n                            prefixIcon: Icon(\n                              widget.application.canMessageInMax\n                                  ? Icons.chat_bubble_outline_rounded\n                                  : Icons.telegram,\n                            ),\n",
          )
          replace_once(
              detail,
              "                        'Эта заявка создана не через Telegram-бота. Для связи используйте номер телефона.',\n",
              "                        'Эта заявка создана вручную. Для связи используйте номер телефона.',\n",
          )

          Path('.github/workflows/apply-max-messaging-patch.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Подключить переписку с кандидатами через MAX"
          git push
