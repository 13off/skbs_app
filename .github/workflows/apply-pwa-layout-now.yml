name: Apply PWA layout now

on:
  push:
    paths:
      - '.github/workflows/apply-pwa-layout-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Apply global PWA page frame and compact navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: found {count} matches')
              return text.replace(old, new, 1)

          write(
              'lib/widgets/pwa_desktop_page_frame.dart',
              textwrap.dedent("""
                  import 'package:flutter/foundation.dart';
                  import 'package:flutter/material.dart';

                  import '../app/app_ui_tokens.dart';

                  /// Gives every wide PWA route the same physical outer margin.
                  class PwaDesktopPageFrame extends StatelessWidget {
                    final Widget child;

                    const PwaDesktopPageFrame({super.key, required this.child});

                    static bool isApplied(BuildContext context) {
                      return context
                              .dependOnInheritedWidgetOfExactType<_PwaDesktopPageFrameScope>() !=
                          null;
                    }

                    @override
                    Widget build(BuildContext context) {
                      final media = MediaQuery.of(context);
                      final enabled =
                          kIsWeb && media.size.width >= AppUi.desktopBreakpoint;
                      if (!enabled) return child;

                      const horizontal = AppUi.pageDesktopHorizontalPadding;
                      final contentWidth =
                          (media.size.width - horizontal * 2).clamp(0.0, double.infinity);

                      return ColoredBox(
                        color: Theme.of(context).scaffoldBackgroundColor,
                        child: Padding(
                          padding: const EdgeInsets.symmetric(horizontal: horizontal),
                          child: MediaQuery(
                            data: media.copyWith(
                              size: Size(contentWidth.toDouble(), media.size.height),
                            ),
                            child: _PwaDesktopPageFrameScope(child: child),
                          ),
                        ),
                      );
                    }
                  }

                  class _PwaDesktopPageFrameScope extends InheritedWidget {
                    const _PwaDesktopPageFrameScope({required super.child});

                    @override
                    bool updateShouldNotify(_PwaDesktopPageFrameScope oldWidget) => false;
                  }
              """).lstrip(),
          )

          tokens_path = 'lib/app/app_ui_tokens.dart'
          tokens = read(tokens_path)
          if 'desktopNavigationMaxWidth' not in tokens:
              tokens = one(
                  tokens,
                  '  static const double desktopNavigationPanelHeight = 78;\n',
                  '  static const double desktopNavigationPanelHeight = 78;\n'
                  '  // 470 logical px renders near 10 cm after the default scale.\n'
                  '  static const double desktopNavigationMaxWidth = 470;\n',
                  'navigation width token',
              )
          write(tokens_path, tokens)

          main_path = 'lib/main.dart'
          main = read(main_path)
          if "widgets/pwa_desktop_page_frame.dart" not in main:
              main = one(
                  main,
                  "import 'services/push_notification_service.dart';\n",
                  "import 'services/push_notification_service.dart';\n"
                  "import 'widgets/pwa_desktop_page_frame.dart';\n",
                  'main import',
              )
          pattern = re.compile(
              r"builder:\s*\(context, child\)\s*=>\s*AppScaleViewport\(\s*"
              r"scale:\s*themeController\.uiScale,\s*"
              r"child:\s*child\s*\?\?\s*const SizedBox\.shrink\(\),\s*\),",
              re.S,
          )
          main, count = pattern.subn(
              """builder: (context, child) => PwaDesktopPageFrame(
                    child: AppScaleViewport(
                      scale: themeController.uiScale,
                      child: child ?? const SizedBox.shrink(),
                    ),
                  ),""",
              main,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'MaterialApp builder: found {count} matches')
          write(main_path, main)

          page_path = 'lib/widgets/app_page.dart'
          page = read(page_path)
          if "pwa_desktop_page_frame.dart" not in page:
              page = one(
                  page,
                  "import 'liquid_glass.dart';\n",
                  "import 'liquid_glass.dart';\nimport 'pwa_desktop_page_frame.dart';\n",
                  'AppPage import',
              )
          pattern = re.compile(
              r"final horizontalPadding = isDesktop\s*\?\s*"
              r"AppUi\.pageDesktopHorizontalPadding\s*:\s*"
              r"AppUi\.pageMobileHorizontalPadding;"
          )
          page, count = pattern.subn(
              """final horizontalPadding = isDesktop
                  ? PwaDesktopPageFrame.isApplied(context)
                        ? 0.0
                        : AppUi.pageDesktopHorizontalPadding
                  : AppUi.pageMobileHorizontalPadding;""",
              page,
          )
          if count != 2:
              raise SystemExit(f'AppPage padding: found {count} matches')
          write(page_path, page)

          nav_path = 'lib/widgets/professional_bottom_navigation.dart'
          nav = read(nav_path)
          if 'AppUi.desktopNavigationMaxWidth' not in nav:
              nav = one(
                  nav,
                  'constraints: const BoxConstraints(maxWidth: double.infinity),',
                  'constraints: BoxConstraints(\n'
                  '                maxWidth: isDesktop\n'
                  '                    ? AppUi.desktopNavigationMaxWidth\n'
                  '                    : double.infinity,\n'
                  '              ),',
                  'navigation max width',
              )
              nav = one(nav, 'horizontal: isDesktop ? 14 : 4,', 'horizontal: 4,', 'item padding')
              nav = one(nav, 'const SizedBox(width: 10),', 'const SizedBox(width: 4),', 'item gap')
              nav = one(nav, 'fontSize: 13,', 'fontSize: 10.5,', 'label size')
          write(nav_path, nav)

          for path in Path('test').rglob('*.dart'):
              value = path.read_text(encoding='utf-8')
              value = value.replace(
                  "contains('builder: (context, child) => AppScaleViewport(')",
                  "contains('builder: (context, child) => PwaDesktopPageFrame(')",
              )
              path.write_text(value, encoding='utf-8')

          write(
              'test/pwa_global_page_frame_contract_test.dart',
              textwrap.dedent("""
                  import 'dart:io';

                  import 'package:flutter_test/flutter_test.dart';

                  String source(String path) => File(path).readAsStringSync();

                  void main() {
                    test('one PWA frame covers every application page', () {
                      final main = source('lib/main.dart');
                      final frame = source('lib/widgets/pwa_desktop_page_frame.dart');
                      final page = source('lib/widgets/app_page.dart');

                      expect(main, contains('builder: (context, child) => PwaDesktopPageFrame('));
                      expect(main, contains('child: AppScaleViewport('));
                      expect(frame, contains('horizontal = AppUi.pageDesktopHorizontalPadding'));
                      expect(frame, contains('media.copyWith('));
                      expect(page, contains('PwaDesktopPageFrame.isApplied(context)'));
                    });

                    test('desktop bottom navigation stays near ten centimetres', () {
                      final tokens = source('lib/app/app_ui_tokens.dart');
                      final navigation = source(
                        'lib/widgets/professional_bottom_navigation.dart',
                      );

                      expect(tokens, contains('desktopNavigationMaxWidth = 470'));
                      expect(navigation, contains('AppUi.desktopNavigationMaxWidth'));
                      expect(navigation, contains('child: Center('));
                    });
                  }
              """).lstrip(),
          )
          PY

      - name: Format changed code
        run: |
          dart format \
            lib/main.dart \
            lib/app/app_ui_tokens.dart \
            lib/widgets/app_page.dart \
            lib/widgets/pwa_desktop_page_frame.dart \
            lib/widgets/professional_bottom_navigation.dart \
            test/global_ui_scale_contract_test.dart \
            test/pwa_global_page_frame_contract_test.dart

      - name: Commit layout immediately
        run: |
          rm -f .github/workflows/audit-pwa-layout.yml
          rm -f .github/workflows/apply-global-pwa-layout.yml
          rm -f .github/workflows/apply-pwa-layout-now.yml
          rm -f docs/pwa-layout-audit.txt
          rm -f docs/pwa-layout-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Применить PWA-края ко всему приложению"
          git push
