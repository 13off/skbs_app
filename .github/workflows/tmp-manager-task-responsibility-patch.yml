name: Temporary manager task responsibility patch

on:
  push:
    branches:
      - fix/manager-task-responsibility-20260822

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/manager-task-responsibility-20260822
          show-progress: false

      - name: Patch manager task preview and regression contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          widgets_path = Path('lib/screens/desktop_home_widgets.dart')
          text = widgets_path.read_text(encoding='utf-8')

          import_needle = "import '../widgets/premium_ui.dart';\n"
          import_replacement = (
              "import '../widgets/premium_ui.dart';\n"
              "import '../widgets/responsibility_actor_line.dart';\n"
          )
          if "responsibility_actor_line.dart" not in text:
              if import_needle not in text:
                  raise SystemExit('desktop_home_widgets import anchor not found')
              text = text.replace(import_needle, import_replacement, 1)

          constructor_needle = """  const DesktopTasksCard({
    super.key,
    required this.tasks,
    required this.onOpenTasks,
    required this.onOpenTask,
  });

  @override
"""
          constructor_replacement = """  const DesktopTasksCard({
    super.key,
    required this.tasks,
    required this.onOpenTasks,
    required this.onOpenTask,
  });

  bool _sameResponsibleActor(TaskItemData task) {
    final creator = task.creator;
    final editor = task.lastEditor;
    if (creator == null || editor == null) return false;

    final creatorId = creator.userId?.trim() ?? '';
    final editorId = editor.userId?.trim() ?? '';
    if (creatorId.isNotEmpty && editorId.isNotEmpty) {
      return creatorId == editorId;
    }

    final creatorName = creator.fullName.trim().toLowerCase();
    final editorName = editor.fullName.trim().toLowerCase();
    return creatorName.isNotEmpty && creatorName == editorName;
  }

  Widget _responsibility(TaskItemData task) {
    final creator = task.creator;
    final editor = task.lastEditor;
    final sameResponsibleActor = _sameResponsibleActor(task);

    return Wrap(
      spacing: 12,
      runSpacing: 7,
      children: [
        if (sameResponsibleActor && editor != null)
          ResponsibilityActorLine(
            label: 'Создал и изменил',
            actor: editor,
            compact: true,
          )
        else ...[
          if (creator != null)
            ResponsibilityActorLine(
              label: 'Создал',
              actor: creator,
              compact: true,
            ),
          if (editor != null)
            ResponsibilityActorLine(
              label: 'Изменил',
              actor: editor,
              compact: true,
            ),
        ],
      ],
    );
  }

  @override
"""
          if "Widget _responsibility(TaskItemData task)" not in text:
              if constructor_needle not in text:
                  raise SystemExit('DesktopTasksCard constructor anchor not found')
              text = text.replace(constructor_needle, constructor_replacement, 1)

          row_needle = """                              Text(
                                '${task.objectName} · ${task.axes.trim().isEmpty ? 'оси не указаны' : task.axes}',
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: TextStyle(
                                  color: _muted,
                                  fontSize: 12,
                                  fontWeight: FontWeight.w700,
                                ),
                              ),
                            ],
"""
          row_replacement = """                              Text(
                                '${task.objectName} · ${task.axes.trim().isEmpty ? 'оси не указаны' : task.axes}',
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: TextStyle(
                                  color: _muted,
                                  fontSize: 12,
                                  fontWeight: FontWeight.w700,
                                ),
                              ),
                              if (task.creator != null || task.lastEditor != null) ...[
                                const SizedBox(height: 7),
                                _responsibility(task),
                              ],
                            ],
"""
          if "_responsibility(task)" not in text:
              if row_needle not in text:
                  raise SystemExit('DesktopTasksCard row anchor not found')
              text = text.replace(row_needle, row_replacement, 1)

          widgets_path.write_text(text, encoding='utf-8')

          test_path = Path('test/responsibility_attribution_test.dart')
          test_text = test_path.read_text(encoding='utf-8')
          marker = "  test('desktop task table fills wide screens and keeps small-screen scroll', () {\n"
          manager_test = """  test('manager desktop home task preview exposes responsibility', () {
    final managerHome = File(
      'lib/screens/desktop_home_widgets.dart',
    ).readAsStringSync();
    expect(managerHome, contains('ResponsibilityActorLine'));
    expect(managerHome, contains("label: 'Создал'"));
    expect(managerHome, contains("label: 'Изменил'"));
    expect(managerHome, contains("label: 'Создал и изменил'"));
    expect(managerHome, contains('_sameResponsibleActor'));
  });

"""
          if "manager desktop home task preview exposes responsibility" not in test_text:
              if marker not in test_text:
                  raise SystemExit('responsibility test anchor not found')
              test_text = test_text.replace(marker, manager_test + marker, 1)
              test_path.write_text(test_text, encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet; then
            echo "Patch already present"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/desktop_home_widgets.dart test/responsibility_attribution_test.dart
          git commit -m "Показывать авторов задач на главной руководителя"
          git push origin HEAD:fix/manager-task-responsibility-20260822
