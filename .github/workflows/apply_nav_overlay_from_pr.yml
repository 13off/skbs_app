name: Apply navigation overlay from PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/nav-overlay-and-task-fab-20260804'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-overlay-and-task-fab-20260804
          fetch-depth: 0

      - name: Apply exact patch and clean service files
        shell: bash
        run: |
          python3 tool/apply_nav_overlay_task_fab.py
          rm tool/apply_nav_overlay_task_fab.py
          rm -f .github/workflows/apply_nav_overlay_and_task_fab.yml
          rm -f docs/.nav-overlay-trigger docs/.nav-overlay-trigger-2
          rm -f docs/.nav-overlay-trigger-3 docs/.nav-overlay-trigger-4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Убрать чёрную подложку навигации и закрепить добавление задачи"
          git push origin HEAD:fix/nav-overlay-and-task-fab-20260804
