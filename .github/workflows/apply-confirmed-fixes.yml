name: Apply confirmed acceptance fixes

on:
  push:
    branches:
      - agent/full-acceptance-test-2026-08-04
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-acceptance-test-2026-08-04
          fetch-depth: 0
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fix Edge Function types without changing behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidate = Path('supabase/functions/recruitment-candidate-action/index.ts')
          text = candidate.read_text(encoding='utf-8')
          old_import = 'import { createClient } from "npm:@supabase/supabase-js@2.110.5";'
          new_import = 'import { createClient, type SupabaseClient } from "npm:@supabase/supabase-js@2.110.5";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('Unexpected candidate-action import')

          marker = 'type JsonMap = Record<string, unknown>;\n'
          types = '''type JsonMap = Record<string, unknown>;\n\ntype AdminClient = SupabaseClient<any>;\n\ntype StoredFileRow = {\n  storage_bucket: string | null;\n  storage_path: string | null;\n};\n'''
          if 'type AdminClient = SupabaseClient<any>;' not in text:
              if marker not in text:
                  raise SystemExit('JsonMap marker not found in candidate-action')
              text = text.replace(marker, types, 1)

          text = text.replace(
              'admin: ReturnType<typeof createClient>,',
              'admin: AdminClient,',
          )
          old_loop = '''  const grouped = new Map<string, Set<string>>();\n  for (const row of [...(documents ?? []), ...(messages ?? [])]) {\n'''
          new_loop = '''  const grouped = new Map<string, Set<string>>();\n  const storedFiles: StoredFileRow[] = [\n    ...((documents ?? []) as StoredFileRow[]),\n    ...((messages ?? []) as StoredFileRow[]),\n  ];\n  for (const row of storedFiles) {\n'''
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif new_loop not in text:
              raise SystemExit('Stored file loop not found in candidate-action')
          candidate.write_text(text, encoding='utf-8')

          ingest = Path('supabase/functions/recruitment-ingest-telegram-file/index.ts')
          text = ingest.read_text(encoding='utf-8')
          marker = 'type JsonMap = Record<string, unknown>;\n'
          row_type = '''type JsonMap = Record<string, unknown>;\n\ntype TelegramFileRow = {\n  id: string;\n  company_id: string;\n  application_id: string;\n  telegram_file_id: string | null;\n  storage_bucket: string | null;\n  storage_path: string | null;\n  original_name: string | null;\n  mime_type: string | null;\n  size_bytes: number | null;\n  document_type?: string | null;\n};\n'''
          if 'type TelegramFileRow = {' not in text:
              if marker not in text:
                  raise SystemExit('JsonMap marker not found in telegram ingest')
              text = text.replace(marker, row_type, 1)

          lookup = '    if (!data) return json({ error: "row not found" }, 404);\n'
          insertion = lookup + '    const row = data as unknown as TelegramFileRow;\n'
          if 'const row = data as unknown as TelegramFileRow;' not in text:
              if lookup not in text:
                  raise SystemExit('Data guard not found in telegram ingest')
              text = text.replace(lookup, insertion, 1)

          head, sep, tail = text.partition('    const row = data as unknown as TelegramFileRow;\n')
          if not sep:
              raise SystemExit('Typed row marker missing in telegram ingest')
          tail = tail.replace('data.', 'row.')
          ingest.write_text(head + sep + tail, encoding='utf-8')
          PY

      - name: Normalize duplicate migration versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import defaultdict
          from datetime import datetime, timedelta
          from pathlib import Path
          import re

          migration_dir = Path('supabase/migrations')
          files = sorted(migration_dir.glob('*.sql'))
          groups = defaultdict(list)
          used = set()
          for path in files:
              match = re.match(r'^(\d{14})_(.+)$', path.name)
              if not match:
                  continue
              version = match.group(1)
              groups[version].append(path)
              used.add(version)

          renames = []
          for version, paths in sorted(groups.items()):
              if len(paths) < 2:
                  continue
              current = datetime.strptime(version, '%Y%m%d%H%M%S')
              for path in sorted(paths)[1:]:
                  while True:
                      current += timedelta(seconds=1)
                      candidate_version = current.strftime('%Y%m%d%H%M%S')
                      if candidate_version not in used:
                          break
                  used.add(candidate_version)
                  suffix = path.name[14:]
                  target = path.with_name(candidate_version + suffix)
                  path.rename(target)
                  renames.append((path.name, target.name))

          report = Path('docs/full-acceptance-test-runs/2026-08-04-migration-renames.md')
          lines = [
              '# Нормализация версий SQL-миграций',
              '',
              'Повторяющиеся 14-значные версии заменены ближайшими свободными секундами.',
              'Содержимое SQL не изменялось.',
              '',
              'Перед production deploy нужно сверить историю `supabase_migrations.schema_migrations`',
              'и при необходимости выполнить штатный `supabase migration repair`.',
              '',
          ]
          if renames:
              lines.append('## Переименования')
              lines.append('')
              lines.extend(f'- `{old}` → `{new}`' for old, new in renames)
          else:
              lines.append('Повторяющихся версий не найдено.')
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(f'{old} -> {new}' for old, new in renames))
          PY

      - name: Upgrade file_saver away from legacy Kotlin plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('file_saver: ^0.2.14', 'file_saver: ^0.4.0')
          path.write_text(text, encoding='utf-8')
          PY
          flutter pub get

      - name: Apply canonical Dart formatting
        run: dart format lib test

      - name: Check every Edge TypeScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            deno check "$file"
          done < <(find supabase/functions -type f -name '*.ts' -print0 | sort -z)

      - name: Validate unique SQL migration versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          versions = []
          for path in sorted(Path('supabase/migrations').glob('*.sql')):
              match = re.match(r'^(\d{14})_', path.name)
              if not match:
                  raise SystemExit(f'Invalid migration name: {path.name}')
              if not path.read_text(encoding='utf-8', errors='replace').strip():
                  raise SystemExit(f'Empty migration: {path.name}')
              versions.append(match.group(1))
          duplicates = [version for version, count in Counter(versions).items() if count > 1]
          if duplicates:
              raise SystemExit('Duplicate migration versions: ' + ', '.join(sorted(duplicates)))
          print(f'Validated {len(versions)} unique migrations')
          PY

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run all Flutter tests
        run: flutter test --no-pub -j 1

      - name: Build Web release
        run: flutter build web --release --no-pub

      - name: Remove one-time fixer workflow
        run: rm .github/workflows/apply-confirmed-fixes.yml

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Исправить результаты полного приёмочного теста'
          git push origin HEAD:agent/full-acceptance-test-2026-08-04
