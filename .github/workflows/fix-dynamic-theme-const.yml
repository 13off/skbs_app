name: Fix dynamic theme const

on:
  push:
    branches:
      - agent/system-theme-audit
    paths:
      - .github/workflows/fix-dynamic-theme-const.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-theme-audit
          fetch-depth: 0
      - name: Remove obsolete const contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'lib/features/accounting/presentation/accounting_dashboard_screen.dart': [
              ("style: const TextStyle(\n                        color: accountingMuted,", "style: TextStyle(\n                        color: accountingMuted,"),
              ("leading: const CircleAvatar(\n                backgroundColor: accountingSoft,", "leading: CircleAvatar(\n                backgroundColor: accountingSoft,"),
              ("const Text(\n            'Проверьте подтверждающие файлы',", "Text(\n            'Проверьте подтверждающие файлы',"),
            ],
            'lib/features/accounting/presentation/accounting_reports_screen.dart': [
              ("const Text(\n                  'Отчётный период',", "Text(\n                  'Отчётный период',"),
              ("style: const TextStyle(\n                        color: accountingMuted,", "style: TextStyle(\n                        color: accountingMuted,"),
              ("const Icon(Icons.chevron_right_rounded, color: accountingMuted)", "Icon(Icons.chevron_right_rounded, color: accountingMuted)"),
              ("style: const TextStyle(\n              color: accountingMuted,", "style: TextStyle(\n              color: accountingMuted,"),
            ],
            'lib/features/accounting/presentation/adaptive_accounting_dashboard_screen.dart': [
              ("child: const Icon(\n                  Icons.receipt_long_outlined,", "child: Icon(\n                  Icons.receipt_long_outlined,"),
            ],
            'lib/features/company/presentation/desktop_company_user_dialogs.dart': [
              ("style: const TextStyle(\n                    color: specialistDanger,", "style: TextStyle(\n                    color: specialistDanger,"),
            ],
            'lib/features/foreman/presentation/foreman_attendance_control.dart': [
              ("const Padding(\n              padding: EdgeInsets.symmetric(vertical: 24),\n              child: Center(\n                child: Column(\n                  children: [\n                    Icon(\n                      Icons.verified_rounded,", "Padding(\n              padding: const EdgeInsets.symmetric(vertical: 24),\n              child: Center(\n                child: Column(\n                  children: [\n                    Icon(\n                      Icons.verified_rounded,"),
              ("trailing: const SpecialistStatusPill(\n                  label: '0 смен',", "trailing: SpecialistStatusPill(\n                  label: '0 смен',"),
            ],
            'lib/features/legal/presentation/adaptive_legal_matters_screen.dart': [
              ("? const SpecialistStatusPill(\n                        label: 'Требуется решение',", "? SpecialistStatusPill(\n                        label: 'Требуется решение',"),
            ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              before = text
              for old, new in pairs:
                  if old not in text:
                      print(f'Pattern already absent: {file_name}: {old[:45]!r}')
                  text = text.replace(old, new)
              if text != before:
                  path.write_text(text, encoding='utf-8')
                  print(file_name)
          PY
          rm .github/workflows/fix-dynamic-theme-const.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Исправить const-контексты адаптивной темы"
          git push origin HEAD:agent/system-theme-audit
