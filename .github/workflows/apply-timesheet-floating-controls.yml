name: Apply timesheet floating controls

on:
  push:
    branches:
      - fix/timesheet-floating-controls
    paths:
      - '.github/workflows/apply-timesheet-floating-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/timesheet-floating-controls
          fetch-depth: 0

      - name: Patch timesheet and floating navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          adaptive_path = Path('lib/screens/adaptive_timesheet_screen.dart')
          adaptive = adaptive_path.read_text(encoding='utf-8')
          old_adaptive = """        final contentProfile = profile.isAdmin
            ? profile.copyWith(role: 'foreman')
            : profile;
        final content = useDesktop
            ? DesktopTimesheetScreen(
                profile: contentProfile,
                selectedObjectName: selectedObjectName,
              )
            : TimesheetScreen(
                profile: contentProfile,
                selectedObjectName: selectedObjectName,
              );

        if (!canDownload) return content;
        return Stack(
          children: [
            content,
            Positioned(
              top: 18,
              right: 18,
              child: FilledButton.tonalIcon(
                onPressed: () => TimesheetDownloadSheet.show(
                  context,
                  selectedObjectName: selectedObjectName,
                  initialDate: DateTime.now(),
                ),
                icon: const Icon(Icons.download_rounded, size: 18),
                label: const Text('Скачать табель'),
              ),
            ),
          ],
        );
"""
          new_adaptive = """        final contentProfile = profile.isAdmin
            ? profile.copyWith(role: 'foreman')
            : profile;
        final VoidCallback? downloadAction = canDownload
            ? () {
                TimesheetDownloadSheet.show(
                  context,
                  selectedObjectName: selectedObjectName,
                  initialDate: DateTime.now(),
                );
              }
            : null;

        if (useDesktop) {
          return DesktopTimesheetScreen(
            profile: contentProfile,
            selectedObjectName: selectedObjectName,
            onDownload: downloadAction,
          );
        }

        final content = TimesheetScreen(
          profile: contentProfile,
          selectedObjectName: selectedObjectName,
        );
        if (!canDownload) return content;
        return Stack(
          children: [
            content,
            Positioned(
              top: 18,
              right: 18,
              child: FilledButton.tonalIcon(
                onPressed: downloadAction,
                icon: const Icon(Icons.download_rounded, size: 18),
                label: const Text('Скачать табель'),
              ),
            ),
          ],
        );
"""
          if old_adaptive not in adaptive:
              raise SystemExit('Adaptive timesheet block not found')
          adaptive_path.write_text(
              adaptive.replace(old_adaptive, new_adaptive, 1),
              encoding='utf-8',
          )

          desktop_path = Path('lib/screens/desktop_timesheet_screen.dart')
          desktop = desktop_path.read_text(encoding='utf-8')
          old_constructor = """class DesktopTimesheetScreen extends StatefulWidget {
  final AppUserProfile profile;
  final String? selectedObjectName;

  const DesktopTimesheetScreen({
    super.key,
    required this.profile,
    required this.selectedObjectName,
  });
"""
          new_constructor = """class DesktopTimesheetScreen extends StatefulWidget {
  final AppUserProfile profile;
  final String? selectedObjectName;
  final VoidCallback? onDownload;

  const DesktopTimesheetScreen({
    super.key,
    required this.profile,
    required this.selectedObjectName,
    this.onDownload,
  });
"""
          if old_constructor not in desktop:
              raise SystemExit('Desktop timesheet constructor not found')
          desktop = desktop.replace(old_constructor, new_constructor, 1)

          old_toolbar_actions = """          const Spacer(),
          if (widget.profile.isAdmin)
            OutlinedButton.icon(
              onPressed: openReport,
              icon: Icon(Icons.analytics_outlined),
              label: const Text('Отчёт'),
            ),
          SizedBox(width: 10),
          IconButton(
"""
          new_toolbar_actions = """          const Spacer(),
          if (widget.onDownload != null) ...[
            FilledButton.tonalIcon(
              onPressed: widget.onDownload,
              icon: const Icon(Icons.download_rounded, size: 18),
              label: const Text('Скачать табель'),
            ),
            const SizedBox(width: 10),
          ],
          if (widget.profile.isAdmin) ...[
            OutlinedButton.icon(
              onPressed: openReport,
              icon: const Icon(Icons.analytics_outlined),
              label: const Text('Отчёт'),
            ),
            const SizedBox(width: 10),
          ],
          IconButton(
"""
          if old_toolbar_actions not in desktop:
              raise SystemExit('Desktop toolbar actions not found')
          desktop = desktop.replace(old_toolbar_actions, new_toolbar_actions, 1)

          build_pattern = re.compile(
              r"  @override\n  Widget build\(BuildContext context\) \{\n"
              r"    final visible = visibleEmployees\(\);\n.*?\n  \}\n\}\n\nclass _SquareButton",
              re.S,
          )
          new_build = """  @override
  Widget build(BuildContext context) {
    final visible = visibleEmployees();

    return Scaffold(
      backgroundColor: Colors.transparent,
      body: PremiumWorkBackdrop(
        child: Stack(
          children: [
            Positioned.fill(
              child: ListView(
                controller: verticalController,
                padding: const EdgeInsets.fromLTRB(28, 24, 28, 230),
                children: [
                  Center(
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(maxWidth: 1320),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          AppPageHeader(
                            title: 'Табель',
                            subtitle:
                                'ПК-вид · быстрый ввод смен за выбранную дату • $objectTitle',
                          ),
                          const SizedBox(height: 18),
                          buildToolbar(),
                          const SizedBox(height: 16),
                          buildMetrics(visible),
                          const SizedBox(height: 16),
                          buildFilters(visible),
                          if (isLoading || isSaving) ...[
                            const SizedBox(height: 12),
                            const LinearProgressIndicator(),
                          ],
                          if (errorText != null) ...[
                            const SizedBox(height: 12),
                            Container(
                              padding: const EdgeInsets.all(13),
                              decoration: BoxDecoration(
                                color: _warning.withValues(alpha: 0.09),
                                borderRadius: BorderRadius.circular(16),
                              ),
                              child: Text(
                                errorText!,
                                style: TextStyle(
                                  color: _warning,
                                  fontWeight: FontWeight.w700,
                                ),
                              ),
                            ),
                          ],
                          const SizedBox(height: 16),
                          buildTable(visible),
                        ],
                      ),
                    ),
                  ),
                ],
              ),
            ),
            Positioned(
              left: 28,
              right: 28,
              bottom: 112,
              child: SafeArea(
                top: false,
                child: Center(
                  child: ConstrainedBox(
                    constraints: const BoxConstraints(maxWidth: 620),
                    child: PremiumWorkCard(
                      radius: 25,
                      padding: const EdgeInsets.fromLTRB(18, 12, 12, 12),
                      child: Row(
                        children: [
                          Expanded(
                            child: Text(
                              hasUnsavedChanges
                                  ? 'Есть несохранённые изменения'
                                  : 'Все изменения сохранены',
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: TextStyle(
                                color: hasUnsavedChanges ? _warning : _muted,
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                          ),
                          const SizedBox(width: 14),
                          SizedBox(
                            width: 280,
                            child: FilledButton.icon(
                              onPressed:
                                  employees.isEmpty || isLoading || isSaving
                                      ? null
                                      : saveTimesheet,
                              icon: isSaving
                                  ? const SizedBox(
                                      width: 18,
                                      height: 18,
                                      child: CircularProgressIndicator(
                                        strokeWidth: 2,
                                      ),
                                    )
                                  : const Icon(Icons.save_outlined),
                              label: Text(
                                hasUnsavedChanges
                                    ? 'Сохранить изменения'
                                    : 'Сохранить табель',
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }
}

class _SquareButton"""
          desktop, count = build_pattern.subn(new_build, desktop, count=1)
          if count != 1:
              raise SystemExit(f'Desktop build method replacement count: {count}')
          desktop_path.write_text(desktop, encoding='utf-8')

          shell_path = Path(
              'lib/features/shell/presentation/premium_main_screen.dart'
          )
          shell = shell_path.read_text(encoding='utf-8')
          old_shell = """      child: Scaffold(
        body: Listener(
"""
          new_shell = """      child: Scaffold(
        extendBody: true,
        backgroundColor: Colors.transparent,
        body: Listener(
"""
          if old_shell not in shell:
              raise SystemExit('Main shell scaffold not found')
          shell_path.write_text(
              shell.replace(old_shell, new_shell, 1),
              encoding='utf-8',
          )

          test_path = Path('test/timesheet_floating_controls_contract_test.dart')
          test_path.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('desktop download action stays inside the timesheet toolbar', () {
    final adaptive = File(
      'lib/screens/adaptive_timesheet_screen.dart',
    ).readAsStringSync();
    final desktop = File(
      'lib/screens/desktop_timesheet_screen.dart',
    ).readAsStringSync();

    expect(adaptive, contains('onDownload: downloadAction'));
    expect(desktop, contains('final VoidCallback? onDownload'));
    expect(desktop, contains("label: const Text('Скачать табель')"));
  });

  test('save action is a compact floating card instead of a full-width footer', () {
    final desktop = File(
      'lib/screens/desktop_timesheet_screen.dart',
    ).readAsStringSync();

    expect(desktop, contains('constraints: const BoxConstraints(maxWidth: 620)'));
    expect(desktop, contains('bottom: 112'));
    expect(desktop, isNot(contains('border: Border(top: BorderSide(color: _line))')));
  });

  test('main shell paints page content behind the floating navigation', () {
    final shell = File(
      'lib/features/shell/presentation/premium_main_screen.dart',
    ).readAsStringSync();

    expect(shell, contains('extendBody: true'));
    expect(shell, contains('backgroundColor: Colors.transparent'));
  });
}
""", encoding='utf-8')
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Format changed Dart files
        run: dart format lib/screens/adaptive_timesheet_screen.dart lib/screens/desktop_timesheet_screen.dart lib/features/shell/presentation/premium_main_screen.dart test/timesheet_floating_controls_contract_test.dart

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-timesheet-floating-controls.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Исправить плавающие элементы табеля'
          git push origin HEAD:fix/timesheet-floating-controls
