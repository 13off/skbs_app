name: Validate tool hotfix

on:
  push:
    branches:
      - fix/tool-card-locks-and-document-errors-ci

permissions:
  contents: read

concurrency:
  group: validate-tool-hotfix
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter compact
      - name: Build web release
        run: flutter build web --release --base-href /appstroy-web/
      - name: Install browser smoke dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet selenium==4.28.1 pillow==11.1.0
      - name: Run browser smoke
        run: python3 tool/web_smoke.py
