class TaskCreateDraft {
  final TaskItemData task;
  final List<String> assigneeIds;
  final List<TaskPhotoFile> photos;
  final bool saveAsDraft;
  final String? sourceDraftId;

  const TaskCreateDraft({
    required this.task,
    required this.assigneeIds,
    required this.photos,
    this.saveAsDraft = false,
    this.sourceDraftId,
  });
}

class AddTaskScreen extends StatefulWidget {
  final DateTime initialDate;
  final String objectName;
  final String? initialMilestoneId;
  final String? initialChecklistItemId;
  final String? initialChecklistTitle;
  final String initialAxes;
  final String initialWork;
  final List<String> initialAssigneeIds;
  final bool initialRequireBeforePhoto;
  final bool allowAnyDate;
  final bool allowDraft;
  final String? sourceDraftId;

  const AddTaskScreen({
    super.key,
    required this.initialDate,
    required this.objectName,
    this.initialMilestoneId,
    this.initialChecklistItemId,
    this.initialChecklistTitle,
    this.initialAxes = '',
    this.initialWork = '',
    this.initialAssigneeIds = const <String>[],
    this.initialRequireBeforePhoto = false,
    this.allowAnyDate = false,
    this.allowDraft = false,
    this.sourceDraftId,
  });

  @override
  State<AddTaskScreen> createState() => _AddTaskScreenState();
}

class _AddTaskScreenState extends State<AddTaskScreen> {
  final TextEditingController axesController = TextEditingController();
  final TextEditingController workController = TextEditingController();

  late DateTime selectedDate;

  List<Employee> employees = <Employee>[];
  final Set<String> selectedAssigneeIds = <String>{};
  final List<TaskPhotoFile> selectedPhotos = <TaskPhotoFile>[];
  String? selectedMilestoneId;
  String? selectedChecklistItemId;
  String? selectedChecklistTitle;
  bool isGoalTask = false;

  bool isLoadingEmployees = false;
  bool isPickingPhotos = false;
  bool isLoadingPolicy = true;
  TaskPolicy policy = TaskPolicy.defaults;
  String? errorText;

  bool get requiresBeforePhoto =>
      policy.requireBeforePhoto || widget.initialRequireBeforePhoto;

  int get minimumBeforePhotos {
    if (!requiresBeforePhoto) return 0;
    return policy.requireBeforePhoto ? policy.minBeforePhotos : 1;
  }

  @override
  void initState() {
    super.initState();
    selectedDate = widget.initialDate;
    selectedMilestoneId = widget.initialMilestoneId;
    selectedChecklistItemId = widget.initialChecklistItemId;
    selectedChecklistTitle = widget.initialChecklistTitle;
    isGoalTask = selectedMilestoneId?.trim().isNotEmpty == true;
    axesController.text = widget.initialAxes.trim();
    workController.text = widget.initialWork.trim();
    selectedAssigneeIds.addAll(
      widget.initialAssigneeIds.where((id) => id.trim().isNotEmpty),
    );
    loadEmployees();
    loadPolicy();
  }

  @override
  void dispose() {
    axesController.dispose();
    workController.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) => buildTaskCreateView();
}
""")

          write('lib/screens/task_create/task_create_actions.dart', """// State helpers below are part of the owning screen library and intentionally
// update that exact State instance.
// ignore_for_file: invalid_use_of_protected_member

part of '../add_task_screen.dart';

extension _TaskCreateActions on _AddTaskScreenState {
  Future<void> pickDate() async {
    if (!widget.allowAnyDate) return;
    final pickedDate = await showDatePicker(
      context: context,
      initialDate: selectedDate,
      firstDate: DateTime(2024),
      lastDate: DateTime(2035),
      helpText: 'Выберите дату задачи',
      cancelText: 'Отмена',
      confirmText: 'Выбрать',
    );

    if (pickedDate == null) return;
    setState(() {
      selectedDate = pickedDate;
    });
  }

  Future<void> openAssigneesPicker() async {
    final result = await showTaskAssigneePicker(
      context: context,
      employees: employees,
      selectedIds: selectedAssigneeIds,
    );
    if (!mounted || result == null) return;

    setState(() {
      selectedAssigneeIds
        ..clear()
        ..addAll(result);
    });
  }

  Future<void> pickPhotos() async {
    setState(() {
      isPickingPhotos = true;
      errorText = null;
    });

    try {
      final photos = await TaskRepository.pickPhotoFiles();
      if (!mounted || photos.isEmpty) return;
      setState(() {
        selectedPhotos.addAll(photos);
      });
    } catch (error) {
      if (!mounted) return;
      setState(() {
        errorText = 'Ошибка выбора фото: $error';
      });
    } finally {
      if (mounted) {
        setState(() {
          isPickingPhotos = false;
        });
      }
    }
  }

  void removePhoto(TaskPhotoFile photo) {
    setState(() {
      selectedPhotos.remove(photo);
    });
  }

  void changeMilestone(TaskMilestoneSelection selection) {
    final next = TaskMilestoneDraftController.apply(
      selection: selection,
      currentWorkText: workController.text,
      previousChecklistTitle: selectedChecklistTitle,
    );

    setState(() {
      isGoalTask = next.goalMode;
      selectedMilestoneId = next.milestoneId;
      selectedChecklistItemId = next.checklistItemId;
      selectedChecklistTitle = next.checklistTitle;
      workController.text = next.workText;
    });
  }

  void showValidationError(String message) {
    ScaffoldMessenger.of(
      context,
    ).showSnackBar(SnackBar(content: Text(message)));
  }

  TaskCreateDraft buildResult({required bool asDraft}) {
    final axes = axesController.text.trim();
    final work = workController.text.trim();
    final goalWork = selectedChecklistTitle?.trim() ?? '';
    final savedWork = isGoalTask && goalWork.isNotEmpty ? goalWork : work;
    final task = TaskItemData(
      axes,
      savedWork,
      'Запланировано',
      selectedDate,
      objectName: widget.objectName,
      milestoneId: selectedMilestoneId ?? '',
      checklistItemId: selectedChecklistItemId ?? '',
    );

    return TaskCreateDraft(
      task: task,
      assigneeIds: selectedAssigneeIds.toList(),
      photos: asDraft
          ? const <TaskPhotoFile>[]
          : List<TaskPhotoFile>.from(selectedPhotos),
      saveAsDraft: asDraft,
      sourceDraftId: widget.sourceDraftId,
    );
  }

  void saveDraft() {
    final axes = axesController.text.trim();
    final work = workController.text.trim();
    final goalWork = selectedChecklistTitle?.trim() ?? '';
    if (axes.isEmpty && work.isEmpty && goalWork.isEmpty) {
      showValidationError('Заполни хотя бы оси или вид работ');
      return;
    }
    Navigator.pop(context, buildResult(asDraft: true));
  }

  void saveTask() {
    final axes = axesController.text.trim();
    final work = workController.text.trim();
    final linkedToGoal = isGoalTask;
    final goalWork = selectedChecklistTitle?.trim() ?? '';

    final coreError = TaskDraftValidation.coreFields(
      axes: axes,
      work: work,
      linkedToGoal: linkedToGoal,
    );
    if (coreError != null) {
      showValidationError(coreError);
      return;
    }

    final photoError = TaskDraftValidation.requiredPhotos(
      required: requiresBeforePhoto,
      actualCount: selectedPhotos.length,
      minimumCount: minimumBeforePhotos,
      stageTitle: 'До',
    );
    if (photoError != null) {
      showValidationError(photoError);
      return;
    }

    final goalError = TaskDraftValidation.goalLink(
      linkedToGoal: linkedToGoal,
      checklistItemId: selectedChecklistItemId,
      goalWork: goalWork,
    );
    if (goalError != null) {
      showValidationError(goalError);
      return;
    }

    Navigator.pop(context, buildResult(asDraft: false));
  }
}
""")

