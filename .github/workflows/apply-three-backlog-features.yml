name: Apply three backlog features

on:
  push:
    branches:
      - feature/foreman-drafts-payment-filters-first-run-guide
    paths:
      - .github/workflows/apply-three-backlog-features.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Применить черновики, фильтры выплат и обучение' && github.event.head_commit.message != 'Удалить временный workflow трёх функций'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foreman-drafts-payment-filters-first-run-guide

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              content = read(path)
              if old not in content:
                  raise SystemExit(f'Marker not found in {path}: {old[:100]!r}')
              write(path, content.replace(old, new, 1))

          # ---------- Task draft repository support ----------
          task_repo = 'lib/data/task_repository.dart'
          replace_once(
              task_repo,
              "  static Stream<List<TaskItemData>> watchTasksForDate(\n",
              """  static Future<List<TaskItemData>> fetchOwnDraftTasks({
    String? objectName,
  }) async {
    final userId = _client.auth.currentUser?.id;
    if (userId == null || userId.isEmpty) return <TaskItemData>[];

    var query = _client
        .from('tasks')
        .select(
          'id, task_date, object_name, axes, work, status, not_done_comment',
        )
        .eq('is_draft', true)
        .eq('created_by_user_id', userId);
    final cleanObject = cleanObjectName(objectName);
    if (cleanObject != null) {
      query = query.eq('object_name', cleanObject);
    }

    final response = await query.order('updated_at', ascending: false);
    return response
        .map<TaskItemData>(
          (row) => TaskItemData.fromSupabase(Map<String, dynamic>.from(row)),
        )
        .toList(growable: false);
  }

  static Stream<List<TaskItemData>> watchTasksForDate(
""",
