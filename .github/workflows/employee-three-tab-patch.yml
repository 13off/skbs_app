name: Apply employee three-tab profile patch

on:
  push:
    branches:
      - employee-three-tab-home-profile

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employee-three-tab-home-profile
          fetch-depth: 0

      - name: Patch profile and employee contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          profile_path = Path('lib/screens/profile_screen.dart')
          text = profile_path.read_text(encoding='utf-8')

          import_anchor = "import '../features/company/data/company_repository.dart';\n"
          employee_import = "import '../features/employee/presentation/employee_simple_work_screen.dart';\n"
          if employee_import not in text:
              text = text.replace(import_anchor, import_anchor + employee_import)

          field_anchor = "  bool savingPhoto = false;\n"
          field_text = "  late final ValueNotifier<String> employeeHistoryId;\n"
          if field_text not in text:
              text = text.replace(field_anchor, field_anchor + field_text)

          init_anchor = "    super.initState();\n    PersonalProfileController.configure(profile);"
          init_replacement = "    super.initState();\n    employeeHistoryId = ValueNotifier<String>('');\n    PersonalProfileController.configure(profile);"
          text = text.replace(init_anchor, init_replacement)

          dispose_anchor = "    PersonalProfileController.state.removeListener(_handlePersonalChanged);\n    super.dispose();"
          dispose_replacement = "    PersonalProfileController.state.removeListener(_handlePersonalChanged);\n    employeeHistoryId.dispose();\n    super.dispose();"
          text = text.replace(dispose_anchor, dispose_replacement)

          settings_anchor = "          actionTile(\n            icon: Icons.settings_outlined,\n            title: 'Настройки',"
          history_block = "          if (profile.isEmployee)\n            actionTile(\n              icon: Icons.history_rounded,\n              title: 'История задач',\n              subtitle: 'Задачи и результаты работы по выбранным датам',\n              onTap: () => open(\n                EmployeeWorkTaskHistoryScreen(\n                  profile: profile,\n                  selectedEmployeeId: employeeHistoryId,\n                ),\n              ),\n            ),\n"
          if history_block not in text:
              text = text.replace(settings_anchor, history_block + settings_anchor)

          profile_path.write_text(text, encoding='utf-8')

          replacements = {
              "expect(wrapper, contains(\"label: 'История задач'\"));": "expect(wrapper, contains(\"label: 'Главная'\"));\n    expect(wrapper, contains(\"label: 'Профиль'\"));",
              "expect(wrapper, contains('EmployeeWorkTaskHistoryScreen'));": "expect(wrapper, contains('EmployeeHomeScreen'));\n    expect(wrapper, contains('EmployeeTasksScreen'));",
              "expect(wrapper, contains('ProfileScreen(profile: widget.profile)'));": "expect(wrapper, contains('ProfileScreen(profile: contentProfile)'));",
          }

          test_files = [
              'test/employee_professional_passport_real_data_contract_test.dart',
              'test/employee_tracking_reliability_contract_test.dart',
              'test/employee_object_team_contract_test.dart',
              'test/employee_workflow_contract_test.dart',
              'test/employee_minimal_portal_contract_test.dart',
              'test/employee_unified_design_contract_test.dart',
              'test/employee_professional_passport_contract_test.dart',
              'test/employee_shift_geolocation_contract_test.dart',
              'test/employee_actionable_tasks_contract_test.dart',
          ]
          for file_name in test_files:
              path = Path(file_name)
              if not path.exists():
                  continue
              value = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  value = value.replace(old, new)
              path.write_text(value, encoding='utf-8')

          shortcut = Path('test/employee_profile_shortcut_contract_test.dart')
          shortcut.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  const wrapperPath =
      'lib/features/employee/presentation/employee_platform_with_passport.dart';
  const homePath =
      'lib/features/employee/presentation/employee_home_screen.dart';
  const profilePath = 'lib/screens/profile_screen.dart';
  const mainPath = 'lib/screens/main_screen.dart';

  test('сотрудник получает главную задачи и профиль в нижней панели', () {
    final wrapper = File(wrapperPath).readAsStringSync();

    expect(wrapper, contains("label: 'Главная'"));
    expect(wrapper, contains("label: 'Задачи'"));
    expect(wrapper, contains("label: 'Профиль'"));
    expect(wrapper, contains('EmployeeHomeScreen'));
    expect(wrapper, contains('EmployeeTasksScreen'));
    expect(wrapper, contains('ProfileScreen(profile: contentProfile)'));
    expect(wrapper, isNot(contains('rootHeaderTrailingBuilder:')));
  });

  test('на главной есть большая круглая кнопка начала работы', () {
    final home = File(homePath).readAsStringSync();

    expect(home, contains("title: 'Главная'"));
    expect(home, contains("'Начать работу'"));
    expect(home, contains('shape: const CircleBorder()'));
    expect(home, contains('dimension: 228'));
    expect(home, contains('runtime.start(employeeId)'));
    expect(home, contains('runtime.finish()'));
  });

  test('история задач находится в профиле над настройками', () {
    final profile = File(profilePath).readAsStringSync();
    final historyIndex = profile.indexOf("title: 'История задач'");
    final settingsIndex = profile.indexOf("title: 'Настройки'");

    expect(profile, contains('if (profile.isEmployee)'));
    expect(profile, contains('EmployeeWorkTaskHistoryScreen'));
    expect(historyIndex, greaterThanOrEqualTo(0));
    expect(settingsIndex, greaterThan(historyIndex));
  });

  test('предпросмотр сохраняет возврат к руководителю', () {
    final main = File(mainPath).readAsStringSync();

    expect(main, contains("label: const Text('К руководителю')"));
    expect(main, contains('RolePreviewController.showAdmin'));
  });
}
""", encoding='utf-8')
          PY

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/employee-three-tab-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/employee-three-tab-patch.yml
          git commit -m "Завершить трёхвкладочный кабинет сотрудника"
          git push origin HEAD:employee-three-tab-home-profile
