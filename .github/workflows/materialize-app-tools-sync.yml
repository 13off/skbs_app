name: Materialize AppСтрой tools synchronization

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/materialize-app-tools-sync.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Connect catalog changes to profile and settings
        shell: python
        run: |
          from pathlib import Path

          screen_path = Path('lib/features/tools/presentation/app_tools_screen.dart')
          screen = screen_path.read_text(encoding='utf-8')
          marker = "import '../../documents/presentation/document_workflow_screen.dart';"
          replacement = marker + "\nimport '../data/app_tools_controller.dart';"
          if "import '../data/app_tools_controller.dart';" not in screen:
              if marker not in screen:
                  raise SystemExit('app_tools_screen import marker missing')
              screen = screen.replace(marker, replacement, 1)
          notify_marker = (
              "      await DocumentWorkflowRepository.setInstallation(\n"
              "        companyId: companyId,\n"
              "        isEnabled: enabled,\n"
              "        settings: workspace.installation.settings,\n"
              "      );\n"
              "      selectedTab = enabled ? _ToolsTab.connected : _ToolsTab.catalog;"
          )
          notify_replacement = (
              "      await DocumentWorkflowRepository.setInstallation(\n"
              "        companyId: companyId,\n"
              "        isEnabled: enabled,\n"
              "        settings: workspace.installation.settings,\n"
              "      );\n"
              "      AppToolsController.notifyChanged();\n"
              "      selectedTab = enabled ? _ToolsTab.connected : _ToolsTab.catalog;"
          )
          if 'AppToolsController.notifyChanged();' not in screen:
              if notify_marker not in screen:
                  raise SystemExit('installation notification marker missing')
              screen = screen.replace(notify_marker, notify_replacement, 1)
          screen_path.write_text(screen, encoding='utf-8')

          entry_path = Path('lib/features/tools/presentation/app_tools_entry.dart')
          entry = entry_path.read_text(encoding='utf-8')
          entry_import_marker = "import '../../documents/presentation/document_workflow_screen.dart';"
          entry_import_replacement = (
              entry_import_marker + "\nimport '../data/app_tools_controller.dart';"
          )
          if "import '../data/app_tools_controller.dart';" not in entry:
              if entry_import_marker not in entry:
                  raise SystemExit('app_tools_entry import marker missing')
              entry = entry.replace(entry_import_marker, entry_import_replacement, 1)

          first_init = (
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    future = _load();\n"
              "  }\n\n"
              "  @override\n"
              "  void didUpdateWidget(covariant AppToolsSettingsEntry oldWidget) {"
          )
          first_init_replacement = (
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    AppToolsController.revision.addListener(_handleToolsChanged);\n"
              "    future = _load();\n"
              "  }\n\n"
              "  @override\n"
              "  void dispose() {\n"
              "    AppToolsController.revision.removeListener(_handleToolsChanged);\n"
              "    super.dispose();\n"
              "  }\n\n"
              "  void _handleToolsChanged() {\n"
              "    if (!mounted) return;\n"
              "    setState(() => future = _load());\n"
              "  }\n\n"
              "  @override\n"
              "  void didUpdateWidget(covariant AppToolsSettingsEntry oldWidget) {"
          )
          if entry.count('AppToolsController.revision.addListener') < 1:
              if first_init not in entry:
                  raise SystemExit('settings entry init marker missing')
              entry = entry.replace(first_init, first_init_replacement, 1)

          second_init = (
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    future = _load();\n"
              "  }\n\n"
              "  @override\n"
              "  void didUpdateWidget(covariant ConnectedAppToolsSection oldWidget) {"
          )
          second_init_replacement = (
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    AppToolsController.revision.addListener(_handleToolsChanged);\n"
              "    future = _load();\n"
              "  }\n\n"
              "  @override\n"
              "  void dispose() {\n"
              "    AppToolsController.revision.removeListener(_handleToolsChanged);\n"
              "    super.dispose();\n"
              "  }\n\n"
              "  void _handleToolsChanged() {\n"
              "    if (!mounted) return;\n"
              "    setState(() => future = _load());\n"
              "  }\n\n"
              "  @override\n"
              "  void didUpdateWidget(covariant ConnectedAppToolsSection oldWidget) {"
          )
          if entry.count('AppToolsController.revision.addListener') < 2:
              if second_init not in entry:
                  raise SystemExit('profile tools init marker missing')
              entry = entry.replace(second_init, second_init_replacement, 1)

          entry_path.write_text(entry, encoding='utf-8')

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Validate
        run: |
          dart format lib/features/tools
          flutter pub get --enforce-lockfile >/dev/null
          flutter analyze
          flutter test --reporter compact

      - name: Commit synchronization
        shell: bash
        run: |
          rm .github/workflows/materialize-app-tools-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refresh connected tools immediately'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
