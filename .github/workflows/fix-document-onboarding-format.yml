name: Fix document onboarding formatting

on:
  workflow_dispatch:
  push:
    branches: [feature/document-workflow-v3]
    paths:
      - '.github/workflows/fix-document-onboarding-format.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/document-workflow-v3
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Write corrected onboarding screen
        shell: bash
        run: |
          cat > /tmp/screen.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/screen.b64 | gzip -d > lib/features/documents/presentation/document_onboarding_screen.dart
          dart format lib/features/documents/presentation/document_onboarding_screen.dart
      - name: Commit analyzer fix
        shell: bash
        run: |
          if git diff --quiet -- lib/features/documents/presentation/document_onboarding_screen.dart; then
            echo 'No onboarding changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/documents/presentation/document_onboarding_screen.dart
          git commit -m 'fix: satisfy document onboarding analyzer'
          git push origin HEAD:feature/document-workflow-v3
