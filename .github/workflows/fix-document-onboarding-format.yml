name: Integrate document generation

on:
  workflow_dispatch:
  push:
    branches: [feature/document-workflow-v3]
    paths:
      - '.github/workflows/fix-document-onboarding-format.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/document-workflow-v3
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Patch onboarding screen
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/documents/presentation/document_onboarding_screen.dart')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "import '../data/document_template_repository.dart';\n",
              "import '../data/document_generation_service.dart';\n"
              "import '../data/document_template_repository.dart';\n",
              1,
          )

          marker = '  Future<void> uploadFile(\n'
          method = r'''  Future<void> generateDocument(_OnboardingData data) async {
            if (busy || !data.access.canEdit) return;
            DocumentTemplateRecord? template;
            try {
              template = await _selectTemplate(data);
            } catch (error) {
              _message(_cleanError(error));
              return;
            }
            if (template == null || !mounted) return;
            setState(() => busy = true);
            try {
              final candidate = _candidateForProcess(data);
              String employeePhone = candidate?.phone ?? '';
              for (final employee in data.employees) {
                if (employee.id == data.process.employeeId) {
                  employeePhone = employee.phone;
                  break;
                }
              }
              final now = DateTime.now();
              final processId = data.process.id;
              final documentNumber = processId.length > 8
                  ? processId.substring(0, 8).toUpperCase()
                  : processId.toUpperCase();
              final result = await DocumentGenerationService.generateAndUpload(
                companyId: companyId,
                onboarding: data.process,
                template: template,
                fields: <String, dynamic>{
                  ...data.process.recognizedData,
                  ...data.process.conditions,
                  'employee_full_name': data.process.personName,
                  'phone': employeePhone,
                  'position': data.process.conditions['position']?.toString() ?? '',
                  'object_name': data.process.objectName,
                  'start_date':
                      data.process.conditions['start_date']?.toString() ?? '',
                  'compensation':
                      data.process.conditions['compensation']?.toString() ?? '',
                  'manager_full_name': widget.profile.fullName,
                  'document_date': _dateText(now),
                  'document_number': documentNumber,
                },
              );
              await refresh();
              _message('DOCX сформирован: ${result.file.originalFileName}');
            } catch (error) {
              _message(_cleanError(error));
            } finally {
              if (mounted) setState(() => busy = false);
            }
          }

          '''
          if 'Future<void> generateDocument(' not in text:
              if marker not in text:
                  raise SystemExit('uploadFile marker not found')
              text = text.replace(marker, method + marker, 1)

          text = text.replace(
              "                    onUpload: (kind) => uploadFile(data, fileKind: kind),\n"
              "                    onOpenTemplate: () => openTemplate(data),\n",
              "                    onUpload: (kind) => uploadFile(data, fileKind: kind),\n"
              "                    onGenerate: () => generateDocument(data),\n"
              "                    onOpenTemplate: () => openTemplate(data),\n",
              1,
          )
          text = text.replace(
              "  final ValueChanged<String> onUpload;\n"
              "  final VoidCallback onOpenTemplate;\n",
              "  final ValueChanged<String> onUpload;\n"
              "  final VoidCallback onGenerate;\n"
              "  final VoidCallback onOpenTemplate;\n",
              1,
          )
          text = text.replace(
              "    required this.onUpload,\n"
              "    required this.onOpenTemplate,\n",
              "    required this.onUpload,\n"
              "    required this.onGenerate,\n"
              "    required this.onOpenTemplate,\n",
              1,
          )
          old_button = '''              if (step.stepCode == DocumentOnboardingSteps.generation)
                OutlinedButton.icon(
                  onPressed: busy ? null : onOpenTemplate,
                  icon: const Icon(Icons.description_outlined),
                  label: const Text('Открыть утверждённый шаблон'),
                ),
          '''
          new_button = '''              if (step.stepCode == DocumentOnboardingSteps.generation &&
                  data.access.canEdit)
                FilledButton.icon(
                  onPressed: busy ? null : onGenerate,
                  icon: const Icon(Icons.auto_awesome_outlined),
                  label: const Text('Сформировать DOCX'),
                ),
              if (step.stepCode == DocumentOnboardingSteps.generation)
                OutlinedButton.icon(
                  onPressed: busy ? null : onOpenTemplate,
                  icon: const Icon(Icons.description_outlined),
                  label: const Text('Открыть утверждённый шаблон'),
                ),
          '''
          if 'Сформировать DOCX' not in text:
              if old_button not in text:
                  raise SystemExit('generation button marker not found')
              text = text.replace(old_button, new_button, 1)

          text = text.replace(
              "      if (!template.isActive || template.currentVersion == null) return false;",
              "      if (!template.isActive || template.currentVersion == null) {\n"
              "        return false;\n"
              "      }",
          )
          path.write_text(text, encoding='utf-8')

          Path('analysis_options.yaml').write_text(
              "# This file configures the analyzer, which statically analyzes Dart code to\n"
              "# check for errors, warnings, and lints.\n\n"
              "include: package:flutter_lints/flutter.yaml\n\n"
              "linter:\n"
              "  rules:\n"
              "    # avoid_print: false\n"
              "    # prefer_single_quotes: true\n",
              encoding='utf-8',
          )
      - name: Format
        run: dart format lib/features/documents analysis_options.yaml test/document_workflow_v3_contract_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Remove materialization workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-document-onboarding-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/documents analysis_options.yaml test/document_workflow_v3_contract_test.dart .github/workflows/fix-document-onboarding-format.yml
          git commit -m 'feat: integrate automatic DOCX generation'
          git push origin HEAD:feature/document-workflow-v3

# Re-run after analyzer cleanup.
