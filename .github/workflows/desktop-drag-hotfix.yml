name: Desktop Candidate Drag Hotfix

on:
  push:
    branches:
      - feature/desktop-v2-20260902
    paths:
      - .github/workflows/desktop-drag-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-v2-20260902
          fetch-depth: 0

      - name: Patch native desktop candidate dragging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/recruitment/presentation/recruitment_applications_screen.dart')
          text = path.read_text(encoding='utf-8')

          anchor = "Color get _soft => AppAdaptivePalette.surfaceSoft;\n"
          helper = """Color get _soft => AppAdaptivePalette.surfaceSoft;\n\nbool get _usesImmediatePointerDrag =>\n    kIsWeb ||\n    defaultTargetPlatform == TargetPlatform.windows ||\n    defaultTargetPlatform == TargetPlatform.macOS ||\n    defaultTargetPlatform == TargetPlatform.linux;\n"""
          if '_usesImmediatePointerDrag' not in text:
              if anchor not in text:
                  raise SystemExit('drag helper anchor not found')
              text = text.replace(anchor, helper, 1)

          old_label = "kIsWeb ? 'Перетащи' : 'Удерживай'"
          if old_label in text:
              text = text.replace(
                  old_label,
                  "_usesImmediatePointerDrag ? 'Перетащи' : 'Удерживай'",
                  1,
              )

          old_drag = '    if (kIsWeb) {\n      return Draggable<RecruitmentApplication>('
          new_drag = '    if (_usesImmediatePointerDrag) {\n      return Draggable<RecruitmentApplication>('
          if old_drag in text:
              text = text.replace(old_drag, new_drag, 1)

          if "if (_usesImmediatePointerDrag)" not in text:
              raise SystemExit('desktop Draggable branch was not patched')
          if "_usesImmediatePointerDrag ? 'Перетащи' : 'Удерживай'" not in text:
              raise SystemExit('desktop drag hint was not patched')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to patch"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/recruitment/presentation/recruitment_applications_screen.dart
          git commit -m "fix(hr): enable mouse drag on native desktop"
          git push origin HEAD:feature/desktop-v2-20260902
