    final reminderBusy = reminderBusyIds.contains(flight.id);
""",
              """    final flight = entry.flight;
    final ticketCount = entry.tickets.length;
    final reminderBusy = reminderBusyIds.contains(flight.id);
"""
          )

          replace_once(
              screen,
              """                _FlightChip(
                  icon: flight.hasTicket
                      ? Icons.attachment_rounded
                      : Icons.warning_amber_rounded,
                  text: flight.hasTicket ? 'Билет прикреплён' : 'Нет билета',
                ),
""",
              """                _FlightChip(
                  icon: ticketCount > 0
                      ? Icons.attachment_rounded
                      : Icons.warning_amber_rounded,
                  text: ticketCount > 0 ? ticketCountText(ticketCount) : 'Нет билета',
                ),
"""
          )

          replace_once(
              screen,
              """                  child: OutlinedButton.icon(
                    onPressed: flight.hasTicket ? () => openTicket(flight) : null,
                    icon: const Icon(Icons.confirmation_number_outlined),
                    label: const Text('Билет'),
                  ),
""",
              """                  child: OutlinedButton.icon(
                    onPressed: ticketCount > 0 ? () => openTickets(entry) : null,
                    icon: const Icon(Icons.confirmation_number_outlined),
                    label: Text(ticketCount > 1 ? 'Билеты ($ticketCount)' : 'Билет'),
                  ),
"""
          )

          replace_once(
              screen,
              """  Uint8List? ticketBytes;
  String ticketFileName = '';
  bool saving = false;
""",
              """  final List<RecruitmentFlightTicketUpload> pendingTickets =
      <RecruitmentFlightTicketUpload>[];
  bool saving = false;
"""
          )

          replace_once(
              screen,
              """  Future<void> chooseTicket() async {
    final file = await openFile(
      acceptedTypeGroups: const <XTypeGroup>[
        XTypeGroup(
          label: 'Билет',
          extensions: <String>['pdf', 'jpg', 'jpeg', 'png', 'webp', 'heic'],
        ),
      ],
    );
    if (file == null) return;
    final bytes = await file.readAsBytes();
    if (!mounted) return;
    if (bytes.length > 20 * 1024 * 1024) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Файл билета должен быть меньше 20 МБ')),
      );
      return;
    }
    setState(() {
      ticketBytes = bytes;
      ticketFileName = file.name;
    });
  }
""",
              """  Future<void> chooseTickets() async {
    final existingTickets = widget.entry?.tickets ?? const <RecruitmentFlightTicket>[];
    final remaining = RecruitmentFlightRepository.maxTicketsPerFlight -
        existingTickets.length -
        pendingTickets.length;
    if (remaining <= 0) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          content: Text(
            'К одному вылету можно прикрепить не больше ${RecruitmentFlightRepository.maxTicketsPerFlight} билетов',
          ),
        ),
      );
      return;
    }
    final files = await openFiles(
      acceptedTypeGroups: const <XTypeGroup>[
        XTypeGroup(
          label: 'Билеты',
          extensions: <String>['pdf', 'jpg', 'jpeg', 'png', 'webp', 'heic'],
        ),
      ],
    );
    if (files.isEmpty) return;

    final selectedFiles = files.take(remaining).toList(growable: false);
    final additions = <RecruitmentFlightTicketUpload>[];
    var totalBytes = pendingTickets.fold<int>(0, (sum, item) => sum + item.bytes.length);
    final rejected = <String>[];
    for (final file in selectedFiles) {
      final bytes = await file.readAsBytes();
      if (bytes.isEmpty || bytes.length > RecruitmentFlightRepository.maxTicketBytes) {
        rejected.add(file.name);
        continue;
      }
      if (totalBytes + bytes.length > RecruitmentFlightRepository.maxTotalTicketBytes) {
        rejected.add(file.name);
        continue;
      }
      final duplicate = pendingTickets.any(
        (item) => item.fileName == file.name && item.bytes.length == bytes.length,
      );
      if (duplicate) continue;
      totalBytes += bytes.length;
      additions.add(
        RecruitmentFlightTicketUpload(fileName: file.name, bytes: bytes),
      );
    }
    if (!mounted) return;
    setState(() => pendingTickets.addAll(additions));
    if (files.length > remaining || rejected.isNotEmpty) {
      final details = <String>[
        if (files.length > remaining) 'лишние файлы не добавлены: лимит 10 билетов',
        if (rejected.isNotEmpty) 'пропущено файлов: ${rejected.length}',
      ];
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text(details.join(' · '))),
      );
    }
  }
"""
