      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Поддержать несколько билетов в календаре вылетов"
          git push origin HEAD:feature/recruitment-multiple-flight-tickets
