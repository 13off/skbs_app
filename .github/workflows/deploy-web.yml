name: Build and publish web

on:
  push:
    branches:
      - main
    paths:
      - lib/**
      - test/**
      - assets/**
      - web/**
      - tool/web_smoke.py
      - tool/pwa_offline_smoke.py
      - pubspec.yaml
      - pubspec.lock
      - .fvmrc
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstroy-web-deploy
  cancel-in-progress: true

env:
  APP_PUBLIC_URL: https://13off.github.io/appstroy-web-deploy/
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
  FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
  FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
  FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
  FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check deploy token
        shell: bash
        run: |
          if [ -z "${{ secrets.WEB_DEPLOY_TOKEN }}" ]; then
            echo "::error::Не найден secret WEB_DEPLOY_TOKEN"
            exit 1
          fi

      - name: Checkout private source app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: skbs_app
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: skbs_app/.fvmrc
          cache: true

      - name: Install icon renderer
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y librsvg2-bin >/dev/null

      - name: Generate web icons
        shell: bash
        run: |
          mkdir -p skbs_app/web/icons
          rsvg-convert -w 192 -h 192 skbs_app/web/icons/app_icon_matte_v2.svg -o skbs_app/web/icons/AppStroy-192-v2.png
          rsvg-convert -w 512 -h 512 skbs_app/web/icons/app_icon_matte_v2.svg -o skbs_app/web/icons/AppStroy-512-v2.png
          rsvg-convert -w 64 -h 64 skbs_app/web/icons/app_icon_matte_v2.svg -o skbs_app/web/favicon-v2.png

      - name: Install locked dependencies
        working-directory: skbs_app
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Run regression tests
        working-directory: skbs_app
        shell: bash
        run: flutter test --reporter compact 2>&1 | tee ../flutter-test.log

      - name: Analyze source strictly
        working-directory: skbs_app
        shell: bash
        run: flutter analyze 2>&1 | tee ../flutter-analyze.log

      - name: Configure public Firebase web values
        working-directory: skbs_app
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('web/firebase-messaging-sw.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '__FIREBASE_API_KEY__': os.environ.get('FIREBASE_API_KEY', ''),
              '__FIREBASE_AUTH_DOMAIN__': os.environ.get('FIREBASE_AUTH_DOMAIN', ''),
              '__FIREBASE_PROJECT_ID__': os.environ.get('FIREBASE_PROJECT_ID', ''),
              '__FIREBASE_STORAGE_BUCKET__': os.environ.get('FIREBASE_STORAGE_BUCKET', ''),
              '__FIREBASE_MESSAGING_SENDER_ID__': os.environ.get('FIREBASE_MESSAGING_SENDER_ID', ''),
              '__FIREBASE_WEB_APP_ID__': os.environ.get('FIREBASE_WEB_APP_ID', ''),
              '__APP_PUBLIC_URL__': os.environ.get('APP_PUBLIC_URL', ''),
          }
          for marker, value in replacements.items():
              text = text.replace(marker, value)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build Flutter Web
        working-directory: skbs_app
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release \
            --base-href /appstroy-web-deploy/ \
            --dart-define=SUPABASE_URL=https://api.appstroy-web.ru \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID" \
            --dart-define=FIREBASE_VAPID_KEY="$FIREBASE_VAPID_KEY" \
            2>&1 | tee ../flutter-web-build.log

      - name: Prepare cache-busted public build
        shell: bash
        run: |
          BUILD_ID="${GITHUB_RUN_ID}"
          sed -i '/class="loader-progress"/d' skbs_app/build/web/index.html
          sed -i "s/manifest\.json/manifest.json?v=${BUILD_ID}/g" skbs_app/build/web/index.html
          sed -i "s/flutter_bootstrap\.js/flutter_bootstrap.js?v=${BUILD_ID}/g" skbs_app/build/web/index.html
          sed -i "s/main\.dart\.js/main.dart.js?v=${BUILD_ID}/g" skbs_app/build/web/flutter_bootstrap.js
          cp skbs_app/build/web/index.html skbs_app/build/web/404.html
          rm -rf skbs_app/build/web/downloads

      - name: Reject source files and private material in public snapshot
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="skbs_app/build/web"
          test -s "${BUILD_DIR}/index.html"
          test -s "${BUILD_DIR}/main.dart.js"
          test -s "${BUILD_DIR}/flutter_bootstrap.js"

          forbidden="$(find "$BUILD_DIR" -type f \( \
            -name '*.dart' -o \
            -name '*.map' -o \
            -name '.env' -o \
            -name '.env.*' -o \
            -name '*.pem' -o \
            -name '*.key' -o \
            -name '*.p12' -o \
            -name '*.jks' -o \
            -name '*.keystore' \
          \) -print)"
          if [ -n "$forbidden" ]; then
            echo "::error::В публичной сборке найдены запрещённые файлы"
            printf '%s\n' "$forbidden"
            exit 1
          fi

          if grep -RIl --exclude-dir='.git' -E -- \
            '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----' "$BUILD_DIR" | grep -q .; then
            echo "::error::В публичной сборке найден приватный ключ"
            exit 1
          fi

          if [ -e "${BUILD_DIR}/downloads" ]; then
            echo "::error::Папка внутренних deploy-диагностик не должна публиковаться"
            exit 1
          fi

      - name: Install browser smoke dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet selenium==4.28.1 pillow==11.1.0

      - name: Validate built PWA in headless Chrome
        id: browser-smoke
        working-directory: skbs_app
        run: python3 tool/web_smoke.py --base-path appstroy-web-deploy

      - name: Validate PWA cold start without network
        id: offline-smoke
        working-directory: skbs_app
        run: python3 tool/pwa_offline_smoke.py --base-path appstroy-web-deploy

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-browser-smoke-evidence
          path: |
            skbs_app/.artifacts/browser-smoke
            skbs_app/.artifacts/pwa-offline-smoke
          if-no-files-found: warn
          retention-days: 3

      - name: Checkout public deployment repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 13off/appstroy-web-deploy
          token: ${{ secrets.WEB_DEPLOY_TOKEN }}
          path: appstroy-web-deploy
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Publish one clean root snapshot
        working-directory: appstroy-web-deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan deploy-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          cp -R ../skbs_app/build/web/. ./
          touch .nojekyll
          rm -rf downloads

          git add -A
          git commit -m "Deploy AppСтрой"
          git branch -M main
          git push --force origin main

      - name: Verify public repository contains one reachable root commit
        working-directory: appstroy-web-deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main
          git checkout -B main origin/main
          count="$(git rev-list --count HEAD)"
          parents="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          printf 'Reachable commits: %s\n' "$count"
          printf 'Root parents: %s\n' "$parents"
          test "$count" = "1"
          test "$parents" = "0"
          test -s index.html
          test -s main.dart.js
          test ! -e downloads
