name: Build and publish web

on:
  push:
    branches:
      - main
    paths:
      - lib/**
      - test/**
      - assets/**
      - web/**
      - tool/web_smoke.py
      - pubspec.yaml
      - pubspec.lock
      - .fvmrc
      - .patch-expenses-period
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appstroy-web
  cancel-in-progress: true

env:
  APP_PUBLIC_URL: https://13off.github.io/appstroy-web/
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
  FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
  FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
  FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
  FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}

jobs:
  patch-expenses-period:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'trigger expense period patch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Patch period picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/expenses/presentation/expenses_screen.dart')
          source = path.read_text(encoding='utf-8')
          old = """  Future<void> choosePeriod() async {
    final picked = await showDateRangePicker(
      context: context,
      firstDate: DateTime(2024),
      lastDate: DateTime.now().add(const Duration(days: 365)),
      initialDateRange: DateTimeRange(start: from, end: to),
      helpText: 'Период расходов',
      saveText: 'Применить',
    );
    if (picked == null || !mounted) return;
    setState(() {
      from = DateTime(picked.start.year, picked.start.month, picked.start.day);
      to = DateTime(picked.end.year, picked.end.month, picked.end.day);
    });
    await load();
  }
"""
          new = """  Future<void> choosePeriod() async {
    var draftStart = DateTime(from.year, from.month, from.day);
    var draftEnd = DateTime(to.year, to.month, to.day);
    var editingStart = true;
    final firstAllowed = DateTime(2024);
    final lastAllowed = DateTime.now().add(const Duration(days: 365));

    final picked = await showDialog<DateTimeRange>(
      context: context,
      barrierDismissible: false,
      builder: (dialogContext) => StatefulBuilder(
        builder: (context, setDialogState) {
          final activeDate = editingStart ? draftStart : draftEnd;

          return AlertDialog(
            title: const Text('Период расходов'),
            content: SizedBox(
              width: 430,
              child: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  Row(
                    children: [
                      Expanded(
                        child: ChoiceChip(
                          label: Text('С ${formatDate(draftStart)}'),
                          selected: editingStart,
                          onSelected: (_) {
                            setDialogState(() => editingStart = true);
                          },
                        ),
                      ),
                      const SizedBox(width: 10),
                      Expanded(
                        child: ChoiceChip(
                          label: Text('По ${formatDate(draftEnd)}'),
                          selected: !editingStart,
                          onSelected: (_) {
                            setDialogState(() => editingStart = false);
                          },
                        ),
                      ),
                    ],
                  ),
                  const SizedBox(height: 10),
                  CalendarDatePicker(
                    key: ValueKey<String>(
                      '${editingStart ? 'start' : 'end'}-${activeDate.toIso8601String()}',
                    ),
                    initialDate: activeDate,
                    firstDate: firstAllowed,
                    lastDate: lastAllowed,
                    onDateChanged: (value) {
                      final clean = DateTime(value.year, value.month, value.day);
                      setDialogState(() {
                        if (editingStart) {
                          draftStart = clean;
                          if (draftEnd.isBefore(draftStart)) {
                            draftEnd = draftStart;
                          }
                          editingStart = false;
                        } else {
                          draftEnd = clean;
                          if (draftStart.isAfter(draftEnd)) {
                            draftStart = draftEnd;
                          }
                        }
                      });
                    },
                  ),
                ],
              ),
            ),
            actions: [
              TextButton(
                onPressed: () => Navigator.pop(dialogContext),
                child: const Text('Отмена'),
              ),
              FilledButton.icon(
                onPressed: () {
                  Navigator.pop(
                    dialogContext,
                    DateTimeRange(start: draftStart, end: draftEnd),
                  );
                },
                icon: const Icon(Icons.check_rounded),
                label: const Text('Применить'),
              ),
            ],
          );
        },
      ),
    );

    if (picked == null || !mounted) return;
    setState(() {
      from = DateTime(picked.start.year, picked.start.month, picked.start.day);
      to = DateTime(picked.end.year, picked.end.month, picked.end.day);
    });
    await load();
  }
"""
          if old not in source:
              raise SystemExit('choosePeriod snippet not found')
          source = source.replace(old, new, 1)
          assert 'showDateRangePicker(' not in source
          assert 'CalendarDatePicker(' in source
          assert "label: const Text('Применить')" in source
          path.write_text(source, encoding='utf-8')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Analyze source strictly
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Restore deploy workflow and marker
        shell: bash
        run: |
          rm -f .patch-expenses-period
          git show b771bc276cf6ae8a9393ef4a7a116f4cf7ccda7f:.github/workflows/deploy-web.yml > .github/workflows/deploy-web.yml

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить кнопку применения периода расходов"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 4
          done
          exit 1

  build-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit.message != 'chore: wire expense period patch' && github.event.head_commit.message != 'trigger expense period patch') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy token
        shell: bash
        run: |
          if [ -z "${{ secrets.WEB_DEPLOY_TOKEN }}" ]; then
            echo "::error::Не найден secret WEB_DEPLOY_TOKEN"
            exit 1
          fi

      - name: Checkout source app
        uses: actions/checkout@v4
        with:
          path: skbs_app
          show-progress: false

      - name: Checkout web repository
        uses: actions/checkout@v4
        with:
          repository: 13off/appstroy-web
          token: ${{ secrets.WEB_DEPLOY_TOKEN }}
          path: appstroy-web
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: skbs_app/.fvmrc
          cache: true

      - name: Install icon renderer
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y librsvg2-bin >/dev/null

      - name: Generate web icons
        shell: bash
        run: |
          mkdir -p skbs_app/web/icons
          rsvg-convert -w 192 -h 192 skbs_app/web/icons/app_icon_matte_v2.svg -o skbs_app/web/icons/AppStroy-192-v2.png
          rsvg-convert -w 512 -h 512 skbs_app/web/icons/app_icon_matte_v2.svg -o skbs_app/web/icons/AppStroy-512-v2.png
          rsvg-convert -w 64 -h 64 skbs_app/web/icons/app_icon_matte_v2.svg -o skbs_app/web/favicon-v2.png

      - name: Install locked dependencies
        working-directory: skbs_app
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Run regression tests
        working-directory: skbs_app
        shell: bash
        run: flutter test --reporter compact 2>&1 | tee ../flutter-test.log

      - name: Analyze source strictly
        working-directory: skbs_app
        shell: bash
        run: flutter analyze 2>&1 | tee ../flutter-analyze.log

      - name: Configure public Firebase web values
        working-directory: skbs_app
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('web/firebase-messaging-sw.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '__FIREBASE_API_KEY__': os.environ.get('FIREBASE_API_KEY', ''),
              '__FIREBASE_AUTH_DOMAIN__': os.environ.get('FIREBASE_AUTH_DOMAIN', ''),
              '__FIREBASE_PROJECT_ID__': os.environ.get('FIREBASE_PROJECT_ID', ''),
              '__FIREBASE_STORAGE_BUCKET__': os.environ.get('FIREBASE_STORAGE_BUCKET', ''),
              '__FIREBASE_MESSAGING_SENDER_ID__': os.environ.get('FIREBASE_MESSAGING_SENDER_ID', ''),
              '__FIREBASE_WEB_APP_ID__': os.environ.get('FIREBASE_WEB_APP_ID', ''),
              '__APP_PUBLIC_URL__': os.environ.get('APP_PUBLIC_URL', ''),
          }
          for marker, value in replacements.items():
              text = text.replace(marker, value)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build Flutter Web through proxy
        working-directory: skbs_app
        run: |
          flutter build web --release \
            --base-href /appstroy-web/ \
            --dart-define=SUPABASE_URL=https://api.appstroy-web.ru \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID" \
            --dart-define=FIREBASE_VAPID_KEY="$FIREBASE_VAPID_KEY" \
            2>&1 | tee ../flutter-web-build.log

      - name: Bust cache
        shell: bash
        run: |
          BUILD_ID="$(git -C skbs_app rev-parse --short=12 HEAD)"
          sed -i "s/manifest\.json/manifest.json?v=${BUILD_ID}/g" skbs_app/build/web/index.html
          sed -i "s/flutter_bootstrap\.js/flutter_bootstrap.js?v=${BUILD_ID}/g" skbs_app/build/web/index.html
          sed -i "s/main\.dart\.js/main.dart.js?v=${BUILD_ID}/g" skbs_app/build/web/flutter_bootstrap.js
          cp skbs_app/build/web/index.html skbs_app/build/web/404.html

      - name: Install browser smoke dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet selenium==4.28.1 pillow==11.1.0

      - name: Validate built PWA in headless Chrome
        id: browser-smoke
        working-directory: skbs_app
        run: python3 tool/web_smoke.py

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-browser-smoke-evidence
          path: skbs_app/.artifacts/browser-smoke
          if-no-files-found: warn
          retention-days: 3

      - name: Publish web files with conflict-safe retries
        working-directory: appstroy-web
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'downloads' -exec rm -rf {} +
            cp -R ../skbs_app/build/web/. ./
            touch .nojekyll

            git add -A
            if git diff --cached --quiet; then
              echo "No web changes to publish"
              exit 0
            fi

            git commit -m "обновлена веб версия через российский прокси"
            if git push origin HEAD:main; then
              echo "Web files published successfully"
              exit 0
            fi

            echo "Remote changed during publish; rebuilding commit on latest main"
            sleep $((attempt * 3))
          done

          echo "::error::Не удалось опубликовать веб-файлы после 5 попыток"
          exit 1

      - name: Publish web build status
        if: always()
        working-directory: appstroy-web
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUILD_ID="$(git -C ../skbs_app rev-parse --short=12 HEAD)"

          for attempt in 1 2 3 4 5; do
            echo "Status attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p downloads

            if grep -q "flutter_bootstrap.js?v=${BUILD_ID}" index.html 2>/dev/null; then
              BUILD_STATUS="success"
            else
              BUILD_STATUS="failure"
            fi

            printf '%s\n' "${BUILD_STATUS}" > downloads/web-build-status.txt
            printf '%s\n' "${{ github.sha }}" > downloads/web-source-commit.txt

            if [ "${BUILD_STATUS}" = "failure" ]; then
              {
                echo "AppStroy web build failure diagnostics"
                echo "source=${{ github.sha }}"
                for log in ../flutter-test.log ../flutter-analyze.log ../flutter-web-build.log; do
                  if [ -f "${log}" ]; then
                    echo
                    echo "===== $(basename "${log}") ====="
                    tail -n 1000 "${log}"
                  fi
                done
              } > downloads/web-build.log
              test -f ../flutter-test.log && tail -n 800 ../flutter-test.log > downloads/flutter-test-tail.log || rm -f downloads/flutter-test-tail.log
              test -f ../flutter-analyze.log && tail -n 300 ../flutter-analyze.log > downloads/flutter-analyze-tail.log || rm -f downloads/flutter-analyze-tail.log
              test -f ../flutter-web-build.log && tail -n 300 ../flutter-web-build.log > downloads/flutter-web-build-tail.log || rm -f downloads/flutter-web-build-tail.log
            else
              rm -f downloads/web-build.log downloads/flutter-test-tail.log downloads/flutter-analyze-tail.log downloads/flutter-web-build-tail.log
            fi

            git add -A downloads
            if git diff --cached --quiet; then
              echo "Web build status is already current"
              exit 0
            fi

            git commit -m "сохранён статус веб-сборки"
            if git push origin HEAD:main; then
              echo "Web build status published"
              exit 0
            fi

            echo "Remote changed during status publish; retrying"
            sleep $((attempt * 2))
          done

          echo "::error::Не удалось сохранить статус веб-сборки"
          exit 1
