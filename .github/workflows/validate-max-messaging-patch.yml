name: Validate MAX messaging patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-max-messaging-patch.yml

permissions:
  contents: write

concurrency:
  group: validate-max-messaging-patch
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format affected files
        run: |
          dart format \
            lib/features/recruitment/models/recruitment_models.dart \
            lib/features/recruitment/data/recruitment_repository.dart \
            lib/features/recruitment/presentation/recruitment_application_detail_screen.dart

      - name: Analyze affected files
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/features/recruitment/models/recruitment_models.dart \
            lib/features/recruitment/data/recruitment_repository.dart \
            lib/features/recruitment/presentation/recruitment_application_detail_screen.dart

      - name: Build Web/PWA
        run: flutter build web --release --base-href /appstroy-web/

      - name: Save validated formatting
        run: |
          rm -f .github/workflows/validate-max-messaging-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Проверить и отформатировать переписку MAX" || true
          git pull --rebase origin main
          git push
