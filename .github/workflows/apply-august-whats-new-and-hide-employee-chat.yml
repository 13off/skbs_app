name: Apply August what's new and hide employee chat

on:
  push:
    paths:
      - '.github/workflows/apply-august-whats-new-and-hide-employee-chat.yml'

permissions:
  contents: write

concurrency:
  group: apply-august-whats-new-and-hide-employee-chat
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Apply source changes
        run: python3 tooling/apply_august_whats_new_and_hide_employee_chat.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/company_chat/presentation/company_chat_shell.dart \
            lib/features/whats_new/presentation/role_aware_whats_new_gate.dart \
            test/company_chat_compact_window_contract_test.dart \
            test/whats_new_animation_contract_test.dart \
            test/whats_new_release_contract_test.dart \
            test/whats_new_role_filter_contract_test.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run focused regression tests
        run: |
          flutter test \
            test/company_chat_compact_window_contract_test.dart \
            test/whats_new_animation_contract_test.dart \
            test/whats_new_release_contract_test.dart \
            test/whats_new_role_filter_contract_test.dart

      - name: Analyze strictly
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Commit verified changes
        run: |
          rm -f \
            .github/workflows/apply-august-whats-new-and-hide-employee-chat.yml \
            tooling/apply_august_whats_new_and_hide_employee_chat.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Обновить «Что нового» и убрать чат у сотрудников"
          git push

