name: Apply August what's new and hide employee chat

on:
  push:
    paths:
      - '.github/workflows/apply-august-whats-new-and-hide-employee-chat.yml'

permissions:
  contents: write

concurrency:
  group: apply-august-whats-new-and-hide-employee-chat
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Apply role-aware release notes and employee chat guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return value.replace(old, new, 1)

          # Employees must never mount the company chat workspace.
          chat_path = 'lib/features/company_chat/presentation/company_chat_shell.dart'
          chat = read(chat_path)
          chat = replace_once(
              chat,
              "  String get companyId => widget.profile.activeCompanyId.trim();\n",
              "  String get companyId => widget.profile.activeCompanyId.trim();\n\n"
              "  bool get chatAvailable => widget.profile.role != 'employee';\n",
              'chat availability getter',
          )
          chat = replace_once(
              chat,
              "        oldWidget.profile.id != widget.profile.id) {",
              "        oldWidget.profile.id != widget.profile.id ||\n"
              "        oldWidget.profile.role != widget.profile.role) {",
              'chat role update condition',
          )
          chat = replace_once(
              chat,
              "  void start() {\n    if (companyId.isEmpty) {",
              "  void start() {\n"
              "    if (!chatAvailable) {\n"
              "      loading = false;\n"
              "      errorText = null;\n"
              "      return;\n"
              "    }\n"
              "    if (companyId.isEmpty) {",
              'chat startup guard',
          )
          chat = replace_once(
              chat,
              "  @override\n  Widget build(BuildContext context) {\n    final size =",
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    if (!chatAvailable) return widget.child;\n\n"
              "    final size =",
              'chat render guard',
          )
          write(chat_path, chat)

          whats_new_path = (
              'lib/features/whats_new/presentation/'
              'role_aware_whats_new_gate.dart'
          )
          source = read(whats_new_path)
          source = replace_once(
              source,
              "  static const String releaseId =\n"
              "      'mobile-2026-07-29-full-since-1.1.0+2-v2-role-aware';",
              "  static const String releaseId =\n"
              "      'mobile-2026-08-05-employee-workspace-and-procurement-v1';",
              'what is new release id',
          )
          source = replace_once(
              source,
              "  'hr',\n};",
              "  'hr',\n  'procurement',\n};",
              'procurement working role',
          )

          slides = r'''const List<_WhatsNewSlide> _allSlides = <_WhatsNewSlide>[
  _WhatsNewSlide(
    icon: Icons.phone_android_rounded,
    title: 'Новый кабинет сотрудника',
    description:
        'Рабочий кабинет стал проще: сотруднику оставлены только действия, которые нужны каждый день.',
    points: <String>[
      'Три вкладки: «Главная», «Задачи» и «Профиль».',
      'Большая анимированная кнопка начала и завершения рабочего дня.',
      'Корпоративный чат убран из кабинета сотрудника.',
    ],
    demo: _WhatsNewDemoKind.employeeCabinet,
    roles: <String>{'employee', 'foreman'},
  ),
  _WhatsNewSlide(
    icon: Icons.route_rounded,
    title: 'Маршруты, геозоны и работа без связи',
    description:
        'Рабочий день теперь записывается устойчивее даже на объектах с плохим интернетом.',
    points: <String>[
      'Координаты временно сохраняются на телефоне и отправляются после восстановления связи.',
      'Руководитель видит маршрут и журнал разрывов геолокации.',
      'Добавлены геозоны и отмена ошибочно начатого рабочего дня.',
    ],
    demo: _WhatsNewDemoKind.dispatcher,
    roles: <String>{'employee', 'foreman'},
  ),
  _WhatsNewSlide(
    icon: Icons.verified_user_outlined,
    title: 'Вход сотрудника через MAX',
    description:
        'Сотрудник подтверждает вход одной кнопкой в MAX — без ручного переписывания кода.',
    points: <String>[
      'AppСтрой автоматически продолжает вход после подтверждения.',
      'Номер сверяется с карточкой сотрудника компании.',
      'Резервный вход по коду сохранён на случай недоступности MAX.',
    ],
    demo: _WhatsNewDemoKind.notifications,
    roles: <String>{'employee', 'foreman', 'hr'},
  ),
  _WhatsNewSlide(
    icon: Icons.task_alt_rounded,
    title: 'Реальные задачи и фотографии',
    description:
        'Сотрудник работает с настоящими назначенными задачами и фиксирует результат прямо в приложении.',
    points: <String>[
      'Начало смены и выполнение конкретной задачи разделены.',
      'К задачам прикрепляются рабочие фотографии.',
      'В профиле сохраняется история выполненных задач.',
    ],
    demo: _WhatsNewDemoKind.contribution,
    roles: <String>{'employee', 'foreman'},
  ),
  _WhatsNewSlide(
    icon: Icons.table_view_outlined,
    title: 'Табели и выплаты без лишних переходов',
    description:
        'Работа с данными конкретного сотрудника стала быстрее и понятнее.',
    points: <String>[
      'Excel-табель выгружается за несколько месяцев или точный диапазон дат.',
      'В файле есть смены, ставка, начисления и итоговые суммы.',
      'Новую выплату можно добавить прямо из истории сотрудника.',
    ],
    demo: _WhatsNewDemoKind.reportCenter,
    roles: <String>{'foreman', 'accountant'},
  ),
  _WhatsNewSlide(
    icon: Icons.groups_rounded,
    title: 'Команда объекта',
    description:
        'Сотрудник и прораб видят актуальный состав своего объекта без раскрытия закрытых кадровых данных.',
    points: <String>[
      'В списке отображаются реальные коллеги текущего объекта.',
      'Телефоны, ставки, выплаты, комментарии и документы не раскрываются.',
      'Видимость рабочих сведений контролируется настройками доступа.',
    ],
    demo: _WhatsNewDemoKind.rolePlatforms,
    roles: <String>{'employee', 'foreman'},
  ),
  _WhatsNewSlide(
    icon: Icons.inventory_2_outlined,
    title: 'Новая платформа снабжения',
    description:
        'В AppСтрой появилась отдельная роль снабженца и полный рабочий контур закупок.',
    points: <String>[
      'Заявки на материалы и оборудование, поставщики и доставки.',
      'Прораб создаёт заявки только по назначенному объекту.',
      'Бухгалтер видит суммы и сводку без права менять закупки.',
    ],
    demo: _WhatsNewDemoKind.rolePlatforms,
    roles: <String>{'procurement', 'foreman', 'accountant'},
  ),
  _WhatsNewSlide(
    icon: Icons.extension_outlined,
    title: 'Инструменты с анимированным гидом',
    description:
        'Подключаемые возможности теперь собраны в одном понятном разделе.',
    points: <String>[
      'Вместо разрозненного каталога используется единый список инструментов.',
      'У каждого инструмента есть подробное описание назначения.',
      'Добавлен восьмишаговый анимированный сценарий работы.',
    ],
    demo: _WhatsNewDemoKind.developerControls,
    roles: <String>{'developer'},
  ),
  _WhatsNewSlide(
    icon: Icons.desktop_windows_outlined,
    title: 'Новый интерфейс PWA и нижняя панель',
    description:
        'Компьютерная версия стала аккуратнее, просторнее и удобнее для ежедневной работы.',
    points: <String>[
      'Единые боковые отступы применяются ко всем страницам PWA.',
      'Нижняя стеклянная панель центрирована и расширена примерно до 20 см.',
      'Кнопки сохранения и основные действия больше не перекрываются навигацией.',
    ],
    demo: _WhatsNewDemoKind.themeToggle,
    common: true,
  ),
  _WhatsNewSlide(
    icon: Icons.speed_rounded,
    title: 'Быстрее и надёжнее',
    description:
        'Большая внутренняя оптимизация сократила повторные загрузки и укрепила выпуск приложения.',
    points: <String>[
      'Ускорены Realtime, кабинет сотрудника, выплаты и загрузка личных данных.',
      'Добавлены безопасные кеши без изменения ролей и изоляции компаний.',
      'Пройдены 741 тест, Web-сборка, Android, Edge Functions и SQL.',
    ],
    demo: _WhatsNewDemoKind.reportCenter,
    common: true,
  ),
];'''

          pattern = re.compile(
              r"const List<_WhatsNewSlide> _allSlides = <_WhatsNewSlide>\[\n"
              r".*?\n\];\n\nList<_WhatsNewSlide> _slidesFor",
              re.S,
          )
          source, count = pattern.subn(
              slides + "\n\nList<_WhatsNewSlide> _slidesFor",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'slides block: expected one match, found {count}')

          source = replace_once(
              source,
              "  if (profile.role == 'admin') {",
              "  if (profile.role == 'admin' || profile.role == 'developer') {",
              'admin and developer full release notes',
          )
          source = source.replace(
              'Изменения после Android 1.1.0+2',
              'Обновление августа 2026',
          )
          write(whats_new_path, source)

          # Replace focused source-contract tests with the new release contract.
          write(
              'test/whats_new_animation_contract_test.dart',
              '''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('August what is new uses animated navigable slides', () {
    final source = File(
      'lib/features/whats_new/presentation/role_aware_whats_new_gate.dart',
    ).readAsStringSync();

    expect(source, contains('PageView.builder'));
    expect(source, contains('Icons.arrow_back_rounded'));
    expect(source, contains('Icons.arrow_forward_rounded'));
    expect(source, contains('_WhatsNewDemoKind.employeeCabinet'));
    expect(source, contains('_WhatsNewDemoKind.dispatcher'));
    expect(source, contains('_WhatsNewDemoKind.notifications'));
    expect(source, contains('_WhatsNewDemoKind.contribution'));
    expect(source, contains('_WhatsNewDemoKind.reportCenter'));
    expect(source, contains('_WhatsNewDemoKind.rolePlatforms'));
    expect(source, contains('_WhatsNewDemoKind.developerControls'));
    expect(source, contains('_WhatsNewDemoKind.themeToggle'));
    expect(source, contains('disableAnimations'));
    expect(
      source,
      contains(
        'mobile-2026-08-05-employee-workspace-and-procurement-v1',
      ),
    );
  });
}
''',
          )

          write(
              'test/whats_new_release_contract_test.dart',
              '''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('August update is shown once per user and role', () {
    final gate = File(
      'lib/features/whats_new/presentation/role_aware_whats_new_gate.dart',
    ).readAsStringSync();
    final guide = File(
      'lib/features/onboarding/presentation/first_run_guide.dart',
    ).readAsStringSync();
    final mainScreen = File('lib/screens/main_screen.dart').readAsStringSync();

    expect(
      gate,
      contains(
        "releaseId =\n      'mobile-2026-08-05-employee-workspace-and-procurement-v1'",
      ),
    );
    expect(gate, contains("'whats_new_seen_release'"));
    expect(gate, contains('widget.profile.id'));
    expect(gate, contains('widget.profile.role'));
    expect(gate, contains('SharedPreferences.getInstance()'));
    expect(gate, contains('widget.profile.isRolePreview'));
    expect(gate, isNot(contains('FirstRunGuide.showIfNeeded')));
    expect(gate, contains('Обновление августа 2026'));
    expect(gate, contains('Новый кабинет сотрудника'));
    expect(gate, contains('Маршруты, геозоны и работа без связи'));
    expect(gate, contains('Вход сотрудника через MAX'));
    expect(gate, contains('Реальные задачи и фотографии'));
    expect(gate, contains('Табели и выплаты без лишних переходов'));
    expect(gate, contains('Команда объекта'));
    expect(gate, contains('Новая платформа снабжения'));
    expect(gate, contains('Инструменты с анимированным гидом'));
    expect(gate, contains('Новый интерфейс PWA и нижняя панель'));
    expect(gate, contains('Быстрее и надёжнее'));
    expect(gate, isNot(contains('Паспорт специалиста')));
    expect(gate, contains("Text(_isLast ? 'Готово' : 'Далее')"));

    expect(guide, contains('OverlayEntry('));
    expect(guide, contains('_SpotlightPainter'));
    expect(
      mainScreen,
      contains(
        "import '../features/whats_new/presentation/role_aware_whats_new_gate.dart';",
      ),
    );
    expect(
      mainScreen,
      contains('WhatsNewGate(profile: widget.profile, child: buildPlatform())'),
    );
  });
}
''',
          )

          write(
              'test/whats_new_role_filter_contract_test.dart',
              '''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('updates are filtered by role and foreman sees employee changes', () {
    final source = File(
      'lib/features/whats_new/presentation/role_aware_whats_new_gate.dart',
    ).readAsStringSync();

    expect(
      source,
      contains("profile.role == 'admin' || profile.role == 'developer'"),
    );
    expect(source, contains('List<_WhatsNewSlide>.unmodifiable(_allSlides)'));
    expect(source, contains('slide.common || slide.roles.contains(role)'));
    expect(source, contains("roles: <String>{'employee', 'foreman'}"));
    expect(
      source,
      contains("roles: <String>{'employee', 'foreman', 'hr'}"),
    );
    expect(source, contains("roles: <String>{'foreman', 'accountant'}"));
    expect(
      source,
      contains(
        "roles: <String>{'procurement', 'foreman', 'accountant'}",
      ),
    );
    expect(source, contains("roles: <String>{'developer'}"));
    expect(source, contains("'procurement'"));
    expect(source, contains('common: true'));
    expect(source, contains('profile: widget.profile'));
    expect(source, contains('slides: slides'));
    expect(source, isNot(contains('Паспорт специалиста')));
  });
}
''',
          )

          chat_test_path = 'test/company_chat_compact_window_contract_test.dart'
          chat_test = read(chat_test_path)
          anchor = "}\n"
          guard_test = '''
  test('company chat is never mounted for employee role', () {
    final source = File(
      'lib/features/company_chat/presentation/company_chat_shell.dart',
    ).readAsStringSync();
    final mainScreen = File('lib/screens/main_screen.dart').readAsStringSync();

    expect(
      source,
      contains("bool get chatAvailable => widget.profile.role != 'employee'"),
    );
    expect(source, contains('if (!chatAvailable) return widget.child'));
    expect(source, contains('if (!chatAvailable) {'));
    expect(mainScreen, contains('if (profile.isEmployee) return content'));
  });
'''
          if guard_test.strip() not in chat_test:
              pos = chat_test.rfind(anchor)
              if pos < 0:
                  raise SystemExit('chat contract closing brace not found')
              chat_test = chat_test[:pos] + guard_test + chat_test[pos:]
          write(chat_test_path, chat_test)
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/company_chat/presentation/company_chat_shell.dart \
            lib/features/whats_new/presentation/role_aware_whats_new_gate.dart \
            test/company_chat_compact_window_contract_test.dart \
            test/whats_new_animation_contract_test.dart \
            test/whats_new_release_contract_test.dart \
            test/whats_new_role_filter_contract_test.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run focused regression tests
        run: |
          flutter test \
            test/company_chat_compact_window_contract_test.dart \
            test/whats_new_animation_contract_test.dart \
            test/whats_new_release_contract_test.dart \
            test/whats_new_role_filter_contract_test.dart

      - name: Analyze strictly
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Commit verified changes
        run: |
          rm -f .github/workflows/apply-august-whats-new-and-hide-employee-chat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Обновить «Что нового» и убрать чат у сотрудников"
          git push
