name: Publish accepted Android APK

on:
  push:
    branches:
      - main
    paths:
      - release/accepted-android-artifact.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: appstroy-android-apk
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCEPTANCE_RUN_ID: '30934980308'
      ARTIFACT_NAME: full-acceptance-android
      BINARY_SOURCE_SHA: 416f35ccf0d2c3b1b3cb30b3b6cc7d206954eee1
      ACCEPTED_MERGE_SHA: cf07e81bbce12b62b63754b93dd00df1590f5323

    steps:
      - name: Check publish token
        shell: bash
        run: |
          if [ -z "${{ secrets.WEB_DEPLOY_TOKEN }}" ]; then
            echo "::error::Не найден secret WEB_DEPLOY_TOKEN"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout download repository
        uses: actions/checkout@v4
        with:
          repository: 13off/appstroy-web
          token: ${{ secrets.WEB_DEPLOY_TOKEN }}
          path: appstroy-web

      - name: Download accepted Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf accepted-android
          mkdir -p accepted-android
          gh run download "$ACCEPTANCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir accepted-android

      - name: Verify release APK against acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find accepted-android -type f -name 'app-release.apk' -print -quit)"
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::В acceptance-артефакте отсутствует непустой app-release.apk"
            exit 1
          fi

          EVIDENCE_PATH="$(find accepted-android -type f -name 'android-apk-sha256.txt' -print -quit)"
          if [ -z "$EVIDENCE_PATH" ] || [ ! -s "$EVIDENCE_PATH" ]; then
            echo "::error::В acceptance-артефакте отсутствует файл SHA-256"
            exit 1
          fi

          EXPECTED="$(awk '/app-release\.apk$/ {print $1; exit}' "$EVIDENCE_PATH")"
          ACTUAL="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::SHA-256 release APK не совпал с acceptance evidence"
            echo "expected=$EXPECTED"
            echo "actual=$ACTUAL"
            exit 1
          fi

          printf '%s\n' "$APK_PATH" > accepted-android/apk-path.txt
          printf '%s\n' "$ACTUAL" > accepted-android/apk-sha256.txt
          ls -lh "$APK_PATH"
          echo "Verified SHA-256: $ACTUAL"

      - name: Publish verified APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(cat accepted-android/apk-path.txt)"
          APK_SHA="$(cat accepted-android/apk-sha256.txt)"
          SHORT_SHA="${BINARY_SOURCE_SHA:0:12}"

          cd appstroy-web
          git pull --rebase
          mkdir -p downloads
          rm -f downloads/AppStroy-*.apk
          cp "../$APK_PATH" "downloads/AppStroy-${SHORT_SHA}.apk"
          cp "../$APK_PATH" downloads/AppStroy-latest.apk
          printf '%s  %s\n' "$APK_SHA" 'AppStroy-latest.apk' > downloads/AppStroy-latest.sha256
          printf '%s\n' "$BINARY_SOURCE_SHA" > downloads/source-commit.txt
          printf '%s\n' "$ACCEPTED_MERGE_SHA" > downloads/accepted-source-commit.txt
          printf 'success\n' > downloads/apk-build-status.txt
          {
            echo 'Published from green Full Acceptance Android artifact.'
            echo "acceptance_run=$ACCEPTANCE_RUN_ID"
            echo "artifact=$ARTIFACT_NAME"
            echo "binary_source=$BINARY_SOURCE_SHA"
            echo "accepted_merge=$ACCEPTED_MERGE_SHA"
            echo "sha256=$APK_SHA"
          } > downloads/apk-build.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          git commit -m "опубликован проверенный Android APK"
          git push
