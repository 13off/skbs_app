name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - lib/**
      - test/**
      - assets/**
      - web/**
      - tool/web_smoke.py
      - supabase/functions/**
      - supabase/migrations/**
      - pubspec.yaml
      - pubspec.lock
      - .fvmrc
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstroy-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Analyze source strictly
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/flutter-analyze.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- Flutter analyzer failure ---"
            tail -n 160 /tmp/flutter-analyze.log
            exit "$status"
          fi
          tail -n 20 /tmp/flutter-analyze.log

      - name: Run regression tests
        id: regression
        shell: bash
        run: |
          set +e
          flutter test --reporter compact > /tmp/flutter-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- Flutter test failure (last 220 lines) ---"
            tail -n 220 /tmp/flutter-test.log
            exit "$status"
          fi
          tail -n 20 /tmp/flutter-test.log

      - name: Build web release
        run: flutter build web --release --base-href /appstroy-web/

      - name: Install browser smoke dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet selenium==4.28.1 pillow==11.1.0

      - name: Run headless Chrome browser smoke
        id: browser-smoke
        run: python3 tool/web_smoke.py

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: .artifacts/browser-smoke
          if-no-files-found: warn
          retention-days: 3

      - name: Upload failing analyzer log
        if: failure() && steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: /tmp/flutter-analyze.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload failing test log
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: /tmp/flutter-test.log
          if-no-files-found: error
          retention-days: 3

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check changed Edge Functions
        id: edge-check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA"...HEAD -- supabase/functions \
              | grep -E '\.tsx?$' > /tmp/edge-files.txt || true
          else
            find supabase/functions -type f -name '*.ts' -print \
              > /tmp/edge-files.txt
          fi

          if [ ! -s /tmp/edge-files.txt ]; then
            echo "Edge Functions were not changed."
            exit 0
          fi

          : > /tmp/deno-check.log
          while IFS= read -r file; do
            echo "deno check $file" | tee -a /tmp/deno-check.log
            set +e
            deno check "$file" >> /tmp/deno-check.log 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "--- Deno check failure ---"
              tail -n 160 /tmp/deno-check.log
              exit "$status"
            fi
          done < /tmp/edge-files.txt
          tail -n 40 /tmp/deno-check.log

      - name: Guard changed SQL migrations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA"...HEAD -- supabase/migrations \
              | grep -E '\.sql$' > /tmp/migration-files.txt || true
          else
            find supabase/migrations -type f -name '*.sql' -print \
              > /tmp/migration-files.txt
          fi

          if [ ! -s /tmp/migration-files.txt ]; then
            echo "SQL migrations were not changed."
            exit 0
          fi

          while IFS= read -r file; do
            test -s "$file"
            if grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$file"; then
              echo "Conflict marker found in $file"
              exit 1
            fi
          done < /tmp/migration-files.txt

      - name: Upload failing Deno log
        if: failure() && steps.edge-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deno-check-log
          path: /tmp/deno-check.log
          if-no-files-found: error
          retention-days: 3

  live-startup-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for rollback and cache recovery publication
        shell: bash
        run: |
          set -euo pipefail
          base='https://13off.github.io/appstroy-web/'
          for attempt in $(seq 1 30); do
            marker=$(curl --silent --show-error --location --max-time 15 "${base}downloads/web-source-commit.txt?attempt=${attempt}" || true)
            worker=$(curl --silent --show-error --location --max-time 15 "${base}flutter_service_worker.js?attempt=${attempt}" || true)
            echo "attempt=${attempt} marker=${marker}"
            if [[ "$marker" == "2504d441fa011e60f26b1510f526094824426767" ]] && \
               grep -q 'appstroy-recovery-20260803-1' <<<"$worker"; then
              printf '%s' "$worker" > /tmp/live-service-worker.js
              exit 0
            fi
            sleep 4
          done
          echo 'Rollback or cache recovery did not reach GitHub Pages in time.'
          exit 1

      - name: Install live browser dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet selenium==4.28.1

      - name: Open deployed AppСтрой as iPhone
        shell: bash
        run: |
          mkdir -p .artifacts/live-startup
          cat > /tmp/live_startup.py <<'PY'
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          artifacts = Path('.artifacts/live-startup')
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=390,844')
          options.add_experimental_option('mobileEmulation', {
              'deviceMetrics': {'width': 390, 'height': 844, 'pixelRatio': 1.0},
              'userAgent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
          })
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL', 'performance': 'ALL'})

          driver = webdriver.Chrome(options=options)
          state = {}
          try:
              driver.set_page_load_timeout(60)
              driver.get(f'https://13off.github.io/appstroy-web/?live_diag={int(time.time())}')
              time.sleep(20)
              state = driver.execute_script('''
                return {
                  href: location.href,
                  title: document.title,
                  readyState: document.readyState,
                  bodyText: document.body ? document.body.innerText : '',
                  bodyHtmlLength: document.body ? document.body.innerHTML.length : -1,
                  canvases: document.querySelectorAll('canvas').length,
                  flutterViews: document.querySelectorAll('flutter-view').length,
                  glassPanes: document.querySelectorAll('flt-glass-pane').length,
                  serviceWorkerController: navigator.serviceWorker && navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : null,
                  scripts: Array.from(document.scripts).map((script) => script.src || '<inline>'),
                };
              ''')
              logs = driver.get_log('browser')
              (artifacts / 'state.json').write_text(
                  json.dumps({'state': state, 'browserLogs': logs}, ensure_ascii=False, indent=2),
                  encoding='utf-8',
              )
              driver.save_screenshot(str(artifacts / 'live-mobile.png'))
              print(json.dumps(state, ensure_ascii=False, indent=2))
              for entry in logs:
                  print(f"[{entry.get('level')}] {entry.get('message')}")

              severe = [entry for entry in logs if entry.get('level') == 'SEVERE']
              mounted = state.get('flutterViews', 0) > 0 or state.get('canvases', 0) > 0 or state.get('glassPanes', 0) > 0
              if severe or not mounted:
                  raise SystemExit(2)
          finally:
              driver.quit()
          PY
          python3 /tmp/live_startup.py

      - name: Upload live startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-startup-evidence
          path: .artifacts/live-startup
          if-no-files-found: warn
          retention-days: 3
