name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - lib/**
      - test/**
      - assets/**
      - web/**
      - tool/web_smoke.py
      - supabase/functions/**
      - supabase/migrations/**
      - pubspec.yaml
      - pubspec.lock
      - .fvmrc
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appstroy-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Analyze source strictly
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/flutter-analyze.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- Flutter analyzer failure ---"
            tail -n 160 /tmp/flutter-analyze.log
            exit "$status"
          fi
          tail -n 20 /tmp/flutter-analyze.log

      - name: Run regression tests
        id: regression
        shell: bash
        run: |
          set +e
          flutter test --reporter compact > /tmp/flutter-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- Flutter test failure (last 220 lines) ---"
            tail -n 220 /tmp/flutter-test.log
            exit "$status"
          fi
          tail -n 20 /tmp/flutter-test.log

      - name: Build web release
        run: flutter build web --release --base-href /appstroy-web/

      - name: Install browser smoke dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet selenium==4.28.1 pillow==11.1.0

      - name: Run headless Chrome browser smoke
        id: browser-smoke
        run: python3 tool/web_smoke.py

      - name: Apply desktop width patch to the PR branch
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'fix/unify-bottom-navigation-metrics-20260804' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin main "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          from tool.prepare_desktop_patch_artifact import apply_desktop_patch

          root = Path.cwd()
          apply_desktop_patch(root)

          def restore_from_main(path: str) -> None:
              content = subprocess.check_output(
                  ['git', 'show', f'origin/main:{path}'],
              )
              (root / path).write_bytes(content)

          restore_from_main('.github/workflows/pr-check.yml')
          restore_from_main('tool/web_smoke.py')
          (root / 'tool/prepare_desktop_patch_artifact.py').unlink()

          (root / 'test/desktop_full_width_contract_test.dart').write_text(
              """import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

String source(String path) => File(path).readAsStringSync();

void main() {
  test('desktop pages use the available width with one shared margin', () {
    final tokens = source('lib/app/app_ui_tokens.dart');
    final page = source('lib/widgets/app_page.dart');
    final navigation = source('lib/widgets/professional_bottom_navigation.dart');

    expect(tokens, contains('pageDesktopHorizontalPadding = 36'));
    expect(
      page,
      contains('final effectiveMaxContentWidth = isDesktop'),
    );
    expect(page, contains('? double.infinity'));
    expect(navigation, contains('maxWidth: double.infinity'));
    expect(navigation, isNot(contains('maxWidth: isDesktop ? 900')));
  });

  test('custom desktop workspaces no longer use narrow page caps', () {
    final files = <String, String>{
      'lib/screens/adaptive_home_base_screen.dart': '1240',
      'lib/screens/desktop_employees_view.dart': '1400',
      'lib/screens/desktop_tasks_screen.dart': '1400',
      'lib/screens/desktop_timesheet_screen.dart': '1320',
      'lib/features/payments/presentation/screens/payments_screen.dart': '1360',
      'lib/features/milestones/presentation/milestones_screen.dart': '1060',
      'lib/features/milestones/presentation/milestone_detail_screen.dart': '980',
    };

    for (final entry in files.entries) {
      final file = source(entry.key);
      expect(
        file,
        contains(
          'constraints: const BoxConstraints(maxWidth: double.infinity)',
        ),
        reason: entry.key,
      );
      expect(
        file,
        isNot(contains('BoxConstraints(maxWidth: ${entry.value})')),
        reason: entry.key,
      );
    }
  });

  test('mobile page limits remain intact', () {
    expect(
      source('lib/screens/home/home_sections.dart'),
      contains('BoxConstraints(maxWidth: 620)'),
    );
    expect(
      source('lib/screens/employees/employees_view.dart'),
      contains('BoxConstraints(maxWidth: 760)'),
    );
    expect(
      source('lib/screens/timesheet/timesheet_view.dart'),
      contains('BoxConstraints(maxWidth: 860)'),
    );
  });
}
""",
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Растянуть рабочие страницы на всю ширину ПК"
          git push origin HEAD:"$HEAD_BRANCH"

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: .artifacts/browser-smoke
          if-no-files-found: warn
          retention-days: 3

      - name: Upload failing analyzer log
        if: failure() && steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: /tmp/flutter-analyze.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload failing test log
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: /tmp/flutter-test.log
          if-no-files-found: error
          retention-days: 3

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check changed Edge Functions
        id: edge-check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA"...HEAD -- supabase/functions \
              | grep -E '\.tsx?$' > /tmp/edge-files.txt || true
          else
            find supabase/functions -type f -name '*.ts' -print \
              > /tmp/edge-files.txt
          fi

          if [ ! -s /tmp/edge-files.txt ]; then
            echo "Edge Functions were not changed."
            exit 0
          fi

          : > /tmp/deno-check.log
          while IFS= read -r file; do
            echo "deno check $file" | tee -a /tmp/deno-check.log
            set +e
            deno check "$file" >> /tmp/deno-check.log 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "--- Deno check failure ---"
              tail -n 160 /tmp/deno-check.log
              exit "$status"
            fi
          done < /tmp/edge-files.txt
          tail -n 40 /tmp/deno-check.log

      - name: Guard changed SQL migrations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA"...HEAD -- supabase/migrations \
              | grep -E '\.sql$' > /tmp/migration-files.txt || true
          else
            find supabase/migrations -type f -name '*.sql' -print \
              > /tmp/migration-files.txt
          fi

          if [ ! -s /tmp/migration-files.txt ]; then
            echo "SQL migrations were not changed."
            exit 0
          fi

          while IFS= read -r file; do
            test -s "$file"
            if grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$file"; then
              echo "Conflict marker found in $file"
              exit 1
            fi
          done < /tmp/migration-files.txt

      - name: Upload failing Deno log
        if: failure() && steps.edge-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deno-check-log
          path: /tmp/deno-check.log
          if-no-files-found: error
          retention-days: 3
