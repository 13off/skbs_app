name: Apply redundant controls cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-redundant-controls-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-cleanup:
    if: github.head_ref == 'agent/remove-data-control-extra-chat-button'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Apply focused cleanup
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/patch.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence in {path}, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          home_path = Path('lib/screens/adaptive_home_base_screen.dart')
          home = home_path.read_text()
          for import_line in (
              "import '../features/ai/presentation/ai_assistant_screen.dart';\n",
              "import '../navigation/app_page_route.dart';\n",
          ):
              if home.count(import_line) != 1:
                  raise SystemExit(f'Unexpected import count: {import_line!r}')
              home = home.replace(import_line, '', 1)

          method_start = home.index('\n  void openAiAssistant()')
          method_end = home.index('\n  Future<void> showFinancePeriodPicker', method_start)
          home = home[:method_start] + home[method_end:]

          button_marker = "heroTag: 'desktop-home-ai-assistant'"
          marker_at = home.index(button_marker)
          button_start = home.rfind('\n        Positioned(', 0, marker_at)
          button_end = home.index('\n      ],', marker_at)
          if button_start < 0:
              raise SystemExit('Could not find desktop AI Positioned start')
          home = home[:button_start] + home[button_end:]
          home_path.write_text(home)

          developer_path = Path(
              'lib/features/developer/presentation/developer_main_screen.dart'
          )
          developer = developer_path.read_text()
          required_replacements = (
              ("import 'data_governance_screen.dart';\n", ''),
              ('static const int pageCount = 3;', 'static const int pageCount = 2;'),
              ('      1 => const DataGovernanceScreen(),\n', ''),
              (
                  '      2 => ProfileScreen(profile: widget.profile),\n',
                  '      1 => ProfileScreen(profile: widget.profile),\n',
              ),
          )
          for old, new in required_replacements:
              if developer.count(old) != 1:
                  raise SystemExit(f'Unexpected developer marker count: {old!r}')
              developer = developer.replace(old, new, 1)

          control_marker = "label: 'Контроль'"
          marker_at = developer.index(control_marker)
          control_start = developer.rfind(
              '\n        ProfessionalBottomNavigationItem(', 0, marker_at
          )
          control_end = developer.index(
              '\n        ProfessionalBottomNavigationItem(', marker_at
          )
          if control_start < 0:
              raise SystemExit('Could not find Control navigation item start')
          developer = developer[:control_start] + developer[control_end:]
          developer_path.write_text(developer)

          settings_path = Path('lib/screens/settings_screen.dart')
          settings = settings_path.read_text()
          settings_import = (
              "import '../features/developer/presentation/data_governance_screen.dart';\n"
          )
          if settings.count(settings_import) != 1:
              raise SystemExit('Unexpected settings governance import count')
          settings = settings.replace(settings_import, '', 1)

          settings_marker = "title: 'Контроль данных'"
          marker_at = settings.index(settings_marker)
          tile_start = settings.rfind('\n        actionTile(', 0, marker_at)
          tile_end = settings.index('\n        ),', marker_at) + len('\n        ),')
          if tile_start < 0:
              raise SystemExit('Could not find Control data tile start')
          settings = settings[:tile_start] + settings[tile_end:]
          settings_path.write_text(settings)

          replace_once(
              'test/unified_developer_company_constructor_contract_test.dart',
              "expect(main, contains('static const int pageCount = 3;'));",
              "expect(main, contains('static const int pageCount = 2;'));",
          )
          replace_once(
              'test/unified_developer_company_constructor_contract_test.dart',
              'expect(main, contains("label: \'Контроль\'"));',
              'expect(main, isNot(contains("label: \'Контроль\'")));',
          )
          replace_once(
              'test/ai_dispatcher_developer_platform_contract_test.dart',
              'expect(platform, contains("label: \'Контроль\'"));',
              'expect(platform, isNot(contains("label: \'Контроль\'")));',
          )
          replace_once(
              'test/developer_panel_invitation_security_contract_test.dart',
              "expect(platform, contains('static const int pageCount = 3;'));",
              "expect(platform, contains('static const int pageCount = 2;'));",
          )

          task_path = Path('test/task_governance_recycle_bin_contract_test.dart')
          task = task_path.read_text()
          old_test_start = task.index(
              "  test('developer navigation exposes unified control center'"
          )
          next_test_start = task.index(
              "  test('delete confirmation explains recovery and retained data'",
              old_test_start,
          )
          new_test = textwrap.dedent("""\
            test('developer navigation keeps task safety without a duplicate control tab', () {
              final navigation = source(
                'lib/features/developer/presentation/developer_main_screen.dart',
              );

              expect(navigation, contains('static const int pageCount = 2;'));
              expect(navigation, contains("label: 'Конструктор'"));
              expect(navigation, contains("label: 'Профиль'"));
              expect(navigation, isNot(contains('DataGovernanceScreen')));
              expect(navigation, isNot(contains("label: 'Контроль'")));
            });

          """)
          task = task[:old_test_start] + new_test + task[next_test_start:]
          task_path.write_text(task)

          for obsolete in (
              'lib/features/developer/data/data_governance_repository.dart',
              'lib/features/developer/models/data_governance.dart',
              'lib/features/developer/presentation/data_governance_screen.dart',
              'test/unified_data_governance_contract_test.dart',
          ):
              obsolete_path = Path(obsolete)
              if not obsolete_path.exists():
                  raise SystemExit(f'Expected obsolete file is missing: {obsolete}')
              obsolete_path.unlink()

          Path('test/redundant_control_and_ai_entry_contract_test.dart').write_text(
              textwrap.dedent("""\
                import 'dart:io';

                import 'package:flutter_test/flutter_test.dart';

                void main() {
                  test('dedicated data control screen and entry points are removed', () {
                    final developer = File(
                      'lib/features/developer/presentation/developer_main_screen.dart',
                    ).readAsStringSync();
                    final settings = File('lib/screens/settings_screen.dart').readAsStringSync();

                    expect(developer, contains('static const int pageCount = 2;'));
                    expect(developer, isNot(contains('DataGovernanceScreen')));
                    expect(developer, isNot(contains("label: 'Контроль'")));
                    expect(settings, isNot(contains('DataGovernanceScreen')));
                    expect(settings, isNot(contains("title: 'Контроль данных'")));
                    expect(
                      File(
                        'lib/features/developer/presentation/data_governance_screen.dart',
                      ).existsSync(),
                      isFalse,
                    );
                    expect(
                      File(
                        'lib/features/developer/data/data_governance_repository.dart',
                      ).existsSync(),
                      isFalse,
                    );
                    expect(
                      File('lib/features/developer/models/data_governance.dart').existsSync(),
                      isFalse,
                    );
                  });

                  test('duplicate desktop AI button is removed while chat launcher remains', () {
                    final home = File(
                      'lib/screens/adaptive_home_base_screen.dart',
                    ).readAsStringSync();
                    final chat = File(
                      'lib/features/company_chat/presentation/company_chat_shell.dart',
                    ).readAsStringSync();

                    expect(home, isNot(contains('desktop-home-ai-assistant')));
                    expect(home, isNot(contains('AiAssistantScreen')));
                    expect(home, isNot(contains("label: const Text('ИИ-помощник')")));
                    expect(chat, contains("ValueKey<String>('company-chat-launcher')"));
                    expect(chat, contains('class _ChatLauncherButton'));
                    expect(chat, contains('thread.isAssistant'));
                    expect(chat, contains("'Личный диалог с ИИ-помощником'"));
                  });
                }
              """)
          )
          PY

          if grep -R -nE 'DataGovernance|data_governance_screen|Контроль данных' lib; then
            echo 'Obsolete data-control frontend reference remains.'
            exit 1
          fi
          if grep -nE 'desktop-home-ai-assistant|AiAssistantScreen|openAiAssistant' lib/screens/adaptive_home_base_screen.dart; then
            echo 'Duplicate desktop AI entry remains.'
            exit 1
          fi

      - name: Upload patch diagnostics
        if: failure() && steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: redundant-controls-patch-log
          path: /tmp/patch.log
          if-no-files-found: error
          retention-days: 3

      - name: Restore standard workflow and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/pr-check.yml
          rm -f .github/workflows/agent-remove-redundant-controls.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Убрать контроль данных и дублирующую кнопку ИИ"
          git push origin HEAD:${{ github.head_ref }}
