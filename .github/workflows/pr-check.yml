name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/pr-check.yml
      - .github/workflows/apply-location-ten-minute-interval.yml
      - release/location-ten-minute-interval.txt
      - release/location-ten-minute-interval-pr.txt
      - tool/apply_location_ten_minute_interval.py

permissions:
  contents: write

concurrency:
  group: location-ten-minute-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-test-and-publish:
    if: github.head_ref == 'fix/location-ten-minute-interval-via-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Apply ten-minute location patch
        run: python3 tool/apply_location_ten_minute_interval.py

      - name: Scope regression contract to the sampling interval
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          test_path = Path('test/employee_location_sampling_contract_test.dart')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              "expect(source, isNot(contains('Duration(seconds: 30)')));",
              "expect(source, isNot(contains('intervalDuration: const Duration(seconds: 30)')));",
          )
          text = text.replace(
              "expect(source, isNot(contains('LocationAccuracy.bestForNavigation')));",
              "expect(source, contains('intervalDuration: _captureInterval'));",
          )
          test_path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time files and restore regular PR Check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rm -f release/location-ten-minute-interval.txt
          rm -f release/location-ten-minute-interval-pr.txt
          rm -f tool/apply_location_ten_minute_interval.py
          rm -f .github/workflows/apply-location-ten-minute-interval.yml
          git show "$BASE_SHA:.github/workflows/pr-check.yml" > .github/workflows/pr-check.yml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/employee/data/employee_shift_runtime.dart \
            test/employee_location_sampling_contract_test.dart

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run complete Flutter test suite
        run: flutter test --reporter compact

      - name: Build web release
        run: flutter build web --release --base-href /appstroy-web/

      - name: Commit verified implementation to PR branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Снизить частоту геолокации до одной точки в 10 минут"
          git push origin HEAD:"$HEAD_BRANCH"
