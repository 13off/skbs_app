name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - lib/**
      - test/**
      - web/**
      - supabase/functions/**
      - supabase/migrations/**
      - pubspec.yaml
      - pubspec.lock
      - .fvmrc
      - .github/workflows/pr-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstroy-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/full-safe-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Analyze source
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/flutter-analyze.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- Flutter analyzer failure ---"
            tail -n 120 /tmp/flutter-analyze.log
            exit "$status"
          fi
          tail -n 20 /tmp/flutter-analyze.log

      - name: Run regression tests
        id: regression
        shell: bash
        run: |
          set +e
          flutter test --reporter compact > /tmp/flutter-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- Flutter test failure (last 180 lines) ---"
            tail -n 180 /tmp/flutter-test.log
            exit "$status"
          fi
          tail -n 20 /tmp/flutter-test.log

      - name: Build web release
        run: flutter build web --release --base-href /appstroy-web/

      - name: Upload failing analyzer log
        if: failure() && steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: /tmp/flutter-analyze.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload failing test log
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: /tmp/flutter-test.log
          if-no-files-found: error
          retention-days: 3

  backend-check:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/full-safe-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check changed Edge Functions
        id: edge-check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA"...HEAD -- supabase/functions \
              | grep -E '\.tsx?$' > /tmp/edge-files.txt || true
          else
            find supabase/functions -type f -name '*.ts' -print \
              > /tmp/edge-files.txt
          fi

          if [ ! -s /tmp/edge-files.txt ]; then
            echo "Edge Functions were not changed."
            exit 0
          fi

          : > /tmp/deno-check.log
          while IFS= read -r file; do
            echo "deno check $file" | tee -a /tmp/deno-check.log
            set +e
            deno check "$file" >> /tmp/deno-check.log 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "--- Deno check failure ---"
              tail -n 160 /tmp/deno-check.log
              exit "$status"
            fi
          done < /tmp/edge-files.txt
          tail -n 40 /tmp/deno-check.log

      - name: Guard changed SQL migrations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA"...HEAD -- supabase/migrations \
              | grep -E '\.sql$' > /tmp/migration-files.txt || true
          else
            find supabase/migrations -type f -name '*.sql' -print \
              > /tmp/migration-files.txt
          fi

          if [ ! -s /tmp/migration-files.txt ]; then
            echo "SQL migrations were not changed."
            exit 0
          fi

          while IFS= read -r file; do
            test -s "$file"
            if grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$file"; then
              echo "Conflict marker found in $file"
              exit 1
            fi
          done < /tmp/migration-files.txt

      - name: Upload failing Deno log
        if: failure() && steps.edge-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deno-check-log
          path: /tmp/deno-check.log
          if-no-files-found: error
          retention-days: 3

  repair-source:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/full-safe-hardening' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Repair extension state boundaries and async contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          protected_calls = {
              'lib/screens/employee_details/employee_details_copy.dart': [153, 173],
              'lib/screens/employee_details/employee_details_navigation.dart': [13],
              'lib/screens/employee_details/employee_details_status.dart': [30, 41, 86, 97, 102, 111, 140],
              'lib/screens/employees/employees_sections.dart': [83, 92],
              'lib/screens/home/home_actions.dart': [114],
              'lib/screens/home/home_loading.dart': [16, 121],
              'lib/screens/period_timesheet/period_timesheet_export.dart': [11, 45, 98],
              'lib/screens/period_timesheet/period_timesheet_loading.dart': [25, 39, 45],
              'lib/screens/period_timesheet/period_timesheet_period_picker.dart': [108],
              'lib/screens/period_timesheet/period_timesheet_view.dart': [72, 82],
              'lib/screens/task_create/task_create_actions.dart': [17, 30, 38, 46, 51, 56, 64, 76],
              'lib/screens/task_create/task_create_loading.dart': [32, 38, 46, 57, 64, 69],
              'lib/screens/task_details/task_details_actions.dart': [16, 29, 47, 63, 75, 77, 121, 129, 138, 140, 160, 173, 254, 283, 285],
              'lib/screens/task_details/task_details_loading.dart': [38, 62, 83],
              'lib/screens/timesheet/timesheet_actions.dart': [33, 56, 87, 183, 197, 210, 213],
              'lib/screens/timesheet/timesheet_loading.dart': [25, 38, 43, 46],
              'lib/screens/timesheet/timesheet_sections.dart': [183, 205],
              'lib/screens/timesheet/timesheet_sync.dart': [26],
          }

          parents = {}
          for raw_path, line_numbers in protected_calls.items():
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              for line_number in line_numbers:
                  index = line_number - 1
                  if index >= len(lines) or 'setState(' not in lines[index]:
                      raise RuntimeError(f'Expected setState at {raw_path}:{line_number}')
                  lines[index] = lines[index].replace('setState(', '_updateState(', 1)
              updated = ''.join(lines)
              path.write_text(updated, encoding='utf-8')

              part_match = re.search(r"part of '([^']+)';", updated)
              state_match = re.search(r'extension\s+\w+\s+on\s+(_\w+State)\s*\{', updated)
              if not part_match or not state_match:
                  raise RuntimeError(f'Unable to resolve parent state for {raw_path}')
              parent_path = (path.parent / part_match.group(1)).resolve()
              parents.setdefault(parent_path, set()).add(state_match.group(1))

          root = Path.cwd().resolve()
          for parent_path, state_names in parents.items():
              if root not in parent_path.parents:
                  raise RuntimeError(f'Parent path escaped repository: {parent_path}')
              text = parent_path.read_text(encoding='utf-8')
              for state_name in state_names:
                  if re.search(r'void\s+_updateState\s*\(', text):
                      continue
                  pattern = re.compile(
                      rf'(class\s+{re.escape(state_name)}\s+extends\s+State<[^>]+>'
                      rf'(?:\s+with\s+[^{{]+)?\s*\{{)'
                  )
                  replacement = (
                      r'\1\n'
                      '  void _updateState(VoidCallback callback) => setState(callback);\n'
                  )
                  text, count = pattern.subn(replacement, text, count=1)
                  if count != 1:
                      raise RuntimeError(
                          f'Unable to insert state boundary into {parent_path}:{state_name}'
                      )
              parent_path.write_text(text, encoding='utf-8')

          coordinator_path = Path(
              'lib/features/ai/actions/ai_action_execution_coordinator.dart'
          )
          coordinator = coordinator_path.read_text(encoding='utf-8')
          old_switch = """      final result = switch (action.type) {
        'create_task_draft' => await _createTask(context, profile, action),
        'prepare_document' => await _prepareDocument(context, profile, action),
        'prepare_timesheet_correction' => await _correctTimesheet(action),
        'prepare_employee_update' =>
          await _prepareEmployeeUpdate(context, action),
        'create_employee_draft' => await _createEmployee(context, action),
        'prepare_payment' => await _preparePayment(context, action),
        'find_operational_anomalies' =>
          await _openOperationalAudit(context, action),
        'find_missing_receipts' || 'prepare_candidate_documents' =>
          await _openOperationalReport(context, profile, action),
        'open_period_timesheet' => await _openPeriodTimesheet(context, action),
        'prepare_work_act' => await _prepareWorkAct(context, action),
        'create_reminder' => await _createReminder(context, action),
        _ => throw UnsupportedError(
            'Действие «${action.type}» пока не поддерживается',
          ),
      };
"""
          new_switch = """      final result = await _executeConfirmedAction(
        context: context,
        profile: profile,
        action: action,
      );
"""
          if old_switch not in coordinator:
              raise RuntimeError('AI coordinator switch shape changed')
          coordinator = coordinator.replace(old_switch, new_switch, 1)
          helper = """
  static Future<AiActionExecutionResult> _executeConfirmedAction({
    required BuildContext context,
    required AppUserProfile profile,
    required AiAssistantAction action,
  }) async {
    return switch (action.type) {
      'create_task_draft' => await _createTask(context, profile, action),
      'prepare_document' => await _prepareDocument(context, profile, action),
      'prepare_timesheet_correction' => await _correctTimesheet(action),
      'prepare_employee_update' => await _prepareEmployeeUpdate(context, action),
      'create_employee_draft' => await _createEmployee(context, action),
      'prepare_payment' => await _preparePayment(context, action),
      'find_operational_anomalies' => await _openOperationalAudit(context, action),
      'find_missing_receipts' || 'prepare_candidate_documents' =>
        await _openOperationalReport(context, profile, action),
      'open_period_timesheet' => await _openPeriodTimesheet(context, action),
      'prepare_work_act' => await _prepareWorkAct(context, action),
      'create_reminder' => await _createReminder(context, action),
      _ => throw UnsupportedError(
          'Действие «${action.type}» пока не поддерживается',
        ),
    };
  }

"""
          marker = '  static Future<void> _loadCurrentTimesheetValue('
          if marker not in coordinator:
              raise RuntimeError('AI coordinator helper marker changed')
          coordinator = coordinator.replace(marker, helper + marker, 1)
          coordinator_path.write_text(coordinator, encoding='utf-8')

          action_screen_path = Path(
              'lib/features/ai/presentation/ai_assistant_action_screen.dart'
          )
          action_screen = action_screen_path.read_text(encoding='utf-8')
          action_marker = """        return;
      }

      final draft = await Navigator.of(context).push<TaskCreateDraft>(
"""
          action_replacement = """        return;
      }
      if (!mounted) return;

      final draft = await Navigator.of(context).push<TaskCreateDraft>(
"""
          if action_marker not in action_screen:
              raise RuntimeError('AI task draft navigation marker changed')
          action_screen = action_screen.replace(action_marker, action_replacement, 1)
          action_screen_path.write_text(action_screen, encoding='utf-8')

          templates_path = Path('lib/screens/template_documents_screen.dart')
          templates = templates_path.read_text(encoding='utf-8')
          old_sheet = """                                  if (!mounted) return;
                                  Navigator.pop(sheetContext);
"""
          new_sheet = """                                  if (!sheetContext.mounted) return;
                                  Navigator.pop(sheetContext);
"""
          old_page = """                                  if (!mounted) return;
                                  ScaffoldMessenger.of(context).showSnackBar(
"""
          new_page = """                                  if (!context.mounted) return;
                                  ScaffoldMessenger.of(context).showSnackBar(
"""
          if old_sheet not in templates or old_page not in templates:
              raise RuntimeError('Document template async context shape changed')
          templates = templates.replace(old_sheet, new_sheet, 1)
          templates = templates.replace(old_page, new_page, 1)
          templates_path.write_text(templates, encoding='utf-8')
          PY

      - name: Apply supported Dart fixes
        run: dart fix --apply

      - name: Format repaired Dart files
        run: dart format lib test

      - name: Analyze repaired source
        shell: bash
        run: |
          mkdir -p repair_logs
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee repair_logs/flutter-analyze.log

      - name: Run every regression test
        run: flutter test --reporter compact

      - name: Build release Web/PWA
        run: flutter build web --release --base-href /appstroy-web/

      - name: Commit only fully validated repairs
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-check.yml
          rm -f .github/workflows/temporary-safe-repair.yml
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "structural_repair=completed"
            echo "dart_fix=completed"
            echo "analyze=completed"
            echo "tests=completed"
            echo "web_build=completed"
          } > repair_logs/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes produced"
            exit 0
          fi
          git commit -m "Применить проверенные исправления анализатора"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
