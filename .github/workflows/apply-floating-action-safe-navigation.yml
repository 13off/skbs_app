name: Apply floating action safe navigation

on:
  push:
    branches:
      - fix/floating-actions-safe-navigation
    paths:
      - '.github/workflows/apply-floating-action-safe-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/floating-actions-safe-navigation
          fetch-depth: 0

      - name: Apply shared safe-area metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          desktop = Path('lib/screens/desktop_timesheet_screen.dart')
          source = desktop.read_text(encoding='utf-8')
          source = source.replace(
              "import '../app/app_adaptive_palette.dart';\nimport 'package:intl/intl.dart';",
              "import '../app/app_adaptive_palette.dart';\nimport '../app/app_ui_tokens.dart';\nimport 'package:intl/intl.dart';",
              1,
          )
          source = source.replace(
              "  Widget build(BuildContext context) {\n    final visible = visibleEmployees();\n\n    return Scaffold(",
              "  Widget build(BuildContext context) {\n    final visible = visibleEmployees();\n    final floatingBottom = AppUi.floatingActionBottom(context);\n    final listBottom = AppUi.floatingActionListBottomPadding(\n      context,\n      actionHeight: 80,\n      gap: 26,\n    );\n\n    return Scaffold(",
              1,
          )
          source = source.replace(
              "padding: const EdgeInsets.fromLTRB(28, 24, 28, 230),",
              "padding: EdgeInsets.fromLTRB(28, 24, 28, listBottom),",
              1,
          )
          source = source.replace("bottom: 112,", "bottom: floatingBottom,", 1)
          desktop.write_text(source, encoding='utf-8')

          nav = Path('lib/widgets/professional_bottom_navigation.dart')
          source = nav.read_text(encoding='utf-8')
          old = """    final screenWidth = MediaQuery.sizeOf(context).width;
    final bottomInset = MediaQuery.viewPaddingOf(context).bottom;
    final isDesktop = screenWidth >= AppUi.specialistDesktopBreakpoint;
    final panelHeight = isDesktop ? 78.0 : 76.0;
    final topSpacing = isDesktop ? 10.0 : 7.0;
    final bottomSpacing = isDesktop ? 16.0 : 11.0;
"""
          new = """    final bottomInset = MediaQuery.viewPaddingOf(context).bottom;
    final isDesktop = AppUi.usesDesktopNavigation(context);
    final panelHeight = AppUi.navigationPanelHeight(context);
    final topSpacing = AppUi.navigationTopSpacing(context);
    final bottomSpacing = AppUi.navigationBottomSpacing(context);
"""
          if old not in source:
              raise SystemExit('navigation metrics block not found')
          source = source.replace(old, new, 1)
          nav.write_text(source, encoding='utf-8')

          mobile_test = Path('test/mobile_floating_chrome_contract_test.dart')
          source = mobile_test.read_text(encoding='utf-8')
          source = source.replace(
              "test('mobile timesheet save button floats directly above navigation'",
              "test('mobile timesheet save button uses shared navigation clearance'",
              1,
          )
          source = source.replace(
              "    expect(view, contains('bottom: 14'));\n    expect(view, contains('EdgeInsets.fromLTRB(18, 18, 18, 118)'));",
              "    expect(view, contains('AppUi.floatingActionBottom(context)'));\n    expect(view, contains('AppUi.floatingActionListBottomPadding(context)'));\n    expect(view, isNot(contains('bottom: 14')));",
              1,
          )
          mobile_test.write_text(source, encoding='utf-8')

          audit = Path('test/floating_action_safe_area_audit_test.dart')
          audit.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('timesheet floating actions use one navigation-safe geometry', () {
    final mobile = File(
      'lib/screens/timesheet/timesheet_view.dart',
    ).readAsStringSync();
    final desktop = File(
      'lib/screens/desktop_timesheet_screen.dart',
    ).readAsStringSync();
    final navigation = File(
      'lib/widgets/professional_bottom_navigation.dart',
    ).readAsStringSync();
    final tokens = File('lib/app/app_ui_tokens.dart').readAsStringSync();

    expect(tokens, contains('navigationTotalHeight(BuildContext context)'));
    expect(tokens, contains('floatingActionBottom('));
    expect(tokens, contains('floatingActionListBottomPadding('));
    expect(mobile, contains('bottom: floatingBottom'));
    expect(mobile, contains('listBottom'));
    expect(desktop, contains('bottom: floatingBottom'));
    expect(desktop, contains('listBottom'));
    expect(navigation, contains('AppUi.navigationPanelHeight(context)'));
    expect(navigation, contains('AppUi.navigationTopSpacing(context)'));
    expect(navigation, contains('AppUi.navigationBottomSpacing(context)'));
  });

  test('fixed timesheet save actions have no hard-coded bottom offset', () {
    for (final path in <String>[
      'lib/screens/timesheet/timesheet_view.dart',
      'lib/screens/desktop_timesheet_screen.dart',
    ]) {
      final source = File(path).readAsStringSync();
      expect(source, isNot(matches(RegExp(r'bottom:\\s*(14|104|112)\\b'))));
    }
  });
}
""", encoding='utf-8')
          PY

      - name: Format changed Dart files
        run: dart format lib/app/app_ui_tokens.dart lib/screens/timesheet_screen.dart lib/screens/timesheet/timesheet_view.dart lib/screens/desktop_timesheet_screen.dart lib/widgets/professional_bottom_navigation.dart test/mobile_floating_chrome_contract_test.dart test/floating_action_safe_area_audit_test.dart

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-floating-action-safe-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/apply-floating-action-safe-navigation.yml
          git commit -m "Использовать безопасные отступы для нижних кнопок"
          git push origin HEAD:fix/floating-actions-safe-navigation
