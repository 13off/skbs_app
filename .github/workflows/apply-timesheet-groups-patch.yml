name: Apply timesheet groups patch

on:
  push:
    branches:
      - feature/timesheet-groups-pwa
    paths:
      - .github/workflows/apply-timesheet-groups-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/timesheet-groups-pwa
          fetch-depth: 0
      - name: Apply timesheet groups patch
        run: python3 tooling/timesheet_groups_patch.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tooling/timesheet_groups_patch.py .github/workflows/apply-timesheet-groups-patch.yml
          git add -A
          git commit -m 'Табель: группы сотрудников и фильтр'
          git push origin HEAD:feature/timesheet-groups-pwa
