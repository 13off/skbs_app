name: Temporary safe analyzer repair

on:
  push:
    branches:
      - agent/full-safe-hardening

permissions:
  contents: write

concurrency:
  group: appstroy-safe-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-safe-hardening
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Apply supported Dart fixes
        run: dart fix --apply

      - name: Format touched Dart files
        run: dart format lib test

      - name: Analyze repaired source
        shell: bash
        run: |
          mkdir -p repair_logs
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee repair_logs/flutter-analyze.log

      - name: Run all regression tests
        shell: bash
        run: flutter test --reporter compact 2>&1 | tee repair_logs/flutter-test.log

      - name: Build Web/PWA release
        shell: bash
        run: flutter build web --release --base-href /appstroy-web/ 2>&1 | tee repair_logs/flutter-web-build.log

      - name: Save validated automatic fixes
        shell: bash
        run: |
          rm -f .github/workflows/temporary-safe-repair.yml
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "dart_fix=completed"
            echo "format=completed"
            echo "analyze=completed"
            echo "tests=completed"
            echo "web_build=completed"
          } > repair_logs/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced"
            exit 0
          fi
          git commit -m "Применить безопасные автоматические исправления"
          git push origin HEAD:agent/full-safe-hardening
