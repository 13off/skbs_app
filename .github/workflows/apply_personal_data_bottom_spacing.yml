name: Apply personal data bottom spacing

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/personal-data-save-safe-bottom-20260804'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/personal-data-save-safe-bottom-20260804
          fetch-depth: 0

      - name: Apply safe bottom spacing and clean service files
        shell: bash
        run: |
          python3 tool/apply_personal_data_bottom_spacing.py
          rm tool/apply_personal_data_bottom_spacing.py
          rm .github/workflows/apply_personal_data_bottom_spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Поднять сохранение личных данных над навигацией"
          git push origin HEAD:fix/personal-data-save-safe-bottom-20260804
