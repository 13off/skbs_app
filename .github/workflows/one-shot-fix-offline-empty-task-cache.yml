name: One-shot fix offline empty task cache

on:
  push:
    branches:
      - fix/offline-empty-task-cache-20260903
    paths:
      - .github/workflows/one-shot-fix-offline-empty-task-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/offline-empty-task-cache-20260903
          fetch-depth: 0

      - name: Patch task cache semantics and add regression contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('lib/data/task_repository.dart')
          text = repo.read_text(encoding='utf-8')
          old = """    } catch (error) {
                if (!OfflineSyncService.isNetworkFailure(error)) rethrow;
                final tasks = await _readTaskSnapshot(cacheKey);
                if (tasks.isEmpty) rethrow;
                return _copyTasks(tasks);
              }
          """
          new = """    } catch (error) {
                if (!OfflineSyncService.isNetworkFailure(error)) rethrow;
                final cached = await OfflineSyncService.readSnapshot(
                  _tasksSnapshotKey(cacheKey),
                );
                if (cached is! List) rethrow;
                final tasks = cached
                    .whereType<Map>()
                    .map(
                      (row) => _taskFromSnapshot(Map<String, dynamic>.from(row)),
                    )
                    .toList(growable: false);
                return _copyTasks(tasks);
              }
          """
          if old not in text:
              raise SystemExit('Expected task cache fallback block was not found')
          repo.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('test/offline_empty_task_cache_contract_test.dart')
          test.write_text("""import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('пустой сохранённый список задач остаётся валидным offline-снимком', () {
              final source = File('lib/data/task_repository.dart').readAsStringSync();

              expect(
                source,
                contains('final cached = await OfflineSyncService.readSnapshot('),
              );
              expect(source, contains('if (cached is! List) rethrow;'));
              expect(source, isNot(contains('if (tasks.isEmpty) rethrow;')));
            });
          }
          """, encoding='utf-8')

          Path('.github/workflows/one-shot-fix-offline-empty-task-cache.yml').unlink()
          PY

      - name: Commit patch to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Offline: считать пустой список задач валидным кэшем"
          git push origin HEAD:fix/offline-empty-task-cache-20260903
