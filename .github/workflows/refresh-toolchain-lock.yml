name: Refresh Flutter dependency lock

on:
  push:
    branches:
      - main
    paths:
      - pubspec.yaml
      - .fvmrc
      - .github/workflows/refresh-toolchain-lock.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstroy-toolchain-lock
  cancel-in-progress: true

jobs:
  validate-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify tests with resolved dependencies
        run: flutter test

      - name: Verify lockfile is committed
        run: git diff --exit-code -- pubspec.lock
