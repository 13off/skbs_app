name: Apply legal employee dossier patch

on:
  push:
    branches:
      - feat/legal-employee-complete-dossier

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legal-employee-complete-dossier
          fetch-depth: 0
      - name: Apply dossier patch
        run: python3 .github/scripts/patch_legal_employee_dossier.py
      - name: Remove temporary helpers and commit
        run: |
          rm .github/scripts/patch_legal_employee_dossier.py
          rm .github/workflows/tmp-legal-employee-dossier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: подключить полное досье сотрудника юристу"
          git push origin HEAD:feat/legal-employee-complete-dossier
