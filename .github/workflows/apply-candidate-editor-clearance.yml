name: Apply candidate editor clearance

on:
  push:
    branches:
      - main
    paths:
      - release/candidate-editor-clearance.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Apply candidate editor clearance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/recruitment/presentation/recruitment_applications_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = """  @override
  Widget build(BuildContext context) {
    return Container(
      margin: const EdgeInsets.all(12),
      padding: EdgeInsets.fromLTRB(
        18,
        16,
        18,
        18 + MediaQuery.viewInsetsOf(context).bottom,
      ),
      constraints: BoxConstraints(
        maxHeight: MediaQuery.sizeOf(context).height * 0.92,
      ),
"""
          new = """  @override
  Widget build(BuildContext context) {
    final mediaSize = MediaQuery.sizeOf(context);
    final keyboardInset = MediaQuery.viewInsetsOf(context).bottom;
    final bottomClearance = keyboardInset > 0
        ? AppUi.gap12
        : AppUi.navigationTotalHeight(context) + AppUi.gap12;
    final availableHeight =
        mediaSize.height - bottomClearance - (AppUi.gap12 * 2);

    return Container(
      margin: EdgeInsets.fromLTRB(
        AppUi.gap12,
        AppUi.gap12,
        AppUi.gap12,
        bottomClearance,
      ),
      padding: EdgeInsets.fromLTRB(18, 16, 18, 18 + keyboardInset),
      constraints: BoxConstraints(maxHeight: availableHeight),
"""
          if old not in text:
              if 'AppUi.navigationTotalHeight(context) + AppUi.gap12' in text:
                  print('Candidate editor clearance is already applied')
                  raise SystemExit(0)
              raise SystemExit('Expected candidate editor layout block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format changed Dart file
        run: dart format lib/features/recruitment/presentation/recruitment_applications_screen.dart

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Analyze source
        run: flutter analyze

      - name: Verify layout contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AppUi.navigationTotalHeight(context) + AppUi.gap12" \
            lib/features/recruitment/presentation/recruitment_applications_screen.dart
          grep -q "constraints: BoxConstraints(maxHeight: availableHeight)" \
            lib/features/recruitment/presentation/recruitment_applications_screen.dart
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-candidate-editor-clearance.yml
          rm -f release/candidate-editor-clearance.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Поднять карточку нового кандидата над навигацией"
          git push
