name: Apply candidate editor clearance

on:
  push:
    branches:
      - main
    paths:
      - release/candidate-editor-clearance.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Apply candidate editor clearance
        run: python3 tool/apply_candidate_editor_clearance.py

      - name: Format changed Dart file
        run: dart format lib/features/recruitment/presentation/recruitment_applications_screen.dart

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze source
        run: flutter analyze

      - name: Verify layout contract
        shell: bash
        run: |
          grep -q "AppUi.navigationTotalHeight(context) + AppUi.gap12" \
            lib/features/recruitment/presentation/recruitment_applications_screen.dart
          grep -q "constraints: BoxConstraints(maxHeight: availableHeight)" \
            lib/features/recruitment/presentation/recruitment_applications_screen.dart
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-candidate-editor-clearance.yml
          rm -f release/candidate-editor-clearance.txt
          rm -f tool/apply_candidate_editor_clearance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Поднять карточку нового кандидата над навигацией"
          git push
