name: Generate payment history add button

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-payment-history-button.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create source branch
        shell: bash
        run: |
          git switch -c generated-payment-history-add-button
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/payment_history_screen.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/cupertino.dart' show CupertinoPageRoute;\nimport 'package:flutter/material.dart';\n",
              1,
          )
          text = text.replace(
              "import '../widgets/adaptive_detail_body.dart';\n",
              "import '../widgets/adaptive_detail_body.dart';\nimport 'add_payment_screen.dart';\n",
              1,
          )
          method_marker = "\n  Future<void> confirmDeletePayment(PaymentRecord payment) async {"
          method = r'''

  Future<void> openAddPayment() async {
    final employeeIds = historyEmployeeIds;
    final initialEmployeeId = employeeIds.isEmpty
        ? widget.employee.id?.trim()
        : employeeIds.first;
    final now = DateTime.now();

    final result = await Navigator.of(context).push<bool>(
      CupertinoPageRoute<bool>(
        builder: (_) => AddPaymentScreen(
          periodYear: now.year,
          periodMonth: now.month,
          periodTitle: '${monthName(now.month)} ${now.year}',
          initialEmployeeId: initialEmployeeId,
          initialObjectName: widget.employee.objectName,
        ),
      ),
    );

    if (!mounted || result != true) return;
    await loadHistory(forceRefresh: true);
  }
'''
          text = text.replace(method_marker, method + method_marker, 1)

          total_marker = "                'Всего по истории: ${formatMoney(totalAmount)}',"
          total_index = text.index(total_marker)
          insert_marker = "        ],\n      ),"
          insert_at = text.index(insert_marker, total_index)
          button = r'''          const SizedBox(height: 14),
          Align(
            alignment: Alignment.centerLeft,
            child: FilledButton.icon(
              onPressed: isLoading ? null : openAddPayment,
              icon: const Icon(Icons.add_card_rounded),
              label: const Text('Добавить выплату'),
            ),
          ),
'''
          text = text[:insert_at] + button + text[insert_at:]
          path.write_text(text, encoding='utf-8')

          Path('test/payment_history_add_payment_contract_test.dart').write_text(r'''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('история сотрудника открывает существующую форму новой выплаты', () {
    final screen = File('lib/screens/payment_history_screen.dart').readAsStringSync();
    expect(screen, contains("import 'add_payment_screen.dart';"));
    expect(screen, contains('Future<void> openAddPayment() async'));
    expect(screen, contains('CupertinoPageRoute<bool>('));
    expect(screen, contains('initialEmployeeId: initialEmployeeId'));
    expect(screen, contains('initialObjectName: widget.employee.objectName'));
    expect(screen, contains("label: const Text('Добавить выплату')"));
    expect(screen, contains('await loadHistory(forceRefresh: true)'));
  });
}
''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/payment_history_screen.dart test/payment_history_add_payment_contract_test.dart
          git commit -m "Добавить выплату из истории сотрудника"
          git push origin HEAD:generated-payment-history-add-button
