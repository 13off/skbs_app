name: Fix PWA panel insets

on:
  push:
    branches:
      - main
    paths:
      - release/pwa-panel-insets.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Apply panel inset fix
        run: python3 tool/apply_pwa_panel_insets.py

      - name: Format changed Dart files
        run: dart format lib test/pwa_panel_insets_contract_test.dart test/global_ui_scale_contract_test.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run regression tests
        run: flutter test --reporter compact

      - name: Analyze source
        run: flutter analyze

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-pwa-panel-insets.yml
          rm -f release/pwa-panel-insets.txt
          rm -f tool/apply_pwa_panel_insets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить PWA-отступы панелей без сжатия страницы"
          git push
