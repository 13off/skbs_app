name: Validate MAX bot service

on:
  push:
    branches:
      - feature/max-bot-vps-service
    paths:
      - services/max-recruiting-bot/**
      - .github/workflows/validate-max-bot-service.yml
  pull_request:
    paths:
      - services/max-recruiting-bot/**
      - .github/workflows/validate-max-bot-service.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/max-recruiting-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate Docker Compose
        run: docker compose -f compose.yml config
      - name: Build production image
        run: docker build --pull -t skbs-max-recruiting-bot:test .
