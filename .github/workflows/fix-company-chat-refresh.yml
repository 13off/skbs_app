name: Hotfix unified AI chat

on:
  push:
    branches:
      - main
    paths:
      - release/fix-company-chat-refresh.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Apply chat and AI routing hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Never drop a chat refresh while another refresh is running.
          path = Path('lib/features/company_chat/presentation/company_chat_shell.dart')
          text = path.read_text(encoding='utf-8')

          old = """  bool loading = true;\n  bool refreshing = false;\n  bool sending = false;\n"""
          new = """  bool loading = true;\n  bool refreshing = false;\n  bool refreshQueued = false;\n  bool sending = false;\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'bool refreshQueued = false;' not in text:
              raise SystemExit('chat field anchor not found')

          old = """      loading = true;\n      refreshing = false;\n      sending = false;\n"""
          new = """      loading = true;\n      refreshing = false;\n      refreshQueued = false;\n      sending = false;\n"""
          if old in text:
              text = text.replace(old, new, 1)

          old = """  Future<void> refreshWorkspace({bool markAsRead = false}) async {\n    if (refreshing || companyId.isEmpty) return;\n    refreshing = true;\n"""
          new = """  Future<void> refreshWorkspace({bool markAsRead = false}) async {\n    if (companyId.isEmpty) return;\n    if (refreshing) {\n      refreshQueued = true;\n      return;\n    }\n    refreshing = true;\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'refreshQueued = true;' not in text:
              raise SystemExit('chat refresh start anchor not found')

          old = """    } finally {\n      refreshing = false;\n    }\n  }\n\n  CompanyChatThread? _resolveSelected(\n"""
          new = """    } finally {\n      refreshing = false;\n      if (refreshQueued) {\n        refreshQueued = false;\n        unawaited(refreshWorkspace(markAsRead: panelOpen));\n      }\n    }\n  }\n\n  CompanyChatThread? _resolveSelected(\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'if (refreshQueued) {' not in text:
              raise SystemExit('chat refresh finally anchor not found')

          path.write_text(text, encoding='utf-8')

          # 2. Understand Russian month names such as "за июль".
          path = Path('supabase/functions/ai-global-command/shared.ts')
          text = path.read_text(encoding='utf-8')
          anchor = """  const result = new Date(base.getTime());\n"""
          month_block = """  const monthNames: Array<[RegExp, number]> = [\n    [/\\bянвар[а-я]*\\b/, 1],\n    [/\\bфеврал[а-я]*\\b/, 2],\n    [/\\bмарт[а-я]*\\b/, 3],\n    [/\\bапрел[а-я]*\\b/, 4],\n    [/\\bма[йя][а-я]*\\b/, 5],\n    [/\\bиюн[а-я]*\\b/, 6],\n    [/\\bиюл[а-я]*\\b/, 7],\n    [/\\bавгуст[а-я]*\\b/, 8],\n    [/\\bсентябр[а-я]*\\b/, 9],\n    [/\\bоктябр[а-я]*\\b/, 10],\n    [/\\bноябр[а-я]*\\b/, 11],\n    [/\\bдекабр[а-я]*\\b/, 12],\n  ];\n  for (const [pattern, month] of monthNames) {\n    if (!pattern.test(value)) continue;\n    const explicitYear = value.match(/\\b(20\\d{2})\\b/);\n    let year = explicitYear ? Number(explicitYear[1]) : base.getUTCFullYear();\n    if (!explicitYear && month > base.getUTCMonth() + 1) year -= 1;\n    return dateKey(year, month, 1);\n  }\n\n"""
          if month_block.strip() not in text:
              if anchor not in text:
                  raise SystemExit('requestedDate anchor not found')
              text = text.replace(anchor, month_block + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # 3. Prefer deterministic high-signal routes and disambiguate payroll balances.
          path = Path('supabase/functions/ai-global-command/semantic_router.ts')
          text = path.read_text(encoding='utf-8')

          old = """    \"глянь\",\n    \"посмотри\",\n  ]);\n"""
          new = """    \"глянь\",\n    \"посмотри\",\n    \"дай\",\n    \"скин\",\n    \"выдай\",\n    \"таблиц\",\n  ]);\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif '"таблиц"' not in text:
              raise SystemExit('semantic question anchor not found')

          text = text.replace(
              'const unpaid = hasAny(value, ["долг", "задолж", "недоплат", "невыплат", "остаток"]);',
              'const unpaid = hasAny(value, ["долг", "задолж", "недоплат", "невыплат", "остатк", "расчетн"]);',
              1,
          )

          old = """  const local = localRoute(prompt, context);\n  const llm = await llmRoute({ prompt, role, context });\n  return llm ?? local;\n"""
          new = """  const local = localRoute(prompt, context);\n  // Deterministic AppСтрой rules win whenever they already recognized the\n  // request. OpenAI is a semantic fallback for genuinely unfamiliar wording,\n  // not an override that can turn payroll balances into procurement.\n  if (local.intent !== \"fallback\") return local;\n  const llm = await llmRoute({ prompt, role, context });\n  return llm ?? local;\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'not an override that can turn payroll balances into procurement' not in text:
              raise SystemExit('semantic precedence anchor not found')

          old = '    "subtype только если очевидно: operational_insight=absence|unpaid|expiring_documents|weekly_report; legal_decision=approve|reject; procurement_status=approved|ordered|in_delivery|delivered|canceled; navigation=timesheet|employees|tasks|payments|recruitment|procurement|legal|objects|chat|settings.",\n'
          new = old + '    "Фразы про остаток/остатки выплат, расчётный остаток, задолженность сотрудникам или таблицу остатков за месяц = operational_insight с subtype unpaid. Это НЕ снабжение, если явно не сказано про материалы, склад, закупку, поставку или заявку снабжения.",\n'
          if 'таблицу остатков за месяц = operational_insight' not in text:
              if old not in text:
                  raise SystemExit('semantic system prompt anchor not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          # Lightweight contract checks.
          assert 'bool refreshQueued = false' in Path('lib/features/company_chat/presentation/company_chat_shell.dart').read_text(encoding='utf-8')
          assert '[/\\bиюл[а-я]*\\b/, 7]' in Path('supabase/functions/ai-global-command/shared.ts').read_text(encoding='utf-8')
          router = Path('supabase/functions/ai-global-command/semantic_router.ts').read_text(encoding='utf-8')
          assert 'if (local.intent !== "fallback") return local;' in router
          assert '"таблиц"' in router
          assert '"остатк"' in router
          PY

      - name: Format Flutter source
        run: dart format lib/features/company_chat/presentation/company_chat_shell.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run focused chat tests
        run: flutter test test/company_chat_compact_window_contract_test.dart test/company_chat_ai_contract_test.dart --reporter compact

      - name: Analyze chat source
        run: flutter analyze lib/features/company_chat/presentation/company_chat_shell.dart

      - name: Commit verified hotfix
        shell: bash
        run: |
          rm -f .github/workflows/fix-company-chat-refresh.yml release/fix-company-chat-refresh.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Починить обновление чата и остатки выплат в ИИ"
          git push
