name: Apply candidate editor layout lift

on:
  push:
    branches:
      - main
    paths:
      - release/candidate-editor-layout-lift.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Apply layout lift
        run: python3 tool/apply_candidate_editor_layout_lift.py

      - name: Format
        run: dart format lib/features/recruitment/presentation/recruitment_applications_screen.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Verify hit-test-safe layout
        shell: bash
        run: |
          grep -q "return Padding(" lib/features/recruitment/presentation/recruitment_applications_screen.dart
          grep -q "padding: EdgeInsets.only(bottom: lift)" lib/features/recruitment/presentation/recruitment_applications_screen.dart
          if grep -q "return Transform.translate" lib/features/recruitment/presentation/recruitment_applications_screen.dart; then
            echo "::error::Visual transform is still present"
            exit 1
          fi
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-candidate-editor-layout-lift.yml
          rm -f release/candidate-editor-layout-lift.txt
          rm -f tool/apply_candidate_editor_layout_lift.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить клики по полям карточки кандидата"
          git push
