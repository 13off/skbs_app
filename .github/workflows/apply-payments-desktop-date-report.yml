name: Apply payments desktop and date report

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/payments-desktop-date-report'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payments-desktop-date-report

      - name: Apply source patch
        run: python3 tool/apply_payments_desktop_date_report.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Format and verify feature
        run: |
          dart format \
            lib/features/payments/presentation/screens/payments_screen.dart \
            lib/features/payments/presentation/widgets/payment_report_sheet.dart \
            lib/features/payments/data/payment_report_exporter.dart \
            test/payments_desktop_date_report_contract_test.dart
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test test/payments_desktop_date_report_contract_test.dart

      - name: Commit verified source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tool/apply_payments_desktop_date_report.py
          git rm .github/workflows/apply-payments-desktop-date-report.yml
          git add \
            lib/features/payments/presentation/screens/payments_screen.dart \
            lib/features/payments/presentation/widgets/payment_report_sheet.dart \
            lib/features/payments/data/payment_report_exporter.dart \
            test/payments_desktop_date_report_contract_test.dart
          git commit -m "Адаптировать выплаты для ПК и добавить отчёт по датам"
          git push
