name: Apply global PWA layout

on:
  push:
    paths:
      - '.github/workflows/apply-global-pwa-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Apply one PWA frame to every application route
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          frame = """import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';

          import '../app/app_ui_tokens.dart';

          /// Applies the shared wide-PWA page margin above the nested navigators.
          ///
          /// Keeping the frame above Navigator means root tabs and every pushed
          /// application route receive the same geometry, including screens that
          /// use their own Scaffold instead of AppPage.
          class PwaDesktopPageFrame extends StatelessWidget {
            final Widget child;

            const PwaDesktopPageFrame({super.key, required this.child});

            static bool isApplied(BuildContext context) {
              return context
                      .dependOnInheritedWidgetOfExactType<_PwaDesktopPageFrameScope>() !=
                  null;
            }

            @override
            Widget build(BuildContext context) {
              final width = MediaQuery.sizeOf(context).width;
              final enabled = kIsWeb && width >= AppUi.desktopBreakpoint;
              if (!enabled) return child;

              return ColoredBox(
                color: Theme.of(context).scaffoldBackgroundColor,
                child: Padding(
                  padding: const EdgeInsets.symmetric(
                    horizontal: AppUi.pageDesktopHorizontalPadding,
                  ),
                  child: _PwaDesktopPageFrameScope(child: child),
                ),
              );
            }
          }

          class _PwaDesktopPageFrameScope extends InheritedWidget {
            const _PwaDesktopPageFrameScope({required super.child});

            @override
            bool updateShouldNotify(_PwaDesktopPageFrameScope oldWidget) => false;
          }
          """
          frame = '\n'.join(line[10:] if line.startswith('          ') else line for line in frame.splitlines()) + '\n'
          write('lib/widgets/pwa_desktop_page_frame.dart', frame)

          tokens_path = 'lib/app/app_ui_tokens.dart'
          tokens = read(tokens_path)
          tokens = replace_once(
              tokens,
              '  static const double desktopNavigationPanelHeight = 78;\n',
              '  static const double desktopNavigationPanelHeight = 78;\n'
              '  // Approximately 10–11 cm at standard browser pixel density.\n'
              '  static const double desktopNavigationMaxWidth = 420;\n',
              'navigation max width token',
          )
          write(tokens_path, tokens)

          page_path = 'lib/widgets/app_page.dart'
          page = read(page_path)
          page = replace_once(
              page,
              "import 'liquid_glass.dart';\n",
              "import 'liquid_glass.dart';\nimport 'pwa_desktop_page_frame.dart';\n",
              'AppPage frame import',
          )
          old_padding = """    final horizontalPadding = isDesktop
                  ? AppUi.pageDesktopHorizontalPadding
                  : AppUi.pageMobileHorizontalPadding;"""
          new_padding = """    final horizontalPadding = isDesktop
                  ? PwaDesktopPageFrame.isApplied(context)
                        ? 0.0
                        : AppUi.pageDesktopHorizontalPadding
                  : AppUi.pageMobileHorizontalPadding;"""
          if page.count(old_padding) != 2:
              raise SystemExit(f'AppPage padding: expected 2 matches, found {page.count(old_padding)}')
          page = page.replace(old_padding, new_padding)
          write(page_path, page)

          persistent_path = 'lib/features/shell/presentation/persistent_tab_shell.dart'
          persistent = read(persistent_path)
          persistent = replace_once(
              persistent,
              "import '../../../widgets/premium_ui.dart';\n",
              "import '../../../widgets/premium_ui.dart';\n"
              "import '../../../widgets/pwa_desktop_page_frame.dart';\n",
              'persistent shell frame import',
          )
          start = persistent.index('  Widget _buildTabNavigator(int index) {')
          end = persistent.index('\n  void _handleControllerChanged()', start)
          block = persistent[start:end]
          block = replace_once(
              block,
              '      child: Navigator(\n',
              '      child: PwaDesktopPageFrame(\n        child: Navigator(\n',
              'persistent navigator wrapper',
          )
          close = '\n    );'
          pos = block.rfind(close)
          if pos < 0:
              raise SystemExit('persistent wrapper closing point not found')
          block = block[:pos] + '\n      ),' + block[pos:]
          persistent = persistent[:start] + block + persistent[end:]
          write(persistent_path, persistent)

          premium_path = 'lib/features/shell/presentation/premium_main_screen.dart'
          premium = read(premium_path)
          premium = replace_once(
              premium,
              "import '../../../widgets/premium_ui.dart';\n",
              "import '../../../widgets/premium_ui.dart';\n"
              "import '../../../widgets/pwa_desktop_page_frame.dart';\n",
              'premium shell frame import',
          )
          start = premium.index('  Widget buildTabNavigator(int index) {')
          end = premium.index('\n  List<_TabItem> buildTabItems()', start)
          block = premium[start:end]
          block = replace_once(
              block,
              '      child: Navigator(\n',
              '      child: PwaDesktopPageFrame(\n        child: Navigator(\n',
              'premium navigator wrapper',
          )
          close = '\n    );'
          pos = block.rfind(close)
          if pos < 0:
              raise SystemExit('premium wrapper closing point not found')
          block = block[:pos] + '\n      ),' + block[pos:]
          premium = premium[:start] + block + premium[end:]
          write(premium_path, premium)

          nav_path = 'lib/widgets/professional_bottom_navigation.dart'
          nav = read(nav_path)
          nav = replace_once(
              nav,
              'constraints: const BoxConstraints(maxWidth: double.infinity),',
              'constraints: BoxConstraints(\n'
              '                maxWidth: isDesktop\n'
              '                    ? AppUi.desktopNavigationMaxWidth\n'
              '                    : double.infinity,\n'
              '              ),',
              'desktop navigation width',
          )
          nav = replace_once(
              nav,
              'horizontal: isDesktop ? 14 : 4,',
              'horizontal: 4,',
              'desktop navigation item padding',
          )
          nav = replace_once(nav, 'size: 23,\n', 'size: 21,\n', 'desktop navigation icon')
          nav = replace_once(
              nav,
              'const SizedBox(width: 10),',
              'const SizedBox(width: 4),',
              'desktop navigation icon gap',
          )
          nav = replace_once(
              nav,
              'fontSize: 13,',
              'fontSize: 10.5,',
              'desktop navigation label size',
          )
          write(nav_path, nav)

          test = """import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          String source(String path) => File(path).readAsStringSync();

          void main() {
            test('every main application route inherits one shared PWA frame', () {
              final frame = source('lib/widgets/pwa_desktop_page_frame.dart');
              final persistent = source(
                'lib/features/shell/presentation/persistent_tab_shell.dart',
              );
              final premium = source(
                'lib/features/shell/presentation/premium_main_screen.dart',
              );
              final page = source('lib/widgets/app_page.dart');

              expect(frame, contains('horizontal: AppUi.pageDesktopHorizontalPadding'));
              expect(frame, contains('kIsWeb && width >= AppUi.desktopBreakpoint'));
              expect(persistent, contains('child: PwaDesktopPageFrame('));
              expect(premium, contains('child: PwaDesktopPageFrame('));
              expect(page, contains('PwaDesktopPageFrame.isApplied(context)'));
              expect(page, contains('? 0.0'));
            });

            test('desktop bottom navigation stays centered near ten centimetres', () {
              final tokens = source('lib/app/app_ui_tokens.dart');
              final navigation = source(
                'lib/widgets/professional_bottom_navigation.dart',
              );

              expect(tokens, contains('desktopNavigationMaxWidth = 420'));
              expect(navigation, contains('AppUi.desktopNavigationMaxWidth'));
              expect(navigation, contains('child: Center('));
            });
          }
          """
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          write('test/pwa_global_page_frame_contract_test.dart', test)

          for path in (
              '.github/workflows/audit-pwa-layout.yml',
              'docs/pwa-layout-audit.txt',
              '.github/workflows/apply-global-pwa-layout.yml',
          ):
              Path(path).unlink(missing_ok=True)
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/app/app_ui_tokens.dart \
            lib/widgets/app_page.dart \
            lib/widgets/pwa_desktop_page_frame.dart \
            lib/widgets/professional_bottom_navigation.dart \
            lib/features/shell/presentation/persistent_tab_shell.dart \
            lib/features/shell/presentation/premium_main_screen.dart \
            test/pwa_global_page_frame_contract_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run all Flutter tests
        run: flutter test

      - name: Build release Web/PWA
        run: flutter build web --release

      - name: Commit verified global PWA layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Применить единые края ко всем PWA-страницам"
          git push

