name: Apply global PWA layout

on:
  push:
    paths:
      - '.github/workflows/apply-global-pwa-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Apply one frame above the whole PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          frame = textwrap.dedent("""
              import 'package:flutter/foundation.dart';
              import 'package:flutter/material.dart';

              import '../app/app_ui_tokens.dart';

              /// Gives every wide PWA route the same physical outer margin.
              ///
              /// The frame is placed above AppScaleViewport and Navigator, so it
              /// covers root tabs, pushed routes, settings, documents, auth and
              /// future pages without requiring each screen to use AppPage.
              class PwaDesktopPageFrame extends StatelessWidget {
                final Widget child;

                const PwaDesktopPageFrame({super.key, required this.child});

                static bool isApplied(BuildContext context) {
                  return context
                          .dependOnInheritedWidgetOfExactType<_PwaDesktopPageFrameScope>() !=
                      null;
                }

                @override
                Widget build(BuildContext context) {
                  final media = MediaQuery.of(context);
                  final enabled =
                      kIsWeb && media.size.width >= AppUi.desktopBreakpoint;
                  if (!enabled) return child;

                  const horizontal = AppUi.pageDesktopHorizontalPadding;
                  final contentWidth =
                      (media.size.width - horizontal * 2).clamp(0.0, double.infinity);

                  return ColoredBox(
                    color: Theme.of(context).scaffoldBackgroundColor,
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: horizontal),
                      child: MediaQuery(
                        data: media.copyWith(
                          size: Size(contentWidth.toDouble(), media.size.height),
                        ),
                        child: _PwaDesktopPageFrameScope(child: child),
                      ),
                    ),
                  );
                }
              }

              class _PwaDesktopPageFrameScope extends InheritedWidget {
                const _PwaDesktopPageFrameScope({required super.child});

                @override
                bool updateShouldNotify(_PwaDesktopPageFrameScope oldWidget) => false;
              }
          """).lstrip()
          write('lib/widgets/pwa_desktop_page_frame.dart', frame)

          tokens_path = 'lib/app/app_ui_tokens.dart'
          tokens = read(tokens_path)
          if 'desktopNavigationMaxWidth' not in tokens:
              tokens = replace_once(
                  tokens,
                  '  static const double desktopNavigationPanelHeight = 78;\n',
                  '  static const double desktopNavigationPanelHeight = 78;\n'
                  '  // 470 logical px renders near 10 cm after the default 0.80 scale.\n'
                  '  static const double desktopNavigationMaxWidth = 470;\n',
                  'navigation width token',
              )
          write(tokens_path, tokens)

          main_path = 'lib/main.dart'
          main = read(main_path)
          if "widgets/pwa_desktop_page_frame.dart" not in main:
              main = replace_once(
                  main,
                  "import 'services/push_notification_service.dart';\n",
                  "import 'services/push_notification_service.dart';\n"
                  "import 'widgets/pwa_desktop_page_frame.dart';\n",
                  'main frame import',
              )
          old_builder = """          builder: (context, child) => AppScaleViewport(
                    scale: themeController.uiScale,
                    child: child ?? const SizedBox.shrink(),
                  ),"""
          new_builder = """          builder: (context, child) => PwaDesktopPageFrame(
                    child: AppScaleViewport(
                      scale: themeController.uiScale,
                      child: child ?? const SizedBox.shrink(),
                    ),
                  ),"""
          main = replace_once(main, old_builder, new_builder, 'MaterialApp global frame')
          write(main_path, main)

          page_path = 'lib/widgets/app_page.dart'
          page = read(page_path)
          if "pwa_desktop_page_frame.dart" not in page:
              page = replace_once(
                  page,
                  "import 'liquid_glass.dart';\n",
                  "import 'liquid_glass.dart';\nimport 'pwa_desktop_page_frame.dart';\n",
                  'AppPage frame import',
              )
          pattern = re.compile(
              r"final horizontalPadding = isDesktop\s*\n\s*\? AppUi\.pageDesktopHorizontalPadding\s*\n\s*: AppUi\.pageMobileHorizontalPadding;"
          )
          replacement = """final horizontalPadding = isDesktop
                  ? PwaDesktopPageFrame.isApplied(context)
                        ? 0.0
                        : AppUi.pageDesktopHorizontalPadding
                  : AppUi.pageMobileHorizontalPadding;"""
          page, count = pattern.subn(replacement, page)
          if count != 2:
              raise SystemExit(f'AppPage desktop padding: expected 2 matches, found {count}')
          write(page_path, page)

          nav_path = 'lib/widgets/professional_bottom_navigation.dart'
          nav = read(nav_path)
          nav = replace_once(
              nav,
              'constraints: const BoxConstraints(maxWidth: double.infinity),',
              'constraints: BoxConstraints(\n'
              '                maxWidth: isDesktop\n'
              '                    ? AppUi.desktopNavigationMaxWidth\n'
              '                    : double.infinity,\n'
              '              ),',
              'bottom navigation max width',
          )
          nav = replace_once(
              nav,
              'horizontal: isDesktop ? 14 : 4,',
              'horizontal: 4,',
              'desktop item padding',
          )
          nav = replace_once(
              nav,
              'const SizedBox(width: 10),',
              'const SizedBox(width: 4),',
              'desktop item gap',
          )
          nav = replace_once(
              nav,
              'fontSize: 13,',
              'fontSize: 10.5,',
              'desktop label size',
          )
          write(nav_path, nav)

          # Update source contracts that intentionally pinned the previous shell.
          for path in Path('test').rglob('*.dart'):
              value = path.read_text(encoding='utf-8')
              value = value.replace(
                  "contains('builder: (context, child) => AppScaleViewport(')",
                  "contains('builder: (context, child) => PwaDesktopPageFrame(')",
              )
              if (
                  "professional_bottom_navigation.dart" in value
                  and "BoxConstraints(maxWidth: double.infinity)" in value
              ):
                  value = value.replace(
                      'BoxConstraints(maxWidth: double.infinity)',
                      'AppUi.desktopNavigationMaxWidth',
                  )
              path.write_text(value, encoding='utf-8')

          contract = textwrap.dedent("""
              import 'dart:io';

              import 'package:flutter_test/flutter_test.dart';

              String source(String path) => File(path).readAsStringSync();

              void main() {
                test('one PWA frame covers every application page', () {
                  final main = source('lib/main.dart');
                  final frame = source('lib/widgets/pwa_desktop_page_frame.dart');
                  final page = source('lib/widgets/app_page.dart');

                  expect(main, contains('builder: (context, child) => PwaDesktopPageFrame('));
                  expect(main, contains('child: AppScaleViewport('));
                  expect(frame, contains('horizontal = AppUi.pageDesktopHorizontalPadding'));
                  expect(frame, contains('media.copyWith('));
                  expect(page, contains('PwaDesktopPageFrame.isApplied(context)'));
                  expect(page, contains('? 0.0'));
                });

                test('desktop bottom navigation is centered near ten centimetres', () {
                  final tokens = source('lib/app/app_ui_tokens.dart');
                  final navigation = source(
                    'lib/widgets/professional_bottom_navigation.dart',
                  );

                  expect(tokens, contains('desktopNavigationMaxWidth = 470'));
                  expect(navigation, contains('AppUi.desktopNavigationMaxWidth'));
                  expect(navigation, contains('child: Center('));
                });
              }
          """).lstrip()
          write('test/pwa_global_page_frame_contract_test.dart', contract)
          PY

      - name: Format changed Dart files
        run: dart format lib test

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analyzer, tests and Web release
        id: verify
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos --fatal-warnings > /tmp/pwa-analyze.log 2>&1
          analyze_status=$?
          flutter test > /tmp/pwa-test.log 2>&1
          test_status=$?
          flutter build web --release > /tmp/pwa-build.log 2>&1
          build_status=$?
          set -e

          echo "analyze_status=$analyze_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"

          if [ "$analyze_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi

      - name: Save failure diagnostics
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          git reset --hard HEAD
          mkdir -p docs
          {
            echo "PWA layout verification failure"
            echo "analyze=${{ steps.verify.outputs.analyze_status }}"
            echo "tests=${{ steps.verify.outputs.test_status }}"
            echo "build=${{ steps.verify.outputs.build_status }}"
            echo
            echo "===== ANALYZE ====="
            cat /tmp/pwa-analyze.log || true
            echo
            echo "===== TESTS ====="
            cat /tmp/pwa-test.log || true
            echo
            echo "===== BUILD ====="
            cat /tmp/pwa-build.log || true
          } > docs/pwa-layout-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/pwa-layout-failure.log
          git commit -m "Сохранить ошибку глобальной PWA-разметки"
          git push

      - name: Commit verified global PWA layout
        if: success()
        run: |
          rm -f .github/workflows/audit-pwa-layout.yml
          rm -f .github/workflows/apply-global-pwa-layout.yml
          rm -f docs/pwa-layout-audit.txt
          rm -f docs/pwa-layout-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Применить единые края ко всем PWA-страницам"
          git push
