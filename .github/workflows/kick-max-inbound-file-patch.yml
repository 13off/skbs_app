name: Kick MAX inbound file patch

on:
  push:
    branches:
      - feature/max-inbound-files
    paths:
      - .github/max-inbound-file-patch-trigger.txt

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/max-inbound-files
          fetch-depth: 0
      - name: Trigger patch workflow
        run: |
          echo "# Triggered at $(date -u +%FT%TZ)" >> .github/workflows/apply-max-inbound-file-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-max-inbound-file-patch.yml
          git commit -m "Запустить патч приёма файлов MAX"
          git push origin HEAD:feature/max-inbound-files
