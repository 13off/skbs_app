name: Apply wide candidate editor lift

on:
  push:
    branches:
      - main
    paths:
      - release/lift-candidate-editor-wide.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Apply lift
        run: python3 tool/lift_candidate_editor_wide.py

      - name: Format
        run: dart format lib/features/recruitment/presentation/recruitment_applications_screen.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Verify
        run: |
          grep -q "isWideScreen ? 120 : AppUi.gap12" lib/features/recruitment/presentation/recruitment_applications_screen.dart
          git diff --check

      - name: Commit verified fix
        run: |
          rm -f .github/workflows/apply-lift-candidate-editor-wide.yml
          rm -f release/lift-candidate-editor-wide.txt
          rm -f tool/lift_candidate_editor_wide.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Поднять карточку нового кандидата выше"
          git push
