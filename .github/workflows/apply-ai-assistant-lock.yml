name: Apply AI assistant lock

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ai-assistant-lock.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply lock patch
        run: python3 tool/apply_ai_assistant_lock.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Format changed files
        run: dart format lib/features/company_chat/presentation/company_chat_shell.dart test/company_chat_compact_window_contract_test.dart

      - name: Analyze source strictly
        run: flutter analyze

      - name: Run chat lock contract
        run: flutter test test/company_chat_compact_window_contract_test.dart --reporter compact

      - name: Commit verified lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/company_chat/presentation/company_chat_shell.dart test/company_chat_compact_window_contract_test.dart
          git commit -m "ИИ помощник временно закрыт замком"
          git push origin HEAD:main
