name: Apply document tools hotfix

on:
  push:
    branches: [hotfix/document-workflow-mobile-blank]
    paths:
      - '.github/workflows/apply-document-tools-hotfix.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/document-workflow-mobile-blank
          fetch-depth: 0
      - name: Patch navigation and mobile layouts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          settings = Path('lib/screens/settings_screen.dart')
          text = settings.read_text()
          text = text.replace(
              "import '../features/documents/presentation/document_workflow_settings_entry.dart';\n",
              "import '../features/tools/presentation/company_tools_screen.dart';\n",
          )
          pattern = re.compile(
              r"\n\s*const SizedBox\(height: 8\),"
              r"\n\s*DocumentWorkflowSettingsEntry\(profile: profile\),"
              r"\n\s*sectionTitle\('Настройки профессии'\),"
          )
          replacement = """
          const SizedBox(height: 8),
          sectionTitle('Инструменты'),
          actionTile(
            icon: Icons.extension_rounded,
            title: 'Инструменты',
            onTap: () => open(CompanyToolsScreen(profile: profile)),
          ),
          const SizedBox(height: 8),
          sectionTitle('Настройки профессии'),"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('settings insertion point not found')
          settings.write_text(text)

          def unwrap(path: str, refresh: str, subtitle: str):
              file = Path(path)
              source = file.read_text()
              subtitle_pattern = re.compile(
                  rf"^(?P<indent>\s*)subtitle: '{re.escape(subtitle)}',\n",
                  re.MULTILINE,
              )
              match = subtitle_pattern.search(source)
              if match is None:
                  raise SystemExit(f'subtitle not found: {path}')
              refresh_line = f"{match.group('indent')}onRefresh: {refresh},\n"
              if refresh_line not in source:
                  source = source[:match.end()] + refresh_line + source[match.end():]

              prefix_pattern = re.compile(
                  rf"^(?P<indent>\s*)return RefreshIndicator\(\n"
                  rf"\s*onRefresh: {re.escape(refresh)},\n"
                  r"\s*child: ListView\(\n"
                  r"\s*physics: const AlwaysScrollableScrollPhysics\(\),\n"
                  r"\s*padding: const EdgeInsets\.fromLTRB\(16, 8, 16, 32\),\n"
                  r"\s*children: \[\n",
                  re.MULTILINE,
              )
              prefix_match = prefix_pattern.search(source)
              if prefix_match is None:
                  raise SystemExit(f'nested list prefix not found: {path}')
              indent = prefix_match.group('indent')
              tail = f"\n{indent}    ],\n{indent}  ),\n{indent});"
              tail_index = source.find(tail, prefix_match.end())
              if tail_index < 0:
                  raise SystemExit(f'nested list tail not found: {path}')
              body = source[prefix_match.end():tail_index]
              replacement = (
                  f"{indent}return Column(\n"
                  f"{indent}  crossAxisAlignment: CrossAxisAlignment.stretch,\n"
                  f"{indent}  children: [\n"
                  f"{body}\n"
                  f"{indent}  ],\n"
                  f"{indent});"
              )
              file.write_text(
                  source[:prefix_match.start()]
                  + replacement
                  + source[tail_index + len(tail):]
              )

          unwrap(
              'lib/features/documents/presentation/document_workflow_screen.dart',
              'refresh',
              'Оформление сотрудника от исходников до архива',
          )
          unwrap(
              'lib/features/documents/presentation/document_generation_screen.dart',
              '_refresh',
              'Утверждённые DOCX-версии без изменения оригинала',
          )
          unwrap(
              'lib/features/documents/presentation/document_onboarding_screen.dart',
              'refresh',
              '13 обязательных этапов',
          )
          unwrap(
              'lib/features/documents/presentation/document_package_management_screen.dart',
              'refresh',
              'Готовые наборы для HR',
          )

          legacy = Path(
              'lib/features/documents/presentation/document_workflow_settings_entry.dart'
          )
          if legacy.exists():
              legacy.unlink()

          Path('.github/workflows/apply-document-tools-hotfix.yml').unlink()
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: dart format lib/screens/settings_screen.dart lib/features/tools/presentation/company_tools_screen.dart lib/features/documents/presentation/document_workflow_screen.dart lib/features/documents/presentation/document_generation_screen.dart lib/features/documents/presentation/document_onboarding_screen.dart lib/features/documents/presentation/document_package_management_screen.dart
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair document tools navigation and mobile layout'
          git push origin HEAD:hotfix/document-workflow-mobile-blank
