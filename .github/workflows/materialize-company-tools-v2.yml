name: Materialize company tools v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/materialize-company-tools-v2.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Build connected and catalog architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(value, message):
              if not value:
                  raise SystemExit(message)

          settings_path = Path('lib/screens/settings_screen.dart')
          settings = settings_path.read_text(encoding='utf-8')
          settings = settings.replace(
              "import '../features/tools/presentation/company_tools_screen.dart';",
              "import '../features/tools/presentation/company_tools_entry.dart';",
              1,
          )
          settings, removed = re.subn(
              r"\s*const SizedBox\(height: 8\),\s*"
              r"sectionTitle\('Инструменты'\),\s*"
              r"actionTile\([\s\S]*?CompanyToolsScreen\(profile: profile\)[\s\S]*?\),\s*"
              r"const SizedBox\(height: 8\),\s*"
              r"sectionTitle\('Настройки профессии'\),",
              "\n          sectionTitle('Настройки профессии'),",
              settings,
              count=1,
          )
          require(removed == 1, 'Old settings tools block was not found')
          marker = "          ...roleItems,\n"
          require(marker in settings, 'roleItems marker missing')
          settings = settings.replace(
              marker,
              marker
              + "          const SizedBox(height: 8),\n"
              + "          CompanyToolsSettingsEntry(profile: profile),\n",
              1,
          )
          settings_path.write_text(settings, encoding='utf-8')

          profile_path = Path('lib/screens/profile_screen.dart')
          profile = profile_path.read_text(encoding='utf-8')
          import_marker = "import '../features/role_preview/role_preview_controller.dart';"
          require(import_marker in profile, 'profile import marker missing')
          profile = profile.replace(
              import_marker,
              import_marker
              + "\nimport '../features/tools/presentation/company_tools_entry.dart';",
              1,
          )
          signout_marker = (
              "          const SizedBox(height: 8),\n"
              "          signOutButton(),"
          )
          require(signout_marker in profile, 'profile signout marker missing')
          profile = profile.replace(
              signout_marker,
              "          ConnectedCompanyToolsSection(profile: profile),\n"
              "          const SizedBox(height: 8),\n"
              "          signOutButton(),",
              1,
          )
          profile_path.write_text(profile, encoding='utf-8')

          tools_path = Path('lib/features/tools/presentation/company_tools_screen.dart')
          tools = tools_path.read_text(encoding='utf-8')
          workflow_import = (
              "import '../../documents/presentation/document_workflow_screen.dart';"
          )
          require(workflow_import in tools, 'tool controller import marker missing')
          tools = tools.replace(
              workflow_import,
              workflow_import + "\nimport '../data/company_tools_controller.dart';",
              1,
          )
          state_marker = "  late Future<_ToolsData> future;\n  bool changing = false;"
          require(state_marker in tools, 'tool state marker missing')
          tools = tools.replace(
              state_marker,
              "  late Future<_ToolsData> future;\n"
              "  _CompanyToolsTab selectedTab = _CompanyToolsTab.connected;\n"
              "  bool changing = false;",
              1,
          )

          load_start = tools.find('  Future<_ToolsData> _load() async {')
          load_end = tools.find('  Future<void> _refresh() async {', load_start)
          require(load_start >= 0 and load_end > load_start, 'load method bounds missing')
          new_load = """  Future<_ToolsData> _load() async {
            if (companyId.isEmpty) {
              throw StateError('Сначала выберите активную компанию');
            }
            final values = await Future.wait<dynamic>(<Future<dynamic>>[
              DocumentWorkflowRepository.fetchAccess(),
              DocumentWorkflowRepository.fetchInstallation(companyId),
            ]);
            final access = values[0] as DocumentWorkflowAccess;
            final installation = values[1] as DocumentToolInstallation;
            if (!installation.isEnabled && access.canManage) {
              selectedTab = _CompanyToolsTab.catalog;
            }
            return _ToolsData(access: access, installation: installation);
          }

          """
          tools = tools[:load_start] + new_load + tools[load_end:]

          refresh_marker = "      await _refresh();\n      _message("
          require(refresh_marker in tools, 'installation refresh marker missing')
          tools = tools.replace(
              refresh_marker,
              "      CompanyToolsController.notifyChanged();\n"
              "      selectedTab = enabled\n"
              "          ? _CompanyToolsTab.connected\n"
              "          : _CompanyToolsTab.catalog;\n"
              "      await _refresh();\n"
              "      _message(",
              1,
          )
          tools = tools.replace("title: 'Инструменты',", "title: 'Инструменты AppСтрой',", 1)
          tools = tools.replace("'AppСтрой Документы'", "'AppСтрой Трудоустройство'")
          tools = tools.replace(
              "'Трудоустройство и кадровый документооборот'",
              "'Оформление и кадровый документооборот'",
          )

          card_start = tools.find('              _DocumentToolCard(')
          card_end_marker = "              const SizedBox(height: 14),"
          card_end = tools.find(card_end_marker, card_start)
          require(card_start >= 0 and card_end > card_start, 'main tool card bounds missing')
          replacement = """              if (data.access.canManage)
                SegmentedButton<_CompanyToolsTab>(
                  segments: const [
                    ButtonSegment<_CompanyToolsTab>(
                      value: _CompanyToolsTab.connected,
                      icon: Icon(Icons.widgets_outlined),
                      label: Text('Подключённые'),
                    ),
                    ButtonSegment<_CompanyToolsTab>(
                      value: _CompanyToolsTab.catalog,
                      icon: Icon(Icons.storefront_outlined),
                      label: Text('Каталог'),
                    ),
                  ],
                  selected: <_CompanyToolsTab>{selectedTab},
                  onSelectionChanged: (selection) {
                    setState(() => selectedTab = selection.first);
                  },
                ),
              if (data.access.canManage) const SizedBox(height: 16),
              if (!data.access.canManage ||
                  selectedTab == _CompanyToolsTab.connected)
                _connectedView(data)
              else
                _catalogView(data),
"""
          tools = tools[:card_start] + replacement + tools[card_end:]

          message_marker = '  void _message(String value) {'
          require(message_marker in tools, 'message method marker missing')
          helpers = """  Widget _connectedView(_ToolsData data) {
            if (!data.installation.isEnabled) {
              return PremiumWorkCard(
                radius: 24,
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text(
                      'Подключённых инструментов пока нет',
                      style: TextStyle(fontSize: 17, fontWeight: FontWeight.w900),
                    ),
                    const SizedBox(height: 7),
                    const Text(
                      'После подключения рабочий инструмент появится у разрешённых ролей в профиле.',
                      style: TextStyle(height: 1.4),
                    ),
                    if (data.access.canManage) ...[
                      const SizedBox(height: 14),
                      FilledButton.icon(
                        onPressed: () => setState(
                          () => selectedTab = _CompanyToolsTab.catalog,
                        ),
                        icon: const Icon(Icons.storefront_outlined),
                        label: const Text('Открыть каталог'),
                      ),
                    ],
                  ],
                ),
              );
            }
            return _DocumentToolCard(
              access: data.access,
              installation: data.installation,
              changing: changing,
              showManagement: false,
              onOpen: () => _openWorkspace(data),
              onEnable: () => _setEnabled(data, true),
              onDisable: () => _setEnabled(data, false),
            );
          }

          Widget _catalogView(_ToolsData data) {
            return _DocumentToolCard(
              access: data.access,
              installation: data.installation,
              changing: changing,
              showManagement: true,
              onOpen: () => _openWorkspace(data),
              onEnable: () => _setEnabled(data, true),
              onDisable: () => _setEnabled(data, false),
            );
          }

          """
          tools = tools.replace(message_marker, helpers + message_marker, 1)

          tools = tools.replace(
              "  final bool changing;\n  final VoidCallback onOpen;",
              "  final bool changing;\n"
              "  final bool showManagement;\n"
              "  final VoidCallback onOpen;",
              1,
          )
          tools = tools.replace(
              "    required this.changing,\n    required this.onOpen,",
              "    required this.changing,\n"
              "    required this.showManagement,\n"
              "    required this.onOpen,",
              1,
          )
          tools = tools.replace(
              "            if (access.canManage)\n              TextButton(",
              "            if (showManagement && access.canManage)\n              TextButton(",
              1,
          )
          tools = tools.replace(
              "          ] else if (access.canManage)\n            FilledButton.icon(",
              "          ] else if (showManagement && access.canManage)\n"
              "            FilledButton.icon(",
              1,
          )
          data_marker = 'class _ToolsData {'
          require(data_marker in tools, 'tools data marker missing')
          tools = tools.replace(
              data_marker,
              'enum _CompanyToolsTab { connected, catalog }\n\n' + data_marker,
              1,
          )
          tools_path.write_text(tools, encoding='utf-8')

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Format and validate
        run: |
          dart format lib/features/tools lib/screens/settings_screen.dart lib/screens/profile_screen.dart
          flutter pub get --enforce-lockfile >/dev/null
          flutter analyze
          flutter test --reporter compact
          flutter build web --release --base-href /appstroy-web/

      - name: Commit tools v2
        shell: bash
        run: |
          rm .github/workflows/materialize-company-tools-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finish connected and catalog tools architecture'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
