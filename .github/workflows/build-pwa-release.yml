name: Build PWA release

on:
  push:
    branches:
      - main
    paths:
      - release/pwa-release.txt
      - .github/workflows/build-pwa-release.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: appstroy-pwa-release
  cancel-in-progress: true

jobs:
  dispatch-canonical-web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Start canonical web deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-web.yml',
              ref: 'main',
            });
