name: Apply desktop width patch

on:
  push:
    branches:
      - fix/unify-bottom-navigation-metrics-20260804
    paths:
      - .github/workflows/apply_desktop_width_patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-bottom-navigation-metrics-20260804
          fetch-depth: 0

      - name: Apply responsive desktop frame
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int | None = None) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {actual}: {old!r}')
              file.write_text(text.replace(old, new, expected))

          replace(
              'lib/app/app_ui_tokens.dart',
              'static const double pageDesktopHorizontalPadding = 30;',
              'static const double pageDesktopHorizontalPadding = 36;',
          )

          replace(
              'lib/widgets/app_page.dart',
              "final effectiveMaxContentWidth = isDesktop && title == 'Кандидаты'\n        ? double.infinity\n        : maxContentWidth;",
              'final effectiveMaxContentWidth = isDesktop\n        ? double.infinity\n        : maxContentWidth;',
          )
          replace(
              'lib/widgets/app_page.dart',
              "final topPadding = isDesktop\n        ? AppUi.pageDesktopTopPadding\n        : AppUi.pageMobileTopPadding;\n    final fixedLeadingCount",
              "final topPadding = isDesktop\n        ? AppUi.pageDesktopTopPadding\n        : AppUi.pageMobileTopPadding;\n    final effectiveMaxContentWidth = isDesktop\n        ? double.infinity\n        : maxContentWidth;\n    final fixedLeadingCount",
          )
          replace(
              'lib/widgets/app_page.dart',
              'constraints: BoxConstraints(maxWidth: maxContentWidth),',
              'constraints: BoxConstraints(maxWidth: effectiveMaxContentWidth),',
          )

          for path, width in {
              'lib/screens/adaptive_home_base_screen.dart': '1240',
              'lib/screens/desktop_employees_view.dart': '1400',
              'lib/screens/desktop_tasks_screen.dart': '1400',
              'lib/screens/desktop_timesheet_screen.dart': '1320',
              'lib/features/payments/presentation/screens/payments_screen.dart': '1360',
              'lib/features/milestones/presentation/milestones_screen.dart': '1060',
              'lib/features/milestones/presentation/milestone_detail_screen.dart': '980',
          }.items():
              replace(
                  path,
                  f'constraints: const BoxConstraints(maxWidth: {width}),',
                  'constraints: const BoxConstraints(maxWidth: double.infinity),',
              )

          replace(
              'lib/widgets/professional_bottom_navigation.dart',
              'isDesktop ? 30 : 12,',
              'isDesktop ? AppUi.pageDesktopHorizontalPadding : 12,',
              count=2,
          )
          replace(
              'lib/widgets/professional_bottom_navigation.dart',
              'maxWidth: isDesktop ? 900 : double.infinity,',
              'maxWidth: double.infinity,',
          )

          Path('test/desktop_width_inventory_test.dart').write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

String source(String path) => File(path).readAsStringSync();

void main() {
  test('desktop pages use the available width with one shared margin', () {
    final tokens = source('lib/app/app_ui_tokens.dart');
    final page = source('lib/widgets/app_page.dart');
    final navigation = source('lib/widgets/professional_bottom_navigation.dart');

    expect(tokens, contains('pageDesktopHorizontalPadding = 36'));
    expect(
      page,
      contains('final effectiveMaxContentWidth = isDesktop\\n'
          '        ? double.infinity\\n'
          '        : maxContentWidth;'),
    );
    expect(navigation, contains('maxWidth: double.infinity'));
    expect(navigation, isNot(contains('maxWidth: isDesktop ? 900')));
  });

  test('custom desktop workspaces no longer use narrow page caps', () {
    final files = <String, String>{
      'lib/screens/adaptive_home_base_screen.dart': '1240',
      'lib/screens/desktop_employees_view.dart': '1400',
      'lib/screens/desktop_tasks_screen.dart': '1400',
      'lib/screens/desktop_timesheet_screen.dart': '1320',
      'lib/features/payments/presentation/screens/payments_screen.dart': '1360',
      'lib/features/milestones/presentation/milestones_screen.dart': '1060',
      'lib/features/milestones/presentation/milestone_detail_screen.dart': '980',
    };

    for (final entry in files.entries) {
      final file = source(entry.key);
      expect(
        file,
        contains(
          'constraints: const BoxConstraints(maxWidth: double.infinity)',
        ),
        reason: entry.key,
      );
      expect(
        file,
        isNot(contains('BoxConstraints(maxWidth: ${entry.value})')),
        reason: entry.key,
      );
    }
  });

  test('mobile page limits remain intact', () {
    expect(
      source('lib/screens/home/home_sections.dart'),
      contains('BoxConstraints(maxWidth: 620)'),
    );
    expect(
      source('lib/screens/employees/employees_view.dart'),
      contains('BoxConstraints(maxWidth: 760)'),
    );
    expect(
      source('lib/screens/timesheet/timesheet_view.dart'),
      contains('BoxConstraints(maxWidth: 860)'),
    );
  });
}
""")

          replace(
              'test/global_ui_scale_contract_test.dart',
              "test('candidate CRM uses full width without stretching every page', () {",
              "test('all desktop AppPage workspaces use the available width', () {",
          )
          replace(
              'test/global_ui_scale_contract_test.dart',
              "expect(page, contains(\"isDesktop && title == 'Кандидаты'\"));",
              "expect(page, isNot(contains(\"title == 'Кандидаты'\")));",
          )

          Path('.github/workflows/apply_desktop_width_patch.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Растянуть рабочие страницы на всю ширину ПК"
          git push origin HEAD:fix/unify-bottom-navigation-metrics-20260804
