name: Refine payment cash mode

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'feature/payment-settlement-period'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payment-settlement-period

      - name: Refine source
        run: python3 tool/refine_payment_cash_mode.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - id: verify
        name: Verify refinement
        shell: bash
        run: |
          rm -f .github/payment-cash-mode-check.txt
          set +e
          {
            dart format \
              lib/features/payments/presentation/screens/payments_screen.dart \
              test/payment_settlement_period_contract_test.dart
            flutter pub get --enforce-lockfile
            flutter analyze
            flutter test test/payment_settlement_period_contract_test.dart
          } > .github/payment-cash-mode-check.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            rm -f .github/payment-cash-mode-check.txt
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            echo "result=error" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.verify.outputs.result == 'error'
        name: Commit refinement diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/payment-cash-mode-check.txt
          git commit -m "Сохранить ошибки денежного режима"
          git push

      - if: steps.verify.outputs.result == 'ok'
        name: Commit verified refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tool/refine_payment_cash_mode.py
          git rm .github/workflows/refine-payment-cash-mode.yml
          git add \
            lib/features/payments/presentation/screens/payments_screen.dart \
            test/payment_settlement_period_contract_test.dart
          git commit -m "Отделить движение денег от расчётного баланса"
          git push
