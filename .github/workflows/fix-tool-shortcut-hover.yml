name: Fix tool shortcut hover

on:
  push:
    branches:
      - fix/tool-shortcut-full-title
    paths:
      - '.github/workflows/fix-tool-shortcut-hover.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tool-shortcut-full-title
          fetch-depth: 0

      - name: Confine hover to shortcut card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/features/tools/presentation/company_tools_screen.dart')
          source = path.read_text(encoding='utf-8')
          old = """    return SizedBox(
      width: 168,
      child: InkWell(
        borderRadius: BorderRadius.circular(26),
        onTap: onTap,
        child: Container(
          constraints: const BoxConstraints(minHeight: 174),
          padding: const EdgeInsets.fromLTRB(14, 16, 14, 14),
          decoration: BoxDecoration(
            color: scheme.surfaceContainerHighest,
            borderRadius: BorderRadius.circular(26),
            border: Border.all(color: scheme.outlineVariant),
          ),
          child: const Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              _EmploymentToolIcon(size: 72),
              SizedBox(height: 13),
              Text(
                'AppСтрой\\nТрудоустройство',
                textAlign: TextAlign.center,
                maxLines: 2,
                style: TextStyle(
                  fontSize: 13,
                  fontWeight: FontWeight.w900,
                  height: 1.12,
                ),
              ),
            ],
          ),
        ),
      ),
    );
"""
          new = """    final radius = BorderRadius.circular(26);
    return SizedBox(
      width: 168,
      child: Material(
        color: Colors.transparent,
        borderRadius: radius,
        clipBehavior: Clip.antiAlias,
        child: Ink(
          constraints: const BoxConstraints(minHeight: 174),
          padding: const EdgeInsets.fromLTRB(14, 16, 14, 14),
          decoration: BoxDecoration(
            color: scheme.surfaceContainerHighest,
            borderRadius: radius,
            border: Border.all(color: scheme.outlineVariant),
          ),
          child: InkWell(
            borderRadius: radius,
            onTap: onTap,
            child: const Column(
              mainAxisAlignment: MainAxisAlignment.center,
              children: [
                _EmploymentToolIcon(size: 72),
                SizedBox(height: 13),
                Text(
                  'AppСтрой\\nТрудоустройство',
                  textAlign: TextAlign.center,
                  maxLines: 2,
                  style: TextStyle(
                    fontSize: 13,
                    fontWeight: FontWeight.w900,
                    height: 1.12,
                  ),
                ),
              ],
            ),
          ),
        ),
      ),
    );
"""
          if old not in source:
              raise SystemExit('Shortcut widget block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-tool-shortcut-hover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/tools/presentation/company_tools_screen.dart .github/workflows/fix-tool-shortcut-hover.yml
          git commit -m "Ограничить подсветку границами ярлыка инструмента"
          git push origin HEAD:fix/tool-shortcut-full-title
