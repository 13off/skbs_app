name: Remove hidden governance dependency

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: remove-hidden-governance-dependency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-readiness:
    if: github.head_ref == 'agent/remove-data-control-extra-chat-button'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Remove readiness dependency and helper workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              'lib/features/developer/presentation/developer_readiness_screen.dart'
          )
          text = path.read_text()
          import_line = "import '../data/data_governance_repository.dart';\n"
          if text.count(import_line) != 1:
              raise SystemExit('Unexpected data governance import count')
          text = text.replace(import_line, '', 1)

          marker = "'Корзина и общий журнал'"
          marker_at = text.index(marker)
          check_start = text.rfind('\n      await check(', 0, marker_at)
          check_end = text.index('\n      await check(', marker_at)
          if check_start < 0:
              raise SystemExit('Could not find hidden readiness check start')
          text = text[:check_start] + text[check_end:]
          path.write_text(text)
          PY

          rm .github/workflows/agent-remove-redundant-controls.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Убрать скрытую проверку контроля данных"
          git push origin HEAD:${{ github.head_ref }}
