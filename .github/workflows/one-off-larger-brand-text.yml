name: One-off larger brand text

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/one-off-larger-brand-text.yml

permissions:
  contents: write

jobs:
  adjust-brand-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Increase title and slogan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path('lib/widgets/app_stroy_brand.dart')
          text = target.read_text(encoding='utf-8')

          replacements = [
              ('width: 210,', 'width: 260,'),
              ('fontSize: 46,', 'fontSize: 56,'),
              ('letterSpacing: -2.1,', 'letterSpacing: -2.4,'),
              ('const SizedBox(height: 12),', 'const SizedBox(height: 14),'),
              ('fontSize: 12.5,', 'fontSize: 18,'),
              ('letterSpacing: 1.05,', 'letterSpacing: 0.2,'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          target.write_text(text, encoding='utf-8')

          for dart_file in [target, *Path('test').rglob('*.dart')]:
              source = dart_file.read_text(encoding='utf-8')
              updated = source.replace(
                  'планируй. строй. управляй.',
                  'планируй • строй • управляй',
              )
              if updated != source:
                  dart_file.write_text(updated, encoding='utf-8')
          PY

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Analyze source
        run: flutter analyze

      - name: Run regression tests
        run: flutter test --reporter compact

      - name: Build web release
        run: flutter build web --release --base-href /appstroy-web/

      - name: Remove temporary files
        run: |
          rm .github/workflows/one-off-larger-brand-text.yml
          rm lib/one_off_brand_deploy_trigger.dart

      - name: Commit adjustment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Увеличить название и слоган на заставке"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
