name: Apply PWA visual correction now

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-background-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the visual correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              value = Path(path).read_text(encoding='utf-8')
              original = value
              for old, new in replacements:
                  value = value.replace(old, new, 1)
              if value == original:
                  raise SystemExit(f'No changes applied to {path}')
              Path(path).write_text(value, encoding='utf-8')

          patch(
              'lib/widgets/app_page.dart',
              [(
                  """        gradient: dark
            ? const LinearGradient(
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
                colors: [Color(0xFF10151B), Color(0xFF080B0F)],
              )
            : const LinearGradient(""",
                  """        // Keep the dark PWA background graphite instead of black.
        gradient: dark
            ? null
            : const LinearGradient(""",
              )],
          )

          patch(
              'lib/app/app_ui_tokens.dart',
              [(
                  '  // 470 logical px renders near 10 cm after the default scale.\n'
                  '  static const double desktopNavigationMaxWidth = 470;',
                  '  // 945 logical px renders near 20 cm after the default scale.\n'
                  '  static const double desktopNavigationMaxWidth = 945;',
              )],
          )

          patch(
              'lib/widgets/professional_bottom_navigation.dart',
              [
                  (
                      '                                horizontal: 4,\n'
                      '                                vertical: isDesktop ? 6 : 4,',
                      '                                horizontal: isDesktop ? 14 : 4,\n'
                      '                                vertical: isDesktop ? 6 : 4,',
                  ),
                  (
                      '                                        const SizedBox(width: 4),',
                      '                                        const SizedBox(width: 10),',
                  ),
                  (
                      '                                            fontSize: 10.5,',
                      '                                            fontSize: 13,',
                  ),
              ],
          )

          for path in (
              'test/pwa_global_page_frame_contract_test.dart',
              'test/desktop_full_width_contract_test.dart',
          ):
              value = Path(path).read_text(encoding='utf-8')
              value = value.replace(
                  'desktopNavigationMaxWidth = 470',
                  'desktopNavigationMaxWidth = 945',
              )
              value = value.replace(
                  'near ten centimetres',
                  'near twenty centimetres',
              )
              Path(path).write_text(value, encoding='utf-8')

          path = Path('test/pwa_global_page_frame_contract_test.dart')
          value = path.read_text(encoding='utf-8')
          anchor = "    expect(page, contains('PwaDesktopPageFrame.isApplied(context)'));\n"
          if "Color(0xFF080B0F)" not in value:
              value = value.replace(
                  anchor,
                  anchor
                  + "    expect(page, isNot(contains('Color(0xFF080B0F)')));\n"
                  + "    expect(page, contains('? null'));\n",
                  1,
              )
          path.write_text(value, encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          rm -f .github/workflows/fix-pwa-background-nav.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Исправить фон PWA и расширить нижнюю панель до 20 см"
          git push

# direct retrigger
