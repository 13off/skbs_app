name: Apply payment settlement period

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/payment-settlement-period'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payment-settlement-period

      - name: Apply source patch
        run: python3 tool/apply_payment_settlement_period_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Format and verify feature
        run: |
          dart format \
            lib/screens/add_payment_screen.dart \
            lib/screens/payment_history_screen.dart \
            lib/features/payments/presentation/screens/payments_screen.dart \
            test/payment_settlement_period_contract_test.dart
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test test/payment_settlement_period_contract_test.dart

      - name: Commit verified source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tool/apply_payment_settlement_period_patch.py
          git rm .github/workflows/apply-payment-settlement-period.yml
          git add \
            lib/screens/add_payment_screen.dart \
            lib/screens/payment_history_screen.dart \
            lib/features/payments/presentation/screens/payments_screen.dart \
            test/payment_settlement_period_contract_test.dart
          git commit -m "Разделить расчётный период и дату выплаты"
          git push
