name: Apply payment settlement period

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/payment-settlement-period'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payment-settlement-period

      - name: Apply source patch
        run: python3 tool/apply_payment_settlement_period_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - id: verify
        name: Format and verify feature
        shell: bash
        run: |
          rm -f .github/payment-period-check.txt
          set +e
          {
            dart format \
              lib/screens/add_payment_screen.dart \
              lib/screens/payment_history_screen.dart \
              lib/features/payments/presentation/screens/payments_screen.dart \
              test/payment_settlement_period_contract_test.dart
            flutter pub get --enforce-lockfile
            flutter analyze
            flutter test test/payment_settlement_period_contract_test.dart
          } > .github/payment-period-check.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            rm -f .github/payment-period-check.txt
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            echo "result=error" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.verify.outputs.result == 'error'
        name: Commit verification diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/payment-period-check.txt
          git commit -m "Сохранить ошибки проверки периода выплат"
          git push

      - if: steps.verify.outputs.result == 'ok'
        name: Commit verified source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tool/apply_payment_settlement_period_patch.py
          git rm .github/workflows/apply-payment-settlement-period.yml
          git add \
            lib/screens/add_payment_screen.dart \
            lib/screens/payment_history_screen.dart \
            lib/features/payments/presentation/screens/payments_screen.dart \
            test/payment_settlement_period_contract_test.dart
          git commit -m "Разделить расчётный период и дату выплаты"
          git push
