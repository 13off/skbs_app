name: Apply bottom navigation transparency fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply_bottom_nav_transparency_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch and apply transparency
        shell: bash
        run: |
          git checkout -b fix/bottom-navigation-real-transparency-20260804
          python3 - <<'PY'
          from pathlib import Path

          navigation_path = Path('lib/widgets/professional_bottom_navigation.dart')
          navigation = navigation_path.read_text()
          replacements = {
              "const _darkNavigationPanelTint = Color(0xFF232C35);":
                  "const _darkNavigationPanelTint = Color(0x66232C35);",
              "const _lightNavigationPanelTint = Color(0xFFF1F4F7);":
                  "const _lightNavigationPanelTint = Color(0x66F1F4F7);",
              "Color(0xF7353B42),": "Color(0xB3353B42),",
              "Color(0xF72C3640),": "Color(0x992C3640),",
              "Color(0xF711171E),": "Color(0x8011171E),",
              "Color(0xFAFFFFFF),": "Color(0xB3FFFFFF),",
              "Color(0xFAF4F7FA),": "Color(0x99F4F7FA),",
              "Color(0xFAE9EEF4),": "Color(0x80E9EEF4),",
              "blurSigma: isDesktop ? 20 : 16,": "blurSigma: isDesktop ? 24 : 20,",
          }
          for old, new in replacements.items():
              count = navigation.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old}')
              navigation = navigation.replace(old, new, 1)
          navigation_path.write_text(navigation)

          test_path = Path('test/bottom_navigation_surface_consistency_contract_test.dart')
          test = test_path.read_text()
          test = test.replace(
              "test('shared bottom navigation keeps one stable surface on every page', () {",
              "test('shared bottom navigation keeps one translucent surface on every page', () {",
          )
          for old, new in {
              "Color(0xF7353B42)": "Color(0xB3353B42)",
              "Color(0xF72C3640)": "Color(0x992C3640)",
              "Color(0xF711171E)": "Color(0x8011171E)",
          }.items():
              if old not in test:
                  raise SystemExit(f'Missing test marker: {old}')
              test = test.replace(old, new)
          marker = "    expect(navigation, contains('_lightNavigationPanelGradient'));\n"
          addition = (
              marker
              + "    expect(navigation, contains('Color(0x66232C35)'));\n"
              + "    expect(navigation, contains('Color(0x66F1F4F7)'));\n"
              + "    expect(navigation, contains('blurSigma: isDesktop ? 24 : 20'));\n"
              + "    expect(navigation, isNot(contains('Color(0xFF232C35)')));\n"
              + "    expect(navigation, isNot(contains('Color(0xF7353B42)')));\n"
          )
          if marker not in test:
              raise SystemExit('Missing insertion marker')
          test = test.replace(marker, addition, 1)
          test_path.write_text(test)
          PY

          rm .github/workflows/apply_bottom_nav_transparency_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Вернуть настоящую прозрачность нижней панели"
          git push origin HEAD:fix/bottom-navigation-real-transparency-20260804
