name: Finalize August whats new

on:
  push:
    paths:
      - '.github/workflows/finalize-august-whats-new.yml'

permissions:
  contents: write

concurrency:
  group: finalize-august-whats-new
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Fix final source detail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(
              'lib/features/whats_new/presentation/role_aware_whats_new_gate.dart'
          )
          source = path.read_text(encoding='utf-8')
          old = 'FontWeight.w650'
          if source.count(old) != 1:
              raise SystemExit(f'expected one {old}, found {source.count(old)}')
          path.write_text(source.replace(old, 'FontWeight.w600'), encoding='utf-8')
          PY

      - name: Format Dart
        run: |
          dart format \
            lib/features/whats_new/presentation/role_aware_whats_new_gate.dart \
            test/company_chat_compact_window_contract_test.dart \
            test/whats_new_animation_contract_test.dart \
            test/whats_new_release_contract_test.dart \
            test/whats_new_role_filter_contract_test.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run focused tests
        run: |
          flutter test \
            test/company_chat_compact_window_contract_test.dart \
            test/whats_new_animation_contract_test.dart \
            test/whats_new_release_contract_test.dart \
            test/whats_new_role_filter_contract_test.dart

      - name: Analyze strictly
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Commit verified result
        run: |
          rm -f .github/workflows/finalize-august-whats-new.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Завершить августовское «Что нового» и скрытие чата сотрудников"
          git push

# retrigger
