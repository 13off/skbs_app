name: Deploy MAX recruiting bot to VPS

on:
  push:
    branches:
      - main
    paths:
      - services/max-recruiting-bot/**
      - tool/apply_max_employee_link_fix.py
      - .github/workflows/deploy-max-bot-vps.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-max-recruiting-bot-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply employee MAX link routing fix
        run: python3 tool/apply_max_employee_link_fix.py

      - name: Validate patched MAX bot
        working-directory: services/max-recruiting-bot
        run: npm run check

      - name: Persist employee MAX link routing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/max-recruiting-bot/src/index.js \
            services/max-recruiting-bot/src/appstroy.js \
            services/max-recruiting-bot/src/utils.js
          if git diff --cached --quiet; then
            echo "Employee MAX link routing is already current"
          else
            git commit -m "Исправить вход сотрудника через персональную ссылку MAX"
            git push origin HEAD:main
          fi

      - name: Validate required VPS secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is missing"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is missing"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is missing"; exit 1; }

      - name: Copy service files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: services/max-recruiting-bot/*,services/max-recruiting-bot/.dockerignore,services/max-recruiting-bot/.env.example
          target: /opt/appstroy-max-bot
          strip_components: 2
          overwrite: true

      - name: Build and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/appstroy-max-bot
            test -f .env || { echo "Missing /opt/appstroy-max-bot/.env"; exit 1; }
            mkdir -p data
            docker compose -f compose.yml build --pull
            docker compose -f compose.yml up -d --force-recreate --remove-orphans
            docker compose -f compose.yml ps
            docker compose -f compose.yml logs --tail=80 max-recruiting-bot
