name: Apply web performance pass

on:
  push:
    branches:
      - performance/web-fast-smooth
    paths:
      - tool/apply_web_performance_patch.py
      - .github/workflows/apply-web-performance.yml
  pull_request:
    branches:
      - main
    paths:
      - tool/apply_web_performance_patch.py
      - .github/workflows/apply-web-performance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/web-fast-smooth
          fetch-depth: 0

      - name: Fix temporary patch indentation
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('tool/apply_web_performance_patch.py')
          text = path.read_text(encoding='utf-8')

          def indent_block(source: str, variable: str) -> str:
              pattern = re.compile(
                  rf"({variable} = ''')(?P<body>.*?)(\n''')",
                  re.DOTALL,
              )
              match = pattern.search(source)
              if match is None:
                  raise RuntimeError(f'Не найден блок {variable}')
              body = match.group('body')
              indented = '\n'.join(f'  {line}' for line in body.split('\n'))
              return source[:match.start('body')] + indented + source[match.end('body'):]

          text = indent_block(text, 'old_pressable_tree')
          text = indent_block(text, 'new_pressable_tree')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply performance patch
        id: patch
        continue-on-error: true
        shell: bash
        run: python3 tool/apply_web_performance_patch.py > performance-patch.log 2>&1

      - name: Save patch diagnostic
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          cat performance-patch.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f performance-patch.log
          git commit -m "сохранена диагностика performance патча"
          git push origin HEAD:performance/web-fast-smooth

      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Format changed source
        run: |
          dart format \
            lib/app/app_theme.dart \
            lib/app/premium_scroll_behavior.dart \
            lib/app/app_scale_viewport.dart \
            lib/app/premium_depth_theme.dart \
            lib/main.dart \
            lib/widgets/app_page.dart \
            lib/widgets/premium_pressable_v3.dart \
            lib/widgets/premium_ui_v2.dart \
            lib/widgets/premium_ui_v2_legacy.dart \
            lib/widgets/professional_bottom_navigation.dart \
            test/web_performance_contract_test.dart

      - name: Analyze source strictly
        run: flutter analyze

      - name: Run performance contract
        run: flutter test test/web_performance_contract_test.dart --reporter compact

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/app/app_theme.dart \
            lib/app/premium_scroll_behavior.dart \
            lib/app/app_scale_viewport.dart \
            lib/app/premium_depth_theme.dart \
            lib/main.dart \
            lib/widgets/app_page.dart \
            lib/widgets/premium_pressable_v3.dart \
            lib/widgets/premium_ui_v2.dart \
            lib/widgets/premium_ui_v2_legacy.dart \
            lib/widgets/professional_bottom_navigation.dart \
            test/web_performance_contract_test.dart
          if git diff --cached --quiet; then
            echo "Performance patch is already applied"
            exit 0
          fi
          git commit -m "ускорены анимации скроллы и отрисовка Web PWA"
          git push origin HEAD:performance/web-fast-smooth
