name: Run recruitment multiple tickets patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/recruitment-multiple-flight-tickets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recruitment-multiple-flight-tickets
          fetch-depth: 0

      - name: Execute stored patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-recruitment-multiple-tickets.yml')
          text = workflow.read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit patch"
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Stored patch markers not found')
          script = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/apply_multi_tickets.py').write_text(textwrap.dedent(script))
          PY
          python3 /tmp/apply_multi_tickets.py
          rm -f .github/workflows/run-recruitment-multiple-tickets-patch.yml

      - name: Commit real patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Поддержать несколько билетов в календаре вылетов"
          git push origin HEAD:feature/recruitment-multiple-flight-tickets
