name: Materialize document mobile scroll hotfix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/materialize-document-scroll-hotfix.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch nested document scroll views
        shell: python
        run: |
          from pathlib import Path

          targets = {
              'lib/features/documents/presentation/document_workflow_screen.dart': 'refresh',
              'lib/features/documents/presentation/document_onboarding_screen.dart': 'refresh',
              'lib/features/documents/presentation/document_package_management_screen.dart': 'refresh',
              'lib/features/documents/presentation/document_generation_screen.dart': '_refresh',
          }

          for file_name, callback in targets.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')

              future_marker = '      child: FutureBuilder<'
              future_index = text.find(future_marker)
              if future_index < 0:
                  raise SystemExit(f'FutureBuilder marker not found in {file_name}')
              refresh_line = f'      onRefresh: {callback},\n'
              before_future = text[max(0, future_index - 80):future_index]
              if refresh_line.strip() not in before_future:
                  text = text[:future_index] + refresh_line + text[future_index:]

              start_marker = '          return RefreshIndicator('
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'RefreshIndicator marker not found in {file_name}')
              children_marker = '              children: ['
              children = text.find(children_marker, start)
              if children < 0:
                  raise SystemExit(f'ListView children marker not found in {file_name}')
              body_start = children + len(children_marker)
              end_marker = '\n              ],\n            ),\n          );'
              end = text.find(end_marker, body_start)
              if end < 0:
                  raise SystemExit(f'RefreshIndicator closing marker not found in {file_name}')

              body = text[body_start:end]
              replacement = (
                  '          return Column(\n'
                  '            crossAxisAlignment: CrossAxisAlignment.stretch,\n'
                  '            children: ['
                  + body
                  + '\n            ],\n'
                  '          );'
              )
              text = text[:start] + replacement + text[end + len(end_marker):]

              if 'return RefreshIndicator(' in text:
                  raise SystemExit(f'Nested RefreshIndicator remains in {file_name}')
              path.write_text(text, encoding='utf-8')

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Format and validate
        run: |
          dart format lib/features/documents/presentation/document_workflow_screen.dart \
            lib/features/documents/presentation/document_onboarding_screen.dart \
            lib/features/documents/presentation/document_package_management_screen.dart \
            lib/features/documents/presentation/document_generation_screen.dart
          flutter pub get --enforce-lockfile >/dev/null
          flutter analyze
          flutter test --reporter compact
          flutter build web --release --base-href /appstroy-web/

      - name: Commit materialized hotfix
        shell: bash
        run: |
          rm .github/workflows/materialize-document-scroll-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/documents/presentation .github/workflows/materialize-document-scroll-hotfix.yml
          git commit -m 'fix: render document workflow on mobile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
