name: Apply continuous shell background

on:
  push:
    branches:
      - main
    paths:
      - release/continuous-shell-background.txt
      - tool/apply_continuous_shell_background.py
      - .github/workflows/apply-continuous-shell-background.yml

permissions:
  contents: write

concurrency:
  group: continuous-shell-background
  cancel-in-progress: true

jobs:
  patch-test-and-publish-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply continuous background fix
        run: python3 tool/apply_continuous_shell_background.py

      - name: Remove one-time files
        run: |
          rm -f release/continuous-shell-background.txt
          rm -f tool/apply_continuous_shell_background.py
          rm -f .github/workflows/apply-continuous-shell-background.yml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Format changed Dart files
        run: |
          dart format \
            lib/widgets/app_page.dart \
            lib/features/shell/presentation/persistent_tab_shell.dart \
            lib/features/shell/presentation/premium_main_screen.dart \
            test/navigation_overlay_and_task_fab_contract_test.dart \
            test/bottom_controls_safety_test.dart \
            test/timesheet_floating_controls_contract_test.dart \
            test/global_bottom_navigation_clearance_contract_test.dart \
            test/global_shell_background_continuity_test.dart

      - name: Run background and navigation regression tests
        run: |
          flutter test --reporter compact \
            test/global_shell_background_continuity_test.dart \
            test/navigation_overlay_and_task_fab_contract_test.dart \
            test/bottom_controls_safety_test.dart \
            test/timesheet_floating_controls_contract_test.dart \
            test/global_bottom_navigation_clearance_contract_test.dart \
            test/persistent_tab_shell_clearance_test.dart \
            test/professional_bottom_navigation_test.dart

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Publish verified fix branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/continuous-shell-background-applied
          git add -A
          git commit -m "Продолжить фон экранов под нижней панелью"
          git push --force-with-lease origin HEAD:refs/heads/fix/continuous-shell-background-applied
