name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop-20260821
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-windows-desktop.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-windows-desktop.yml'

permissions:
  contents: read

concurrency:
  group: appstroy-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
  FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
  FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
  FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
  FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install locked dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Analyze source
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run regression tests
        shell: pwsh
        run: flutter test

      - name: Generate branded Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          @'
          from PIL import Image
          from pathlib import Path
          src = Path('web/icons/AppStroy-512-v2.png')
          dst = Path('windows/runner/resources/app_icon.ico')
          dst.parent.mkdir(parents=True, exist_ok=True)
          image = Image.open(src).convert('RGBA')
          image.save(dst, format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print(f'Windows icon: {dst} ({dst.stat().st_size} bytes)')
          '@ | python -

      - name: Build native Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL=https://api.appstroy-web.ru `
            --dart-define=FIREBASE_API_KEY="$env:FIREBASE_API_KEY" `
            --dart-define=FIREBASE_PROJECT_ID="$env:FIREBASE_PROJECT_ID" `
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$env:FIREBASE_MESSAGING_SENDER_ID" `
            --dart-define=FIREBASE_AUTH_DOMAIN="$env:FIREBASE_AUTH_DOMAIN" `
            --dart-define=FIREBASE_STORAGE_BUCKET="$env:FIREBASE_STORAGE_BUCKET" `
            --dart-define=FIREBASE_WEB_APP_ID="$env:FIREBASE_WEB_APP_ID" `
            --dart-define=FIREBASE_ANDROID_APP_ID="$env:FIREBASE_ANDROID_APP_ID" `
            --dart-define=FIREBASE_IOS_APP_ID="$env:FIREBASE_IOS_APP_ID" `
            --dart-define=FIREBASE_VAPID_KEY="$env:FIREBASE_VAPID_KEY"

          $exe = 'build/windows/x64/runner/Release/AppStroy.exe'
          if (!(Test-Path $exe)) { throw "Windows executable not found: $exe" }
          if ((Get-Item $exe).Length -le 0) { throw "Windows executable is empty" }

      - name: Prepare portable package
        shell: pwsh
        run: |
          $sourceSha = git rev-parse HEAD
          $shortSha = git rev-parse --short=12 HEAD
          New-Item -ItemType Directory -Force -Path windows-output | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "windows-output/AppStroy-Windows-$shortSha.zip" -CompressionLevel Optimal
          Copy-Item "windows-output/AppStroy-Windows-$shortSha.zip" 'windows-output/AppStroy-Windows-latest.zip'
          Set-Content -Path 'windows-output/source-commit.txt' -Value $sourceSha -Encoding ascii

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          $appVersion = ($versionLine -split '\+')[0]
          $buildDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $outputDir = (Resolve-Path 'windows-output').Path
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DBuildDir=$buildDir" "/DOutputDir=$outputDir" "/DAppVersion=$appVersion" 'windows/installer/AppStroy.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = 'windows-output/AppStroy-Windows-Setup.exe'
          if (!(Test-Path $installer)) { throw "Installer was not produced" }
          Get-FileHash $installer -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  AppStroy-Windows-Setup.exe" } | Set-Content 'windows-output/AppStroy-Windows-Setup.sha256' -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AppStroy-Windows-Desktop
          path: windows-output/
          retention-days: 30
          if-no-files-found: error
