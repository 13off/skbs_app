name: One-time profile and payment history polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-profile-payment-history-polish.yml

permissions:
  contents: write

jobs:
  prepare-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply requested changes
        shell: bash
        run: |
          git checkout -B profile-cleanup-payment-history
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          app_page = 'lib/widgets/app_page.dart'
          replace_once(
              app_page,
              "  final bool showBackButton;\n  final VoidCallback? onBack;",
              "  final bool showBackButton;\n  final bool suppressAutomaticBackButton;\n  final VoidCallback? onBack;",
          )
          replace_once(
              app_page,
              "    this.showBackButton = false,\n    this.onBack,",
              "    this.showBackButton = false,\n    this.suppressAutomaticBackButton = false,\n    this.onBack,",
          )
          replace_once(
              app_page,
              "    final effectiveShowBackButton = showBackButton || canPop;",
              "    final effectiveShowBackButton =\n        !suppressAutomaticBackButton && (showBackButton || canPop);",
          )

          profile = 'lib/screens/profile_screen.dart'
          replace_once(
              profile,
              "    return AppPage(\n      title: 'Профиль',\n      subtitle: 'Личные и рабочие данные',",
              "    return AppPage(\n      title: 'Профиль',\n      subtitle: 'Личные и рабочие данные',\n      suppressAutomaticBackButton: true,",
          )
          replace_once(
              profile,
              """          const SizedBox(height: 8),
          sectionTitle('Приложение'),
          if (profile.isEmployee)
            actionTile(
              icon: Icons.history_rounded,
              title: 'История задач',
              subtitle: 'Задачи и результаты работы по выбранным датам',
              onTap: () => open(
                EmployeeWorkTaskHistoryScreen(
                  profile: profile,
                  selectedEmployeeId: employeeHistoryId,
                ),
              ),
            ),
          actionTile(
            icon: Icons.settings_outlined,
            title: 'Настройки',
            subtitle:
                'Интерфейс, масштаб, уведомления и параметры профессии',
            onTap: () => open(SettingsScreen(profile: settingsProfile())),
          ),
          const SizedBox(height: 8),
""",
              """          if (profile.isEmployee) ...[
            const SizedBox(height: 8),
            sectionTitle('Приложение'),
            actionTile(
              icon: Icons.history_rounded,
              title: 'История задач',
              subtitle: 'Задачи и результаты работы по выбранным датам',
              onTap: () => open(
                EmployeeWorkTaskHistoryScreen(
                  profile: profile,
                  selectedEmployeeId: employeeHistoryId,
                ),
              ),
            ),
          ],
          const SizedBox(height: 8),
""",
          )

          history = 'lib/screens/payment_history_screen.dart'
          replace_once(
              history,
              "import '../data/payment_repository.dart';\nimport '../models/employee.dart';",
              "import '../data/payment_repository.dart';\nimport '../models/employee.dart';\nimport 'add_payment_screen.dart';",
          )
          replace_once(
              history,
              """  Future<void> loadHistory({bool forceRefresh = false}) async {
""",
              """  DateTime get suggestedSettlementMonth {
    if (payments.isNotEmpty) {
      final latest = payments.reduce(
        (current, candidate) => candidate.paymentDate.isAfter(current.paymentDate)
            ? candidate
            : current,
      );
      return DateTime(latest.periodYear, latest.periodMonth, 1);
    }

    final now = DateTime.now();
    return DateTime(now.year, now.month, 1);
  }

  String? get addPaymentEmployeeId {
    final primaryId = widget.employee.id?.trim() ?? '';
    if (primaryId.isNotEmpty) return primaryId;
    final ids = historyEmployeeIds;
    return ids.isEmpty ? null : ids.first;
  }

  Future<void> openAddPayment() async {
    final employeeId = addPaymentEmployeeId;
    if (employeeId == null || employeeId.isEmpty) {
      setState(() => errorText = 'Не удалось добавить выплату: нет ID сотрудника');
      return;
    }

    final period = suggestedSettlementMonth;
    final result = await Navigator.of(context).push<bool>(
      MaterialPageRoute<bool>(
        builder: (_) => AddPaymentScreen(
          periodYear: period.year,
          periodMonth: period.month,
          periodTitle: '${monthName(period.month)} ${period.year}',
          initialEmployeeId: employeeId,
          initialObjectName: widget.employee.objectName,
        ),
      ),
    );

    if (!mounted || result != true) return;
    await loadHistory(forceRefresh: true);
  }

  Future<void> loadHistory({bool forceRefresh = false}) async {
""",
          )
          replace_once(
              history,
              """          Row(
            children: [
              const Icon(Icons.payments_outlined, size: 20),
              const SizedBox(width: 8),
              Text(
                'Всего по истории: ${formatMoney(totalAmount)}',
                style: const TextStyle(
                  fontWeight: FontWeight.w900,
                  fontSize: 16,
                ),
              ),
            ],
          ),
""",
              """          Row(
            children: [
              const Icon(Icons.payments_outlined, size: 20),
              const SizedBox(width: 8),
              Text(
                'Всего по истории: ${formatMoney(totalAmount)}',
                style: const TextStyle(
                  fontWeight: FontWeight.w900,
                  fontSize: 16,
                ),
              ),
            ],
          ),
          const SizedBox(height: 16),
          SizedBox(
            width: double.infinity,
            child: FilledButton.icon(
              onPressed: isLoading ? null : openAddPayment,
              icon: const Icon(Icons.add_rounded),
              label: const Text('Добавить выплату'),
            ),
          ),
""",
          )

          test = Path('test/profile_navigation_and_payment_history_contract_test.dart')
          test.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('профиль использует только верхнюю шестерёнку без стрелки назад', () {
    final profile = File('lib/screens/profile_screen.dart').readAsStringSync();
    final appPage = File('lib/widgets/app_page.dart').readAsStringSync();

    expect(profile, contains("tooltip: 'Настройки'"));
    expect(profile, contains('suppressAutomaticBackButton: true'));
    expect(profile, isNot(contains("title: 'Настройки'")));
    expect(appPage, contains('final bool suppressAutomaticBackButton;'));
    expect(
      appPage,
      contains('!suppressAutomaticBackButton && (showBackButton || canPop)'),
    );
  });

  test('из истории выплат можно открыть добавление для текущего сотрудника', () {
    final history = File(
      'lib/screens/payment_history_screen.dart',
    ).readAsStringSync();

    expect(history, contains("import 'add_payment_screen.dart';"));
    expect(history, contains('AddPaymentScreen('));
    expect(history, contains('initialEmployeeId: employeeId'));
    expect(history, contains("label: const Text('Добавить выплату')"));
    expect(history, contains('await loadHistory(forceRefresh: true)'));
  });
}
""", encoding='utf-8')
          PY

          dart format \
            lib/widgets/app_page.dart \
            lib/screens/profile_screen.dart \
            lib/screens/payment_history_screen.dart \
            test/profile_navigation_and_payment_history_contract_test.dart

          rm .github/workflows/one-time-profile-payment-history-polish.yml

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze source strictly
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run regression tests
        run: flutter test

      - name: Push prepared branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Упростить профили и добавить выплату из истории"
          git push --force origin HEAD:profile-cleanup-payment-history
