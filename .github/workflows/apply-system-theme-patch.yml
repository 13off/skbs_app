name: Apply system theme patch

on:
  push:
    branches:
      - agent/system-theme-audit
    paths:
      - tool/apply_system_theme_patch.py
      - .github/workflows/apply-system-theme-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/system-theme-audit
          fetch-depth: 0

      - name: Apply verified theme replacements
        run: python3 tool/apply_system_theme_patch.py

      - name: Remove one-time patch files
        run: |
          rm tool/apply_system_theme_patch.py
          rm .github/workflows/apply-system-theme-patch.yml

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Исправить системные цвета тёмной темы"
          git push origin HEAD:agent/system-theme-audit
