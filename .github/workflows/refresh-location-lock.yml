name: Refresh location dependency lock

on:
  push:
    branches:
      - agent/employee-shifts-geolocation
    paths:
      - pubspec.yaml
      - .github/workflows/refresh-location-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/employee-shifts-geolocation
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "обновлен lockfile геолокации [skip ci]"
          git push origin HEAD:agent/employee-shifts-geolocation
