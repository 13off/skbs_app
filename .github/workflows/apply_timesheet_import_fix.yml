name: Apply timesheet import fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply_timesheet_import_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/timesheet-bottom-panel-20260804
          fetch-depth: 0

      - name: Add shared UI import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/desktop_timesheet_screen.dart')
          text = path.read_text()
          old = "import '../app/app_adaptive_palette.dart';\n"
          new = "import '../app/app_adaptive_palette.dart';\nimport '../app/app_ui_tokens.dart';\n"
          if text.count(old) != 1:
              raise SystemExit('Unexpected import block')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit branch fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/desktop_timesheet_screen.dart
          git commit -m "Подключить общие UI-метрики в ПК-табеле"
          git push origin HEAD:fix/timesheet-bottom-panel-20260804
