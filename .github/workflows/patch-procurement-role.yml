name: Patch procurement role

on:
  push:
    branches:
      - codex/procurement-panel-mvp-20260801
    paths:
      - tool/patch_procurement_role.py
      - .github/workflows/patch-procurement-role.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/procurement-panel-mvp-20260801
          fetch-depth: 0

      - name: Patch role lists
        run: python3 tool/patch_procurement_role.py

      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/company/data/company_repository.dart \
            lib/features/company/presentation/mobile_company_management_screen.dart \
            lib/features/company/presentation/desktop_company_user_dialogs.dart \
            supabase/functions/invite-company-member-core/index.ts
          git commit -m "Подключить снабженца к приглашениям и управлению компанией"
          git push origin HEAD:codex/procurement-panel-mvp-20260801
