name: Post-deploy web smoke

on:
  workflow_run:
    workflows:
      - Build and publish web
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstroy-web-smoke
  cancel-in-progress: true

env:
  APP_PUBLIC_URL: https://13off.github.io/appstroy-web-deploy/
  API_BASE_URL: https://api.appstroy-web.ru
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_QBdH-vIQv4F_tVVNc4Ps_w_ssxwSaEm

jobs:
  production-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Resolve expected deployment id
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            expected="${{ github.event.workflow_run.id }}"
          else
            expected=""
          fi
          printf 'id=%s\n' "$expected" >> "$GITHUB_OUTPUT"
          printf 'Expected deployment id: %s\n' "${expected:-any-current}" | tee smoke-report.txt

      - name: Wait for published deployment
        shell: bash
        env:
          EXPECTED_BUILD_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 24); do
            cache_key="${GITHUB_RUN_ID}-${attempt}"
            index_file="$(mktemp)"
            index_code="$(curl --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
              -sS -o "$index_file" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "${APP_PUBLIC_URL}?smoke=${cache_key}" || true)"
            printf 'Attempt %s: index=%s deployment=%s\n' \
              "$attempt" "$index_code" "${EXPECTED_BUILD_ID:-any-current}" | tee -a smoke-report.txt
            if [ "$index_code" = "200" ]; then
              if [ -z "$EXPECTED_BUILD_ID" ] || grep -q "flutter_bootstrap.js?v=${EXPECTED_BUILD_ID}" "$index_file"; then
                success=true
                break
              fi
            fi
            sleep 10
          done
          if [ "$success" != "true" ]; then
            echo '::error::Опубликованная web/PWA не дошла до ожидаемого deploy' | tee -a smoke-report.txt
            exit 1
          fi

      - name: Validate PWA assets
        shell: bash
        env:
          EXPECTED_BUILD_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -euo pipefail
          cache_key="${GITHUB_RUN_ID}-assets"
          curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 -fsS \
            -H 'Cache-Control: no-cache' \
            "${APP_PUBLIC_URL}manifest.json?smoke=${cache_key}" > manifest.json
          curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 -fsS \
            -H 'Cache-Control: no-cache' \
            "${APP_PUBLIC_URL}flutter_bootstrap.js?smoke=${cache_key}" > flutter_bootstrap.js
          curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 -fsS \
            -H 'Cache-Control: no-cache' \
            "${APP_PUBLIC_URL}flutter_service_worker.js?smoke=${cache_key}" > flutter_service_worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          if not str(manifest.get('name', '')).strip():
              raise SystemExit('manifest.json: отсутствует name')
          icons = manifest.get('icons')
          if not isinstance(icons, list) or not icons:
              raise SystemExit('manifest.json: отсутствуют icons')
          if not Path('flutter_bootstrap.js').read_text(encoding='utf-8').strip():
              raise SystemExit('flutter_bootstrap.js пуст')
          if not Path('flutter_service_worker.js').read_text(encoding='utf-8').strip():
              raise SystemExit('flutter_service_worker.js пуст')
          PY
          if [ -n "$EXPECTED_BUILD_ID" ]; then
            grep -q "main.dart.js?v=${EXPECTED_BUILD_ID}" flutter_bootstrap.js
          fi
          printf 'PWA assets: OK\n' | tee -a smoke-report.txt

      - name: Validate Russian API proxy
        shell: bash
        run: |
          set -euo pipefail
          proxy_code="$(curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -sS -o proxy-health.txt -w '%{http_code}' \
            "${API_BASE_URL}/proxy-health" || true)"
          health_code="$(curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -sS -o auth-health.json -w '%{http_code}' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${API_BASE_URL}/auth/v1/health" || true)"
          printf 'Proxy health HTTP: %s\n' "$proxy_code" | tee -a smoke-report.txt
          printf 'Auth health HTTP: %s\n' "$health_code" | tee -a smoke-report.txt
          if [ "$proxy_code" != "200" ] || [ "$(tr -d '\r\n[:space:]' < proxy-health.txt)" != "ok" ]; then
            echo '::error::Российский API-прокси не прошёл собственный health check' | tee -a smoke-report.txt
            exit 1
          fi
          if [ "$health_code" != "200" ] || ! grep -q '"name":"GoTrue"' auth-health.json; then
            echo '::error::Российский API-прокси не прошёл auth health' | tee -a smoke-report.txt
            exit 1
          fi

      - name: Verify Edge Function rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          edge_code="$(curl --connect-timeout 10 --max-time 30 -sS \
            -o edge-anonymous.json -w '%{http_code}' \
            -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/json' \
            --data '{"company_id":"00000000-0000-0000-0000-000000000000","prompt":"проверка"}' \
            "${API_BASE_URL}/functions/v1/ai-operational-draft" || true)"
          printf 'Anonymous Edge HTTP: %s\n' "$edge_code" | tee -a smoke-report.txt
          case "$edge_code" in
            401|403) ;;
            *)
              echo '::error::Edge Function не подтвердила JWT-защиту' | tee -a smoke-report.txt
              exit 1
              ;;
          esac

      - name: Write smoke summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AppСтрой web/PWA smoke'
            echo
            echo "- Public URL: ${APP_PUBLIC_URL}"
            echo "- API proxy: ${API_BASE_URL}"
            echo "- Deploy id: ${{ steps.deployment.outputs.id }}"
            echo
            echo '```text'
            test -f smoke-report.txt && cat smoke-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke diagnostics
        # HTTP/PWA checks above remain required; their summary is kept in logs.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-pwa-smoke-${{ github.run_id }}
          path: |
            smoke-report.txt
            proxy-health.txt
            auth-health.json
            edge-anonymous.json
            manifest.json
            flutter_bootstrap.js
          if-no-files-found: warn
          retention-days: 7
