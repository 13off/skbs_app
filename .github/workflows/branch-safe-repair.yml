name: One-time safe branch repair

# One-time trigger v8 for agent/full-safe-hardening.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-safe-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appstroy-one-time-safe-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-safe-hardening
          fetch-depth: 0
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Apply, validate and save only safe repairs
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            dart fix --apply

            python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'scrollCacheExtent: ScrollCacheExtent.pixels(700),':
                  'cacheExtent: 700,',
              'scrollCacheExtent: ScrollCacheExtent.pixels(cacheExtent),':
                  'cacheExtent: cacheExtent,',
          }
          replacement_counts = {key: 0 for key in replacements}
          for path in Path('lib').rglob('*.dart'):
              source = path.read_text(encoding='utf-8')
              repaired = source
              for generated, working in replacements.items():
                  count = repaired.count(generated)
                  replacement_counts[generated] += count
                  repaired = repaired.replace(generated, working)
              if repaired != source:
                  path.write_text(repaired, encoding='utf-8')

          expected = {
              'scrollCacheExtent: ScrollCacheExtent.pixels(700),': 3,
              'scrollCacheExtent: ScrollCacheExtent.pixels(cacheExtent),': 1,
          }
          if replacement_counts != expected:
              raise RuntimeError(
                  f'Unexpected ScrollCacheExtent replacement counts: '
                  f'{replacement_counts}'
              )

          user_repository = Path(
              'lib/features/auth/data/user_repository.dart'
          )
          source = user_repository.read_text(encoding='utf-8')
          repaired = source.replace(
              "final title = html.document.title.trim() ?? '';",
              'final title = html.document.title.trim();',
          )
          if repaired == source and 'final title = html.document.title.trim();' not in source:
              raise RuntimeError('Browser title source shape changed unexpectedly')
          user_repository.write_text(repaired, encoding='utf-8')
          PY

            mapfile -t dart_files < <(git diff --name-only --diff-filter=ACMR -- '*.dart')
            if [ "${#dart_files[@]}" -gt 0 ]; then
              dart format "${dart_files[@]}"
            fi

            if grep -R -n 'ScrollCacheExtent' lib; then
              echo 'Unsupported ScrollCacheExtent remained after compatibility repair'
              exit 1
            fi

            flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/flutter-analyze.log
            flutter test --reporter compact
            flutter build web --release --base-href /appstroy-web/
          } 2>&1 | tee /tmp/appstroy-safe-repair.log
          repair_status=${PIPESTATUS[0]}
          set -e

          git fetch origin main agent/full-safe-hardening

          if [ "$repair_status" -ne 0 ]; then
            git reset --hard origin/agent/full-safe-hardening
            mkdir -p repair_logs
            cp /tmp/appstroy-safe-repair.log repair_logs/failure.log
            git checkout origin/main -- .github/workflows/pr-check.yml
            rm -f .github/workflows/temporary-safe-repair.yml tool/safe_repair.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git add -f repair_logs/failure.log
            git commit -m "Сохранить причину остановки безопасного ремонта" || true
            git push origin HEAD:agent/full-safe-hardening
            exit "$repair_status"
          fi

          mkdir -p repair_logs
          cp /tmp/flutter-analyze.log repair_logs/flutter-analyze.log
          cp /tmp/appstroy-safe-repair.log repair_logs/full-validation.log
          {
            echo "dart_fix=completed"
            echo "targeted_format=completed"
            echo "analyze=completed"
            echo "tests=completed"
            echo "web_build=completed"
          } > repair_logs/status.txt

          git checkout origin/main -- .github/workflows/pr-check.yml
          rm -f .github/workflows/temporary-safe-repair.yml tool/safe_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f repair_logs/flutter-analyze.log repair_logs/full-validation.log repair_logs/status.txt
          git commit -m "Применить проверенные автоматические исправления"
          git push origin HEAD:agent/full-safe-hardening
