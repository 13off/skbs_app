name: Patch expenses date range dialog

on:
  push:
    branches:
      - codex/fix-expenses-date-range-dialog

permissions:
  contents: write

concurrency:
  group: patch-expenses-date-range-dialog
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-expenses-date-range-dialog
          fetch-depth: 0
          persist-credentials: true

      - name: Patch expenses period picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/expenses/presentation/expenses_screen.dart')
          source = path.read_text(encoding='utf-8')

          old = """  Future<void> choosePeriod() async {
    final picked = await showDateRangePicker(
      context: context,
      firstDate: DateTime(2024),
      lastDate: DateTime.now().add(const Duration(days: 365)),
      initialDateRange: DateTimeRange(start: from, end: to),
      helpText: 'Период расходов',
      saveText: 'Применить',
    );
    if (picked == null || !mounted) return;
    setState(() {
      from = DateTime(picked.start.year, picked.start.month, picked.start.day);
      to = DateTime(picked.end.year, picked.end.month, picked.end.day);
    });
    await load();
  }
"""

          new = """  Future<void> choosePeriod() async {
    var draftStart = DateTime(from.year, from.month, from.day);
    var draftEnd = DateTime(to.year, to.month, to.day);
    var editingStart = true;
    final firstAllowed = DateTime(2024);
    final lastAllowed = DateTime.now().add(const Duration(days: 365));

    final picked = await showDialog<DateTimeRange>(
      context: context,
      barrierDismissible: false,
      builder: (dialogContext) => StatefulBuilder(
        builder: (context, setDialogState) {
          final activeDate = editingStart ? draftStart : draftEnd;

          return AlertDialog(
            title: const Text('Период расходов'),
            content: SizedBox(
              width: 430,
              child: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  Row(
                    children: [
                      Expanded(
                        child: ChoiceChip(
                          label: Text('С ${formatDate(draftStart)}'),
                          selected: editingStart,
                          onSelected: (_) {
                            setDialogState(() => editingStart = true);
                          },
                        ),
                      ),
                      const SizedBox(width: 10),
                      Expanded(
                        child: ChoiceChip(
                          label: Text('По ${formatDate(draftEnd)}'),
                          selected: !editingStart,
                          onSelected: (_) {
                            setDialogState(() => editingStart = false);
                          },
                        ),
                      ),
                    ],
                  ),
                  const SizedBox(height: 10),
                  CalendarDatePicker(
                    key: ValueKey<String>(
                      '${editingStart ? 'start' : 'end'}-${activeDate.toIso8601String()}',
                    ),
                    initialDate: activeDate,
                    firstDate: firstAllowed,
                    lastDate: lastAllowed,
                    onDateChanged: (value) {
                      final clean = DateTime(value.year, value.month, value.day);
                      setDialogState(() {
                        if (editingStart) {
                          draftStart = clean;
                          if (draftEnd.isBefore(draftStart)) {
                            draftEnd = draftStart;
                          }
                          editingStart = false;
                        } else {
                          draftEnd = clean;
                          if (draftStart.isAfter(draftEnd)) {
                            draftStart = draftEnd;
                          }
                        }
                      });
                    },
                  ),
                ],
              ),
            ),
            actions: [
              TextButton(
                onPressed: () => Navigator.pop(dialogContext),
                child: const Text('Отмена'),
              ),
              FilledButton.icon(
                onPressed: () {
                  Navigator.pop(
                    dialogContext,
                    DateTimeRange(start: draftStart, end: draftEnd),
                  );
                },
                icon: const Icon(Icons.check_rounded),
                label: const Text('Применить'),
              ),
            ],
          );
        },
      ),
    );

    if (picked == null || !mounted) return;
    setState(() {
      from = DateTime(picked.start.year, picked.start.month, picked.start.day);
      to = DateTime(picked.end.year, picked.end.month, picked.end.day);
    });
    await load();
  }
"""

          if old not in source:
              raise SystemExit('choosePeriod snippet not found')

          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify picker contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('lib/features/expenses/presentation/expenses_screen.dart').read_text(encoding='utf-8')
          assert 'showDateRangePicker(' not in source
          assert "CalendarDatePicker(" in source
          assert "label: const Text('Применить')" in source
          assert "barrierDismissible: false" in source
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze source strictly
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-expenses-date-range-dialog.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить выбор периода расходов"
          for attempt in 1 2 3; do
            git pull --rebase origin codex/fix-expenses-date-range-dialog
            if git push origin HEAD:codex/fix-expenses-date-range-dialog; then
              exit 0
            fi
            sleep 4
          done
          exit 1
