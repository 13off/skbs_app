name: Clean three feature branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foreman-drafts-payment-filters-first-run-guide
          fetch-depth: 0

      - name: Restore main and keep only feature files
        run: |
          tar -cf /tmp/three-features.tar \
            lib/data/task_repository.dart \
            lib/screens/add_task_screen.dart \
            lib/screens/task_create/task_create_actions.dart \
            lib/screens/task_create/task_create_view.dart \
            lib/features/tasks/presentation/task_drafts_sheet.dart \
            lib/screens/mobile_tasks_screen.dart \
            lib/features/foreman/presentation/foreman_desktop_tasks_screen.dart \
            lib/features/foreman/presentation/foreman_main_screen.dart \
            lib/features/payments/presentation/screens/payments_screen.dart \
            lib/features/onboarding/presentation/first_run_guide.dart \
            lib/features/whats_new/presentation/whats_new_gate.dart \
            lib/screens/main_screen.dart \
            test/foreman_drafts_payments_onboarding_contract_test.dart
          git fetch origin main
          rm -rf lib test
          git checkout origin/main -- lib test
          tar -xf /tmp/three-features.tar
          rm -f \
            .github/patch-error.txt \
            .github/patch-v2-error.txt \
            .github/feature-check.txt \
            .github/workflows/apply-three-backlog-features.yml \
            .github/workflows/run-three-feature-patch-on-pr.yml \
            .github/workflows/run-three-feature-patch-v2.yml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify clean feature diff
        run: |
          dart format \
            lib/data/task_repository.dart \
            lib/screens/add_task_screen.dart \
            lib/screens/task_create/task_create_actions.dart \
            lib/screens/task_create/task_create_view.dart \
            lib/features/tasks/presentation/task_drafts_sheet.dart \
            lib/screens/mobile_tasks_screen.dart \
            lib/features/foreman/presentation/foreman_desktop_tasks_screen.dart \
            lib/features/foreman/presentation/foreman_main_screen.dart \
            lib/features/payments/presentation/screens/payments_screen.dart \
            lib/features/onboarding/presentation/first_run_guide.dart \
            lib/features/whats_new/presentation/whats_new_gate.dart \
            lib/screens/main_screen.dart \
            test/foreman_drafts_payments_onboarding_contract_test.dart
          flutter pub get
          flutter analyze
          flutter test test/foreman_drafts_payments_onboarding_contract_test.dart

      - name: Commit clean feature diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Очистить изменения трёх функций"
          git push
