name: Apply navigation background surface

on:
  push:
    branches:
      - main
    paths:
      - release/navigation-background-surface.txt
      - tool/apply_navigation_background_surface.py
      - .github/workflows/apply-navigation-background-surface.yml

permissions:
  contents: write

concurrency:
  group: navigation-background-surface
  cancel-in-progress: true

jobs:
  patch-test-and-publish-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply background fix
        run: python3 tool/apply_navigation_background_surface.py

      - name: Remove one-time files
        run: |
          rm -f release/navigation-background-surface.txt
          rm -f tool/apply_navigation_background_surface.py
          rm -f .github/workflows/apply-navigation-background-surface.yml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/shell/presentation/persistent_tab_shell.dart \
            lib/features/shell/presentation/premium_main_screen.dart \
            test/navigation_overlay_and_task_fab_contract_test.dart \
            test/bottom_controls_safety_test.dart \
            test/timesheet_floating_controls_contract_test.dart \
            test/global_bottom_navigation_clearance_contract_test.dart

      - name: Run navigation regression tests
        run: |
          flutter test --reporter compact \
            test/navigation_overlay_and_task_fab_contract_test.dart \
            test/bottom_controls_safety_test.dart \
            test/timesheet_floating_controls_contract_test.dart \
            test/global_bottom_navigation_clearance_contract_test.dart \
            test/persistent_tab_shell_clearance_test.dart \
            test/professional_bottom_navigation_test.dart

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Publish verified fix branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/navigation-background-surface-applied
          git add -A
          git commit -m "Убрать чёрную полосу под прозрачной нижней панелью"
          git push --force-with-lease origin HEAD:refs/heads/fix/navigation-background-surface-applied
