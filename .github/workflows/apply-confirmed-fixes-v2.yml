name: Apply confirmed acceptance fixes v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || 'agent/full-acceptance-test-2026-08-04' }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply behavior-preserving source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import defaultdict
          from datetime import datetime, timedelta
          from pathlib import Path
          import re

          candidate = Path('supabase/functions/recruitment-candidate-action/index.ts')
          text = candidate.read_text(encoding='utf-8')
          text = text.replace(
              'import { createClient } from "npm:@supabase/supabase-js@2.110.5";',
              'import { createClient, type SupabaseClient } from "npm:@supabase/supabase-js@2.110.5";',
              1,
          )
          marker = 'type JsonMap = Record<string, unknown>;\n'
          types = '''type JsonMap = Record<string, unknown>;\n\ntype AdminClient = SupabaseClient<any>;\n\ntype StoredFileRow = {\n  storage_bucket: string | null;\n  storage_path: string | null;\n};\n'''
          if 'type AdminClient = SupabaseClient<any>;' not in text:
              if marker not in text:
                  raise SystemExit('candidate-action JsonMap marker missing')
              text = text.replace(marker, types, 1)
          text = text.replace('admin: ReturnType<typeof createClient>,', 'admin: AdminClient,')
          old_loop = '''  const grouped = new Map<string, Set<string>>();\n  for (const row of [...(documents ?? []), ...(messages ?? [])]) {\n'''
          new_loop = '''  const grouped = new Map<string, Set<string>>();\n  const storedFiles: StoredFileRow[] = [\n    ...((documents ?? []) as StoredFileRow[]),\n    ...((messages ?? []) as StoredFileRow[]),\n  ];\n  for (const row of storedFiles) {\n'''
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif new_loop not in text:
              raise SystemExit('candidate-action stored-file loop missing')
          candidate.write_text(text, encoding='utf-8')

          ingest = Path('supabase/functions/recruitment-ingest-telegram-file/index.ts')
          text = ingest.read_text(encoding='utf-8')
          row_type = '''type JsonMap = Record<string, unknown>;\n\ntype TelegramFileRow = {\n  id: string;\n  company_id: string;\n  application_id: string;\n  telegram_file_id: string | null;\n  storage_bucket: string | null;\n  storage_path: string | null;\n  original_name: string | null;\n  mime_type: string | null;\n  size_bytes: number | null;\n  document_type?: string | null;\n};\n'''
          if 'type TelegramFileRow = {' not in text:
              if marker not in text:
                  raise SystemExit('telegram-ingest JsonMap marker missing')
              text = text.replace(marker, row_type, 1)
          guard = '    if (!data) return json({ error: "row not found" }, 404);\n'
          typed_guard = guard + '    const row = data as unknown as TelegramFileRow;\n'
          if 'const row = data as unknown as TelegramFileRow;' not in text:
              if guard not in text:
                  raise SystemExit('telegram-ingest data guard missing')
              text = text.replace(guard, typed_guard, 1)
          head, sep, tail = text.partition('    const row = data as unknown as TelegramFileRow;\n')
          if not sep:
              raise SystemExit('telegram-ingest typed row missing')
          ingest.write_text(head + sep + tail.replace('data.', 'row.'), encoding='utf-8')

          migration_dir = Path('supabase/migrations')
          groups = defaultdict(list)
          used = set()
          for path in sorted(migration_dir.glob('*.sql')):
              match = re.match(r'^(\d{14})_(.+)$', path.name)
              if not match:
                  continue
              groups[match.group(1)].append(path)
              used.add(match.group(1))
          renames = []
          for version, paths in sorted(groups.items()):
              if len(paths) < 2:
                  continue
              current = datetime.strptime(version, '%Y%m%d%H%M%S')
              for path in sorted(paths)[1:]:
                  while True:
                      current += timedelta(seconds=1)
                      candidate_version = current.strftime('%Y%m%d%H%M%S')
                      if candidate_version not in used:
                          break
                  used.add(candidate_version)
                  target = path.with_name(candidate_version + path.name[14:])
                  path.rename(target)
                  renames.append((path.name, target.name))
          report = Path('docs/full-acceptance-test-runs/2026-08-04-migration-renames.md')
          lines = [
              '# Нормализация версий SQL-миграций', '',
              'Повторяющиеся версии заменены ближайшими свободными секундами.',
              'Содержимое SQL не изменялось.', '',
              'Перед production deploy нужно сверить `supabase_migrations.schema_migrations`',
              'и при необходимости выполнить штатный `supabase migration repair`.', '',
              '## Переименования', '',
              *[f'- `{old}` → `{new}`' for old, new in renames],
          ]
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8').replace(
              'file_saver: ^0.2.14', 'file_saver: ^0.4.0'
          )
          pubspec.write_text(text, encoding='utf-8')
          saver_files = [
              'lib/features/ai/presentation/ai_exact_document_screen.dart',
              'lib/features/recruitment/data/candidate_onboarding_package_service.dart',
              'lib/features/recruitment/data/candidate_package_service.dart',
              'lib/features/recruitment/presentation/recruitment_application_detail_screen.dart',
              'lib/features/recruitment/presentation/recruitment_import_screen.dart',
          ]
          changed_ext = 0
          for name in saver_files:
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'(?m)^(\s*)ext:', r'\1fileExtension:', source)
              path.write_text(updated, encoding='utf-8')
              changed_ext += count
          if changed_ext != 6:
              raise SystemExit(f'Expected 6 file_saver ext arguments, changed {changed_ext}')
          PY

      - name: Vendor and patch file_saver Web implementation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import json
          import re
          import shutil

          config = json.loads(Path('.dart_tool/package_config.json').read_text(encoding='utf-8'))
          package = next(item for item in config['packages'] if item['name'] == 'file_saver')
          uri = urlparse(package['rootUri'])
          if uri.scheme != 'file':
              raise SystemExit(f'Unexpected file_saver root URI: {package["rootUri"]}')
          source = Path(unquote(uri.path)).resolve()
          while source != source.parent and not (source / 'pubspec.yaml').is_file():
              source = source.parent
          if not (source / 'pubspec.yaml').is_file():
              raise SystemExit(f'Could not locate file_saver package root from {package["rootUri"]}')
          package_name = (source / 'pubspec.yaml').read_text(encoding='utf-8')
          if not re.search(r'(?m)^name:\s*file_saver\s*$', package_name):
              raise SystemExit(f'Located package root is not file_saver: {source}')

          target = Path('third_party/file_saver')
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(
              source,
              target,
              ignore=shutil.ignore_patterns('.dart_tool', 'build', '.git', 'example', 'test', 'pubspec.lock'),
          )

          matches = list(target.rglob('file_saver_web.dart'))
          if len(matches) != 1:
              raise SystemExit(f'Expected one file_saver_web.dart, found {len(matches)}: {matches}')
          web_file = matches[0]
          text = web_file.read_text(encoding='utf-8')
          replacements = {
              'web.Url.revokeObjectUrl': 'web.URL.revokeObjectURL',
              'web.Url.createObjectUrlFromBlob': 'web.URL.createObjectURL',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected upstream Web call not found: {old}')
              text = text.replace(old, new)
          web_file.write_text(text, encoding='utf-8')

          (target / 'APPSTROY_PATCH.md').write_text(
              '# AppСтрой compatibility patch\n\n'
              'Vendored from `file_saver` 0.4.0 under its BSD-3-Clause license.\n\n'
              'The Web implementation uses the current `package:web` '\
              '`web.URL.createObjectURL` and `web.URL.revokeObjectURL` APIs. '\
              'No plugin business behavior was changed.\n',
              encoding='utf-8',
          )

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(?m)^  file_saver: \^0\.4\.0$',
              '  file_saver:\n    path: third_party/file_saver',
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one file_saver dependency, changed {count}')
          pubspec.write_text(text, encoding='utf-8')
          PY
          flutter pub get
          dart format third_party/file_saver/lib

      - name: Format and verify Dart
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test third_party/file_saver/lib

      - name: Check every Edge TypeScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            deno check "$file"
          done < <(find supabase/functions -type f -name '*.ts' -print0 | sort -z)

      - name: Validate all SQL migration versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          versions = []
          for path in sorted(Path('supabase/migrations').glob('*.sql')):
              match = re.match(r'^(\d{14})_', path.name)
              if not match:
                  raise SystemExit(f'Invalid migration name: {path.name}')
              if not path.read_text(encoding='utf-8', errors='replace').strip():
                  raise SystemExit(f'Empty migration: {path.name}')
              versions.append(match.group(1))
          duplicates = [v for v, count in Counter(versions).items() if count > 1]
          if duplicates:
              raise SystemExit('Duplicate migration versions: ' + ', '.join(sorted(duplicates)))
          print(f'Validated {len(versions)} unique migrations')
          PY

      - name: Analyze, test and build Web
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub -j 1
          flutter build web --release --no-pub

      - name: Remove one-time fixers and commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-confirmed-fixes.yml
          rm -f .github/workflows/apply-confirmed-fixes-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Исправить все результаты полного приёмочного теста'
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'agent/full-acceptance-test-2026-08-04' }}
