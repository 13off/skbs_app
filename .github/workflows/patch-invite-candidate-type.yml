name: Patch invite candidate type

on:
  push:
    branches:
      - codex/procurement-panel-mvp-20260801
    paths:
      - tool/patch_invite_candidate_type.py
      - .github/workflows/patch-invite-candidate-type.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/procurement-panel-mvp-20260801
          fetch-depth: 0

      - name: Patch candidate type
        run: python3 tool/patch_invite_candidate_type.py

      - name: Commit patched file
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/invite-company-member-core/index.ts
          git commit -m "Исправить тип пользователя в приглашениях"
          git push origin HEAD:codex/procurement-panel-mvp-20260801
