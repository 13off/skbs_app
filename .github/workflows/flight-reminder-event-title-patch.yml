name: Apply flight reminder event and title patch

on:
  push:
    branches:
      - feature/flight-reminder-event-title
    paths:
      - .github/workflows/flight-reminder-event-title-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flight-reminder-event-title
          fetch-depth: 0
      - name: Patch reminder event and title
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          model = 'lib/features/recruitment/models/recruitment_flight_models.dart'
          replace_once(model,
          '''class RecruitmentFlightReminder {
            final String id;
            final String companyId;
            final String flightId;
            final DateTime remindAt;
            final DateTime? sentAt;

            const RecruitmentFlightReminder({
              this.id = '',
              this.companyId = '',
              this.flightId = '',
              required this.remindAt,
              this.sentAt,
            });

            bool get isSent => sentAt != null;

            String get label {
              final local = remindAt.toLocal();
              final day = local.day.toString().padLeft(2, '0');
              final month = local.month.toString().padLeft(2, '0');
              final hour = local.hour.toString().padLeft(2, '0');
              final minute = local.minute.toString().padLeft(2, '0');
              return '$day.$month.${local.year} · $hour:$minute';
            }

            Map<String, dynamic> toPayload() => <String, dynamic>{
              'remind_at': remindAt.toUtc().toIso8601String(),
            };

            factory RecruitmentFlightReminder.fromMap(Map<String, dynamic> map) {
              DateTime? optionalDate(dynamic value) {
                final text = value?.toString().trim() ?? '';
                return text.isEmpty ? null : DateTime.tryParse(text)?.toLocal();
              }

              return RecruitmentFlightReminder(
                id: map['id']?.toString() ?? '',
                companyId: map['company_id']?.toString() ?? '',
                flightId: map['flight_id']?.toString() ?? '',
                remindAt:
                    optionalDate(map['remind_at']) ??
                    optionalDate(map['created_at']) ??
                    DateTime.now(),
                sentAt: optionalDate(map['sent_at']),
              );
            }
          }''',
          '''class RecruitmentFlightReminder {
            final String id;
            final String companyId;
            final String flightId;
            final String eventKind;
            final String title;
            final DateTime remindAt;
            final DateTime? sentAt;

            const RecruitmentFlightReminder({
              this.id = '',
              this.companyId = '',
              this.flightId = '',
              this.eventKind = 'departure',
              this.title = '',
              required this.remindAt,
              this.sentAt,
            });

            bool get isSent => sentAt != null;
            bool get isArrival => eventKind == 'arrival';
            String get eventTitle => isArrival ? 'Прибытие' : 'Отправление';
            String get displayTitle => title.trim().isEmpty ? eventTitle : title.trim();

            String get label {
              final local = remindAt.toLocal();
              final day = local.day.toString().padLeft(2, '0');
              final month = local.month.toString().padLeft(2, '0');
              final hour = local.hour.toString().padLeft(2, '0');
              final minute = local.minute.toString().padLeft(2, '0');
              return '$day.$month.${local.year} · $hour:$minute';
            }

            Map<String, dynamic> toPayload() => <String, dynamic>{
              'event_kind': eventKind,
              'reminder_title': title.trim(),
              'remind_at': remindAt.toUtc().toIso8601String(),
            };

            factory RecruitmentFlightReminder.fromMap(Map<String, dynamic> map) {
              DateTime? optionalDate(dynamic value) {
                final text = value?.toString().trim() ?? '';
                return text.isEmpty ? null : DateTime.tryParse(text)?.toLocal();
              }

              final rawEvent = map['event_kind']?.toString().trim() ?? '';
              return RecruitmentFlightReminder(
                id: map['id']?.toString() ?? '',
                companyId: map['company_id']?.toString() ?? '',
                flightId: map['flight_id']?.toString() ?? '',
                eventKind: rawEvent == 'arrival' ? 'arrival' : 'departure',
                title: map['reminder_title']?.toString() ?? '',
                remindAt:
                    optionalDate(map['remind_at']) ??
                    optionalDate(map['created_at']) ??
                    DateTime.now(),
                sentAt: optionalDate(map['sent_at']),
              );
            }
          }''')

          repo = 'lib/features/recruitment/data/recruitment_flight_repository.dart'
          replace_once(repo,
          '''    final reminderKeys = <String>{};
              for (final reminder in reminders) {
                final local = reminder.remindAt.toLocal();''',
          '''    final reminderKeys = <String>{};
              for (final reminder in reminders) {
                if (reminder.eventKind != 'departure' && reminder.eventKind != 'arrival') {
                  throw Exception('Выберите отправление или прибытие');
                }
                if (reminder.title.trim().isEmpty) {
                  throw Exception('Укажите название уведомления');
                }
                if (reminder.title.trim().length > 120) {
                  throw Exception('Название уведомления должно быть короче 120 символов');
                }
                if (reminder.eventKind == 'arrival' && arrivalAt == null) {
                  throw Exception('Для уведомления о прибытии укажите время прибытия');
                }
                final local = reminder.remindAt.toLocal();''')

          screen = 'lib/features/recruitment/presentation/recruitment_flight_calendar_screen.dart'
          replace_once(screen,
          '''  Future<void> addReminder() async {
              final now = DateTime.now();
              final initial = DateTime(
                now.year,
                now.month,
                now.day,
                now.hour,
                now.minute,
              ).add(const Duration(hours: 1));
              final value = await chooseDateTime(initial);
              if (value == null || !mounted) return;

              final normalized = DateTime(
                value.year,
                value.month,
                value.day,
                value.hour,
                value.minute,
              );
              if (!normalized.isAfter(DateTime.now())) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Выберите будущие дату и время уведомления')),
                );
                return;
              }
              final duplicate = reminders.any((item) {
                final current = item.remindAt.toLocal();
                return current.year == normalized.year &&
                    current.month == normalized.month &&
                    current.day == normalized.day &&
                    current.hour == normalized.hour &&
                    current.minute == normalized.minute;
              });
              if (duplicate) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Уведомление на это время уже добавлено')),
                );
                return;
              }
              setState(
                () => reminders.add(RecruitmentFlightReminder(remindAt: normalized)),
              );
            }''',
          '''  Future<void> addReminder() async {
              final titleController = TextEditingController();
              var selectedEvent = 'departure';
              final setup = await showDialog<Map<String, String>>(
                context: context,
                builder: (dialogContext) => StatefulBuilder(
                  builder: (dialogContext, setDialogState) => AlertDialog(
                    title: const Text('Новое уведомление'),
                    content: SizedBox(
                      width: 420,
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          const Text(
                            'Событие',
                            style: TextStyle(fontWeight: FontWeight.w800),
                          ),
                          const SizedBox(height: 8),
                          SegmentedButton<String>(
                            segments: const <ButtonSegment<String>>[
                              ButtonSegment<String>(
                                value: 'departure',
                                icon: Icon(Icons.flight_takeoff_rounded),
                                label: Text('Отправление'),
                              ),
                              ButtonSegment<String>(
                                value: 'arrival',
                                icon: Icon(Icons.flight_land_rounded),
                                label: Text('Прибытие'),
                              ),
                            ],
                            selected: <String>{selectedEvent},
                            onSelectionChanged: (values) => setDialogState(
                              () => selectedEvent = values.first,
                            ),
                          ),
                          const SizedBox(height: 14),
                          TextField(
                            controller: titleController,
                            autofocus: true,
                            maxLength: 120,
                            textCapitalization: TextCapitalization.sentences,
                            decoration: const InputDecoration(
                              labelText: 'Название уведомления',
                              hintText: 'Например: проверить регистрацию',
                              prefixIcon: Icon(Icons.label_outline_rounded),
                            ),
                            onChanged: (_) => setDialogState(() {}),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.of(dialogContext).pop(),
                        child: const Text('Отмена'),
                      ),
                      FilledButton(
                        onPressed: titleController.text.trim().isEmpty
                            ? null
                            : () => Navigator.of(dialogContext).pop(
                                <String, String>{
                                  'event_kind': selectedEvent,
                                  'title': titleController.text.trim(),
                                },
                              ),
                        child: const Text('Далее'),
                      ),
                    ],
                  ),
                ),
              );
              titleController.dispose();
              if (setup == null || !mounted) return;

              final eventKind = setup['event_kind'] ?? 'departure';
              final title = setup['title']?.trim() ?? '';
              if (eventKind == 'arrival' && arrivalAt == null) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Сначала укажите время прибытия рейса'),
                  ),
                );
                return;
              }

              final now = DateTime.now();
              final eventAt = eventKind == 'arrival' ? arrivalAt : departureAt;
              final suggested = eventAt != null && eventAt.isAfter(now)
                  ? eventAt
                  : now.add(const Duration(hours: 1));
              final initial = DateTime(
                suggested.year,
                suggested.month,
                suggested.day,
                suggested.hour,
                suggested.minute,
              );
              final value = await chooseDateTime(initial);
              if (value == null || !mounted) return;

              final normalized = DateTime(
                value.year,
                value.month,
                value.day,
                value.hour,
                value.minute,
              );
              if (!normalized.isAfter(DateTime.now())) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Выберите будущие дату и время уведомления')),
                );
                return;
              }
              final duplicate = reminders.any((item) {
                final current = item.remindAt.toLocal();
                return current.year == normalized.year &&
                    current.month == normalized.month &&
                    current.day == normalized.day &&
                    current.hour == normalized.hour &&
                    current.minute == normalized.minute;
              });
              if (duplicate) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Уведомление на это время уже добавлено')),
                );
                return;
              }
              setState(
                () => reminders.add(
                  RecruitmentFlightReminder(
                    eventKind: eventKind,
                    title: title,
                    remindAt: normalized,
                  ),
                ),
              );
            }''')

          replace_once(screen,
          '''                          Text(
                            reminder.label,
                            style: const TextStyle(fontWeight: FontWeight.w800),
                          ),
                          if (reminder.isSent)''',
          '''                          Text(
                            reminder.displayTitle,
                            style: const TextStyle(fontWeight: FontWeight.w900),
                          ),
                          const SizedBox(height: 2),
                          Text(
                            '${reminder.eventTitle} · ${reminder.label}',
                            style: TextStyle(
                              color: AppAdaptivePalette.textMuted,
                              fontSize: 12,
                              fontWeight: FontWeight.w700,
                            ),
                          ),
                          if (reminder.isSent)''')

          test = 'test/flight_reminders_timesheet_period_test.dart'
          replace_once(test,
          '''  test('flight reminder stores exact chosen date and time', () {
              final reminder = RecruitmentFlightReminder(
                remindAt: DateTime(2026, 8, 25, 18, 30),
              );

              expect(reminder.label, '25.08.2026 · 18:30');
              expect(
                reminder.toPayload()['remind_at'],
                reminder.remindAt.toUtc().toIso8601String(),
              );
            });''',
          '''  test('flight reminder stores event, title and exact chosen date and time', () {
              final reminder = RecruitmentFlightReminder(
                eventKind: 'arrival',
                title: 'Встретить сотрудника',
                remindAt: DateTime(2026, 8, 25, 18, 30),
              );

              expect(reminder.eventTitle, 'Прибытие');
              expect(reminder.displayTitle, 'Встретить сотрудника');
              expect(reminder.label, '25.08.2026 · 18:30');
              expect(reminder.toPayload()['event_kind'], 'arrival');
              expect(reminder.toPayload()['reminder_title'], 'Встретить сотрудника');
              expect(
                reminder.toPayload()['remind_at'],
                reminder.remindAt.toUtc().toIso8601String(),
              );
            });''')

          replace_once(test,
          '''  test('flight editor asks only for reminder date and time', () {''',
          '''  test('flight editor keeps event choice, custom title and exact reminder time', () {''')
          replace_once(test,
          '''    expect(source, contains('RecruitmentFlightReminder(remindAt: normalized)'));
              expect(source, isNot(contains("labelText: 'Событие'")));
              expect(source, isNot(contains("labelText: 'Когда напомнить'")));''',
          '''    expect(source, contains("labelText: 'Название уведомления'"));
              expect(source, contains("Text('Отправление')"));
              expect(source, contains("Text('Прибытие')"));
              expect(source, contains('eventKind: eventKind'));
              expect(source, contains('title: title'));
              expect(source, isNot(contains("labelText: 'Когда напомнить'")));''')

          Path('supabase/migrations/20260820024000_flight_reminder_event_and_title.sql').write_text(r'''-- Restore departure/arrival context for personal flight reminders and add a custom title.
          alter table public.recruitment_flight_reminders
            add column if not exists reminder_title text not null default '';

          create index if not exists recruitment_flight_reminders_target_user_idx
            on public.recruitment_flight_reminders(target_user_id);

          create or replace function public.replace_recruitment_flight_reminders(
            p_flight_id uuid,
            p_reminders jsonb default '[]'::jsonb
          )
          returns void
          language plpgsql
          security definer
          set search_path = ''
          as $$
          declare
            v_company_id uuid := public.current_user_company_id();
            v_user_id uuid := (select auth.uid());
            v_item jsonb;
            v_remind_at timestamptz;
            v_event_kind text;
            v_title text;
            v_offset_minutes integer;
          begin
            if v_user_id is null or v_company_id is null then
              raise exception 'Нет активной сессии компании';
            end if;
            if not public.current_user_has_permission('recruitment.applications.edit') then
              raise exception 'Недостаточно прав для изменения уведомлений';
            end if;
            if not exists (
              select 1 from public.recruitment_flights flight
              where flight.id = p_flight_id and flight.company_id = v_company_id
            ) then
              raise exception 'Вылет не найден в выбранной компании';
            end if;
            if jsonb_typeof(coalesce(p_reminders, '[]'::jsonb)) <> 'array' then
              raise exception 'Некорректный список уведомлений';
            end if;
            if jsonb_array_length(coalesce(p_reminders, '[]'::jsonb)) > 20 then
              raise exception 'Для одного вылета можно добавить не больше 20 уведомлений';
            end if;

            delete from public.recruitment_flight_reminders reminder
            where reminder.company_id = v_company_id
              and reminder.flight_id = p_flight_id
              and reminder.target_user_id = v_user_id
              and not exists (
                select 1
                from jsonb_array_elements(coalesce(p_reminders, '[]'::jsonb)) item
                where item ? 'remind_at'
                  and date_trunc('minute', (item->>'remind_at')::timestamptz)
                    = date_trunc('minute', reminder.remind_at)
              );

            for v_item in
              select value from jsonb_array_elements(coalesce(p_reminders, '[]'::jsonb))
            loop
              v_event_kind := case when v_item->>'event_kind' = 'arrival'
                then 'arrival' else 'departure' end;
              v_title := btrim(coalesce(v_item->>'reminder_title', v_item->>'title', ''));

              if v_item ? 'remind_at' then
                begin
                  v_remind_at := date_trunc('minute', (v_item->>'remind_at')::timestamptz);
                exception when others then
                  raise exception 'Некорректные дата или время уведомления';
                end;
              else
                begin
                  v_offset_minutes := (v_item->>'offset_minutes')::integer;
                exception when others then
                  raise exception 'Некорректное время уведомления';
                end;
                select date_trunc(
                  'minute',
                  (case when v_event_kind = 'arrival' then flight.arrival_at else flight.departure_at end)
                    - make_interval(mins => greatest(v_offset_minutes, 0))
                ) into v_remind_at
                from public.recruitment_flights flight
                where flight.id = p_flight_id and flight.company_id = v_company_id;
              end if;

              if v_remind_at is null then
                raise exception 'Укажите дату и время уведомления';
              end if;
              if v_event_kind = 'arrival' and not exists (
                select 1 from public.recruitment_flights flight
                where flight.id = p_flight_id
                  and flight.company_id = v_company_id
                  and flight.arrival_at is not null
              ) then
                raise exception 'Для уведомления о прибытии укажите время прибытия';
              end if;
              if v_title = '' then
                v_title := case when v_event_kind = 'arrival'
                  then 'Напоминание о прибытии' else 'Напоминание об отправлении' end;
              end if;
              if char_length(v_title) > 120 then
                raise exception 'Название уведомления должно быть короче 120 символов';
              end if;
              if v_remind_at <= now() and not exists (
                select 1 from public.recruitment_flight_reminders reminder
                where reminder.company_id = v_company_id
                  and reminder.flight_id = p_flight_id
                  and reminder.target_user_id = v_user_id
                  and reminder.remind_at = v_remind_at
                  and reminder.sent_at is not null
              ) then
                raise exception 'Дата и время уведомления уже прошли';
              end if;

              insert into public.recruitment_flight_reminders(
                company_id, flight_id, event_kind, offset_minutes, remind_at,
                reminder_title, target_user_id, created_by, updated_by
              ) values (
                v_company_id, p_flight_id, v_event_kind, 0, v_remind_at,
                v_title, v_user_id, v_user_id, v_user_id
              )
              on conflict (flight_id, target_user_id, remind_at) do update
                set event_kind = excluded.event_kind,
                    reminder_title = excluded.reminder_title,
                    updated_by = excluded.updated_by,
                    updated_at = now();
            end loop;

            update public.recruitment_flights
            set remind_day_before = false,
                remind_three_hours = false,
                updated_by = v_user_id,
                updated_at = now()
            where id = p_flight_id and company_id = v_company_id;
          end;
          $$;

          revoke all on function public.replace_recruitment_flight_reminders(uuid,jsonb)
            from public, anon;
          grant execute on function public.replace_recruitment_flight_reminders(uuid,jsonb)
            to authenticated;

          create or replace function private.process_due_recruitment_flight_personal_reminders()
          returns integer
          language plpgsql
          security definer
          set search_path = ''
          as $$
          declare
            v_due record;
            v_body text;
            v_departure_local timestamp;
            v_arrival_local timestamp;
            v_count integer := 0;
          begin
            for v_due in
              select
                reminder.id as reminder_id,
                reminder.company_id,
                reminder.target_user_id,
                reminder.remind_at,
                reminder.event_kind,
                reminder.reminder_title,
                flight.id as flight_id,
                flight.origin,
                flight.destination,
                flight.flight_number,
                flight.departure_at,
                flight.arrival_at,
                coalesce(application.full_name, 'Сотрудник') as full_name,
                coalesce(object_row.name, '') as object_name
              from public.recruitment_flight_reminders reminder
              join public.recruitment_flights flight
                on flight.company_id = reminder.company_id and flight.id = reminder.flight_id
              left join public.recruitment_applications application
                on application.company_id = flight.company_id and application.id = flight.application_id
              left join public.objects object_row
                on object_row.company_id = flight.company_id and object_row.id = flight.object_id
              where reminder.sent_at is null
                and reminder.remind_at <= now()
                and flight.status <> 'cancelled'
              order by reminder.remind_at, reminder.id
              for update of reminder skip locked
            loop
              v_departure_local := v_due.departure_at at time zone 'Europe/Moscow';
              v_arrival_local := case when v_due.arrival_at is null
                then null else v_due.arrival_at at time zone 'Europe/Moscow' end;

              v_body := case when v_due.event_kind = 'arrival'
                  then 'Прибытие. ' else 'Отправление. ' end ||
                v_due.full_name || '. ' ||
                btrim(v_due.origin) || ' → ' || btrim(v_due.destination) || '. ' ||
                'Вылет ' || to_char(v_departure_local, 'DD.MM.YYYY в HH24:MI') || '.' ||
                case when v_arrival_local is null then ''
                  else ' Прибытие ' || to_char(v_arrival_local, 'DD.MM.YYYY в HH24:MI') || '.' end ||
                case when btrim(v_due.flight_number) = '' then ''
                  else ' Рейс ' || btrim(v_due.flight_number) || '.' end;

              insert into public.app_notifications(
                title, body, actor_user_id, actor_name, actor_email, object_name,
                entity_type, entity_id, company_id, target_user_id, target_role,
                requires_action, due_at, priority, source_role, is_push_only, push_requested
              ) values (
                coalesce(nullif(btrim(v_due.reminder_title), ''), 'Напоминание о вылете'),
                v_body,
                null,
                'AppСтрой',
                '',
                v_due.object_name,
                'recruitment_flight_reminder',
                v_due.flight_id::text,
                v_due.company_id,
                v_due.target_user_id,
                null,
                false,
                v_due.remind_at,
                'normal',
                'hr',
                false,
                true
              );

              update public.recruitment_flight_reminders
              set sent_at = now(), updated_at = now()
              where id = v_due.reminder_id and sent_at is null;
              v_count := v_count + 1;
            end loop;
            return v_count;
          end;
          $$;

          revoke all on function private.process_due_recruitment_flight_personal_reminders()
            from public, anon, authenticated;
          ''')
          PY
      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/recruitment/models/recruitment_flight_models.dart \
                  lib/features/recruitment/data/recruitment_flight_repository.dart \
                  lib/features/recruitment/presentation/recruitment_flight_calendar_screen.dart \
                  test/flight_reminders_timesheet_period_test.dart \
                  supabase/migrations/20260820024000_flight_reminder_event_and_title.sql
          git commit -m 'Вылеты: вернуть отправление/прибытие и название уведомления'
          git push origin HEAD:feature/flight-reminder-event-title
