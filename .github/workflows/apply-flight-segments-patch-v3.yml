name: Apply flight segments patch v3

on:
  push:
    branches:
      - feature/recruitment-flight-segments-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/recruitment-flight-segments-20260901
          fetch-depth: 0
      - name: Apply structural patch
        shell: bash
        run: |
          python3 tools/apply_flight_segments_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-flight-segments-patch.yml \
            .github/workflows/apply-flight-segments-patch-v2.yml \
            .github/workflows/apply-flight-segments-patch-v3.yml \
            tools/apply_flight_segments_patch.py
          git add lib/features/recruitment/models/recruitment_flight_models.dart \
            lib/features/recruitment/data/recruitment_flight_repository.dart \
            lib/features/recruitment/presentation/recruitment_flight_calendar_screen.dart \
            test/recruitment_flight_segments_contract_test.dart
          git commit -m "Recruitment: поддержать поездки с пересадками"
          git push origin HEAD:feature/recruitment-flight-segments-20260901
