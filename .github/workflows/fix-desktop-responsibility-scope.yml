name: Fix desktop responsibility scope

on:
  push:
    branches:
      - feature/task-timesheet-responsibility-20260822
    paths:
      - .github/workflows/fix-desktop-responsibility-scope.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/task-timesheet-responsibility-20260822
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: python3 tooling/fix_desktop_responsibility_scope.py
      - run: dart format lib/screens/desktop_timesheet_screen.dart
      - name: Commit fix
        run: |
          rm -f tooling/fix_desktop_responsibility_scope.py .github/workflows/fix-desktop-responsibility-scope.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Исправить desktop отображение ответственного'
          git push origin HEAD:feature/task-timesheet-responsibility-20260822
