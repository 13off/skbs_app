name: Apply mobile expenses alignment

on:
  push:
    branches:
      - fix/mobile-expenses-alignment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-expenses-alignment
          fetch-depth: 0
      - name: Align mobile expense cards
        run: python3 .github/scripts/align_mobile_expenses.py
      - name: Remove temporary patch helpers and commit
        run: |
          rm .github/scripts/align_mobile_expenses.py
          rm .github/workflows/tmp-align-mobile-expenses.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: выровнять карточки расходов на телефоне"
          git push origin HEAD:fix/mobile-expenses-alignment
