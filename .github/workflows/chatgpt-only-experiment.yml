name: ChatGPT only experiment

on:
  push:
    branches:
      - main
    paths:
      - release/chatgpt-only-experiment.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Hide legacy AI voice and present one ChatGPT surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Dedicated assistant thread becomes the only visible AI surface.
          chat = Path('lib/features/company_chat/presentation/company_chat_shell.dart')
          text = chat.read_text(encoding='utf-8')

          replacements = {
              "showMessage('ИИ-помощник временно недоступен');": "showMessage('ChatGPT временно недоступен');",
              "showMessage('ИИ не ответил: ${_error(error)}');": "showMessage('ChatGPT не ответил: ${_error(error)}');",
              "? 'Личный диалог с ИИ-помощником'": "? 'ChatGPT с доступом к AppСтрой'",
              "assistant ? 'Спроси ИИ-помощника' : 'Сообщений пока нет'": "assistant ? 'Напиши ChatGPT' : 'Сообщений пока нет'",
              "? 'Помощник работает в отдельном личном диалоге и не отправляет ответы в общий чат.'": "? 'Обычный ChatGPT, подключённый к данным и действиям AppСтрой.'",
              "assistant ? 'ИИ-помощник' : message.senderName": "assistant ? 'ChatGPT' : message.senderName",
              "? 'ИИ-помощник временно недоступен'": "? 'ChatGPT временно недоступен'",
              "? 'Сообщение ИИ-помощнику…'": "? 'Сообщение ChatGPT…'",
              "? 'Отправить ИИ'": "? 'Отправить ChatGPT'",
              "? 'Помощник AppСтрой'": "? 'Подключён к AppСтрой'",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          old_title = """                      Text(\n                        thread.title,\n                        maxLines: 1,\n"""
          new_title = """                      Text(\n                        assistant ? 'ChatGPT' : thread.title,\n                        maxLines: 1,\n"""
          if old_title in text:
              text = text.replace(old_title, new_title, 1)
          elif "assistant ? 'ChatGPT' : thread.title" not in text:
              raise SystemExit('assistant title anchor not found')

          if '_chatGptCutover' not in text:
              anchor = 'const bool _aiAssistantLocked = false;\n'
              if anchor not in text:
                  raise SystemExit('AI lock anchor not found')
              text = text.replace(
                  anchor,
                  anchor + "final DateTime _chatGptCutover = DateTime.parse('2026-08-11T11:19:00Z');\n",
                  1,
              )

          old_fetch = """  Future<List<CompanyChatMessage>> _fetchThreadMessages(\n    CompanyChatThread thread,\n  ) {\n    return CompanyChatRepository.fetchFeed(\n      limit: 120,\n      channelKind: thread.channelKind,\n      peerUserId: thread.peerUserId,\n    );\n  }\n"""
          new_fetch = """  Future<List<CompanyChatMessage>> _fetchThreadMessages(\n    CompanyChatThread thread,\n  ) async {\n    final values = await CompanyChatRepository.fetchFeed(\n      limit: 120,\n      channelKind: thread.channelKind,\n      peerUserId: thread.peerUserId,\n    );\n    if (!thread.isAssistant) return values;\n    return values\n        .where((item) => !item.createdAt.toUtc().isBefore(_chatGptCutover))\n        .toList(growable: false);\n  }\n"""
          if old_fetch in text:
              text = text.replace(old_fetch, new_fetch, 1)
          elif 'isBefore(_chatGptCutover)' not in text:
              raise SystemExit('assistant feed anchor not found')

          chat.write_text(text, encoding='utf-8')

          # Old AI inside the general company chat is hidden and cannot trigger.
          old_chat = Path('lib/features/company_chat/presentation/company_chat_screen.dart')
          old_text = old_chat.read_text(encoding='utf-8')
          old_text = old_text.replace(
              '..addAll(values[0] as List<CompanyChatMessage>);',
              "..addAll((values[0] as List<CompanyChatMessage>).where((item) => !item.isAssistant));",
              1,
          )
          old_text = old_text.replace(
              'final next = await CompanyChatRepository.fetchFeed(limit: 150);',
              "final next = (await CompanyChatRepository.fetchFeed(limit: 150))\n          .where((item) => !item.isAssistant)\n          .toList(growable: false);",
              1,
          )
          old_text = old_text.replace('canUseAi = values[2] == true;', 'canUseAi = false;', 1)
          old_text = old_text.replace(
              "'${members.length} участников · ИИ-помощник внутри'",
              "'${members.length} участников'",
              1,
          )
          old_text = old_text.replace(
              "canUseAi\n                    ? 'Напиши коллегам или включи ИИ-помощника перед отправкой.'\n                    : 'Напиши первое сообщение коллегам.'",
              "'Напиши первое сообщение коллегам.'",
              1,
          )
          old_chat.write_text(old_text, encoding='utf-8')

          # Global microphone/voice layer stays disconnected during this experiment.
          main = Path('lib/main.dart')
          main_text = main.read_text(encoding='utf-8')
          main_text = main_text.replace(
              "import 'features/voice/presentation/global_voice_root_layer.dart';\n",
              '',
          )
          old_wrapper = """            child: GlobalVoiceRootLayer(\n              child: child ?? const SizedBox.shrink(),\n            ),\n"""
          if old_wrapper in main_text:
              main_text = main_text.replace(
                  old_wrapper,
                  "            child: child ?? const SizedBox.shrink(),\n",
                  1,
              )
          main.write_text(main_text, encoding='utf-8')

          test = Path('test/chatgpt_only_experiment_contract_test.dart')
          test.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('only ChatGPT is exposed as the experimental AI surface', () {
    final shell = File(
      'lib/features/company_chat/presentation/company_chat_shell.dart',
    ).readAsStringSync();
    final generalChat = File(
      'lib/features/company_chat/presentation/company_chat_screen.dart',
    ).readAsStringSync();
    final repo = File(
      'lib/features/company_chat/data/company_chat_repository.dart',
    ).readAsStringSync();
    final main = File('lib/main.dart').readAsStringSync();

    expect(shell, contains("assistant ? 'ChatGPT' : thread.title"));
    expect(shell, contains('ChatGPT с доступом к AppСтрой'));
    expect(shell, contains('Сообщение ChatGPT…'));
    expect(shell, contains('isBefore(_chatGptCutover)'));
    expect(repo, contains("'company-chat-gpt'"));
    expect(generalChat, contains('canUseAi = false'));
    expect(generalChat, contains('where((item) => !item.isAssistant)'));
    expect(main, isNot(contains('GlobalVoiceRootLayer')));
  });
}
""", encoding='utf-8')
          PY

      - name: Format
        run: dart format lib/main.dart lib/features/company_chat/presentation/company_chat_shell.dart lib/features/company_chat/presentation/company_chat_screen.dart lib/features/company_chat/data/company_chat_repository.dart test/chatgpt_only_experiment_contract_test.dart

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run focused test
        run: flutter test test/chatgpt_only_experiment_contract_test.dart --reporter compact

      - name: Analyze changed Flutter files
        run: flutter analyze lib/main.dart lib/features/company_chat/presentation/company_chat_shell.dart lib/features/company_chat/presentation/company_chat_screen.dart lib/features/company_chat/data/company_chat_repository.dart

      - name: Commit verified experiment
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-only-experiment.yml release/chatgpt-only-experiment.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Оставить один ChatGPT в приложении и скрыть старые ИИ-интерфейсы"
          git push
