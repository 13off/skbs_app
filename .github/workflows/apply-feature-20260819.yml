name: Apply feature patch 20260819

on:
  push:
    branches:
      - feature/flight-reminders-timesheet-period
    paths:
      - tool/fix_feature_20260819.py
      - .github/workflows/apply-feature-20260819.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply feature cleanup
        run: python3 tool/fix_feature_20260819.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: validate flight reminders before persistence"
          git push origin HEAD:feature/flight-reminders-timesheet-period
